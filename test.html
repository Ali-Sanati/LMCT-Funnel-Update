     LMCT+ FIELD SALES — CLICKFUNNELS CLASSIC TRACKING
     ========================================================= -->

<script>
  /**************************
   * Copyright 2023 FunnelCare LLC, All Rights Reserved
   * Do not share, or distribute this code without author's consent.
   * This copyright notice must remain in place whenever using
   * this code - DO NOT REMOVE
   * Author - Tareq Mahmud
   * Website: https://www.funnelcare.net
   **************************/

  (function ($) {
    "use strict";

    /* =========================================================
     1. CENTRAL CONFIGURATION
     ========================================================= */

    var LMCT_FIELD_SALES = {
      products: {
        package99: {
          key: "package99",
          id: "5114181",
          name: "LMCT+ Elite Monthly",
          price: 99.99,
        },

        package199: {
          key: "package199",
          id: "5114182",
          name: "LMCT+ Entry Yearly",
          price: 199.0,
        },
      },

      klaviyo: {
        companyId: "S9SGLM",
        listId: "SSnNm7",
        source: "CF1 Physical Sales Funnel",
      },

      productRetryDelays: [0, 150, 350, 700],
    };

    window.LMCT_FIELD_SALES = LMCT_FIELD_SALES;

    /* =========================================================
     2. SAFE SESSION STORAGE
     ========================================================= */

    function sessionSet(key, value) {
      try {
        sessionStorage.setItem(key, value);
      } catch (err) {}
    }

    function sessionGet(key) {
      try {
        return sessionStorage.getItem(key) || "";
      } catch (err) {
        return "";
      }
    }

    /* =========================================================
     3. SALES REPRESENTATIVE TRACKING
     ========================================================= */

    var queryParams = new URLSearchParams(window.location.search);

    function sanitizeSalesCode(value) {
      return String(value || "")
        .replace(/[^A-Za-z0-9_-]/g, "")
        .slice(0, 40);
    }

    function getRepFromUrl() {
      return sanitizeSalesCode(queryParams.get("rep") || queryParams.get("utm_content") || queryParams.get("sales_code") || "");
    }

    function getSalesRep() {
      var stored = sanitizeSalesCode(sessionGet("lmctFieldSalesRep"));

      if (stored) {
        return stored;
      }

      return getRepFromUrl();
    }

    function saveSalesRep(rep) {
      rep = sanitizeSalesCode(rep);

      if (!rep) return;

      sessionSet("lmctFieldSalesRep", rep);
    }

    /* =========================================================
     4. OPTIONAL SALES REP DISPLAY ON CUSTOM PAGE

     Supports markup containing:

     data-lmct-rep-row
     data-lmct-rep-badge
     data-lmct-rep-code
     data-lmct-rep-manual
     data-lmct-sales-code-input
     ========================================================= */

    function updateRepDisplay() {
      var rep = getSalesRep();

      var $row = $("[data-lmct-rep-row]");
      var $badge = $("[data-lmct-rep-badge]");
      var $code = $("[data-lmct-rep-code]");
      var $manual = $("[data-lmct-rep-manual]");
      var $input = $("[data-lmct-sales-code-input]");

      if (!$row.length) return;

      $row.addClass("lmctFS__repRow--visible");

      if (rep) {
        $code.text(rep);

        $badge.addClass("lmctFS__repBadge--visible");

        $manual.removeClass("lmctFS__repManual--visible");

        if ($input.length) {
          $input.val(rep);
        }

        return;
      }

      $badge.removeClass("lmctFS__repBadge--visible");

      $manual.addClass("lmctFS__repManual--visible");
    }

    function initRepTracking() {
      var urlRep = getRepFromUrl();

      if (urlRep) {
        saveSalesRep(urlRep);
      }

      updateRepDisplay();

      $(document).on("input change", "[data-lmct-sales-code-input]", function () {
        var clean = sanitizeSalesCode($(this).val());

        $(this).val(clean);

        if (clean) {
          saveSalesRep(clean);
        }

        updateRepDisplay();
      });
    }

    /* =========================================================
     5. PACKAGE HELPERS
     ========================================================= */

    function getProduct(packageKey) {
      return LMCT_FIELD_SALES.products[packageKey] || null;
    }

    function getSelectedPackageKey() {
      var stored = sessionGet("lmctFieldSalesPackage");

      if (stored && LMCT_FIELD_SALES.products[stored]) {
        return stored;
      }

      return "";
    }

    function markSelectedPackage(packageKey) {
      $("[data-lmct-plan]").each(function () {
        var selected = $(this).attr("data-lmct-plan") === packageKey;

        $(this).toggleClass("lmctFS__plan--selected", selected);
      });
    }

    /* =========================================================
     6. HIDE/SHOW CORRECT CF PRODUCT
     ========================================================= */

    function showOnlyProduct(productId) {
      $('#modalPopup input[name="purchase[product_id]"], ' + '.o2step_step2 input[name="purchase[product_id]"]').each(function () {
        var $input = $(this);

        var $productRow = $input.closest('[data-cf-product-template="true"]');

        if (!$productRow.length) return;

        if (String($input.val()) === String(productId)) {
          $productRow.show();
        } else {
          $productRow.hide();
        }
      });
    }

    /* =========================================================
     7. SELECT CLICKFUNNELS PRODUCT
     ========================================================= */

    function selectClickFunnelsProduct(productId) {
      var $radio = $("#modalPopup " + 'input[name="purchase[product_id]"]' + '[value="' + productId + '"]').first();

      if (!$radio.length) {
        $radio = $(".o2step_step2 " + 'input[name="purchase[product_id]"]' + '[value="' + productId + '"]').first();
      }

      if (!$radio.length) {
        return false;
      }

      /*
       * Use .click() rather than only changing
       * the checked property so ClickFunnels
       * receives its normal events.
       */
      if (!$radio.is(":checked")) {
        $radio.trigger("click");
      }

      $radio.prop("checked", true);

      /*
       * Sync corresponding CF hidden cart inputs
       * without touching unrelated bump products.
       */
      var baseProductIds = [LMCT_FIELD_SALES.products.package99.id, LMCT_FIELD_SALES.products.package199.id];

      $('#cfAR input[name="purchase[product_ids][]"]').each(function () {
        var value = String($(this).val());

        if (baseProductIds.indexOf(value) === -1) {
          return;
        }

        $(this).prop("checked", value === String(productId));
      });

      /*
       * Visual selected state in popup.
       */
      $(".elOrderProductOptinProducts").removeClass("checked-item");

      $radio.closest(".elOrderProductOptinProducts").addClass("checked-item");

      if (typeof window.rebuildOrderSummary === "function") {
        window.rebuildOrderSummary();
      }

      $(document).trigger("cfpt:cart-updated");

      return true;
    }

    /* =========================================================
     8. OPEN PACKAGE
     ========================================================= */

    function openFieldSalesPackage(packageKey) {
      var product = getProduct(packageKey);

      if (!product) {
        console.warn("Unknown LMCT package:", packageKey);

        return;
      }

      sessionSet("lmctFieldSalesPackage", packageKey);

      localStorage.setItem("selected_package", packageKey);

      window.lmctSelectedFieldSalesPackage = {
        key: packageKey,
        id: product.id,
        name: product.name,
        price: product.price,
      };

      markSelectedPackage(packageKey);

      /*
       * Hide non-selected CF products.
       */
      showOnlyProduct(product.id);

      /*
       * Open native ClickFunnels popup.
       */
      var $popupTrigger = $('[data-title*="open-popup"] a').first();

      if ($popupTrigger.length) {
        $popupTrigger.trigger("click");
      }

      /*
       * CF may finish rendering after popup
       * is opened, so retry selection a few
       * times.
       */
      LMCT_FIELD_SALES.productRetryDelays.forEach(function (delay) {
        setTimeout(function () {
          showOnlyProduct(product.id);
          selectClickFunnelsProduct(product.id);
        }, delay);
      });
    }

    window.openFieldSalesPackage = openFieldSalesPackage;

    /* =========================================================
     9. CUSTOM PACKAGE BUTTONS

     Expected markup:

     data-lmct-package="package99"

     or

     data-lmct-package="package199"
     ========================================================= */

    function initPackageButtons() {
      $(document).on("click.lmctFieldSales", ".lmctFS__select[data-lmct-package]", function (event) {
        /*
         * We open the real CF popup ourselves,
         * so prevent href="#open-popup" from
         * firing separately.
         */
        event.preventDefault();

        var packageKey = $(this).attr("data-lmct-package");

        openFieldSalesPackage(packageKey);
      });
    }

    /* =========================================================
     10. POPUP DISPLAY/STYLING
     ========================================================= */

    function initialisePopupStyles() {
      $(".elOS1Shipping").hide();

      var $walletPay = $("#tmp_oapap-21334-170-131");

      var $cardForm = $(".elCreditCardForm");

      if ($walletPay.length && $cardForm.length) {
        $walletPay.insertBefore($cardForm.first());
      }

      $('[name="purchase[product_id]"]').each(function () {
        $(this).closest(".elOrderProductOptinProducts").css({
          "margin-top": "10px",
          padding: "5px",
          border: "1px solid rgba(0,0,0,0.2)",
          "border-radius": "20px",
          cursor: "pointer",
        });
      });

      $(".elOrderProductOptinProducts").each(function () {
        if ($(this).find('input[name="purchase[product_id]"]').is(":checked")) {
          $(this).addClass("checked-item");
        }
      });

      $(document).on("change", '.elOrderProductOptinProductName input[name="purchase[product_id]"]', function () {
        if (!$(this).is(":checked")) {
          return;
        }

        $(".elOrderProductOptinProducts").removeClass("checked-item");

        $(this).closest(".elOrderProductOptinProducts").addClass("checked-item");
      });
    }

    /* =========================================================
     11. NAME VALIDATION
     ========================================================= */

    var invalidName = false;

    function validateNameField(input) {
      var $input = $(input);

      var value = $.trim($input.val() || "");

      /*
       * Allows letters from international
       * alphabets plus:
       *
       * spaces
       * apostrophes
       * hyphens
       * periods
       */

      var validCharacters;

      try {
        validCharacters = /^[\p{L}\p{M}\s.'-]+$/u.test(value);
      } catch (err) {
        validCharacters = /^[A-Za-z\s.'-]+$/.test(value);
      }

      /*
       * Empty field is left to ClickFunnels'
       * native required validation.
       */
      if (!value) {
        invalidName = false;

        $input
          .css({
            "border-color": "",
            "border-width": "",
          })
          .removeAttr("aria-invalid");

        $("#error-msg-name").addClass("hide").text("");

        return;
      }

      invalidName = !validCharacters;

      if (invalidName) {
        $input
          .css({
            "border-color": "#b91517",
            "border-width": "3px",
          })
          .attr("aria-invalid", "true");

        $("#error-msg-name").text("Please enter a valid name.").removeClass("hide").addClass("errorMsgName");

        $("#valid-msg-name").addClass("hide");

        return;
      }

      $input
        .css({
          "border-color": "#4a8920",
          "border-width": "3px",
        })
        .attr("aria-invalid", "false");

      $("#error-msg-name").addClass("hide").removeClass("errorMsgName").text("");

      $("#valid-msg-name").removeClass("hide").addClass("validMsgName");
    }

    function initNameValidation() {
      var $name = $('#modalPopup input[name="name"]');

      if (!$name.length) {
        $name = $('input[name="name"]');
      }

      if (!$name.length) return;

      if (!$("#error-msg-name").length) {
        $name.after('<div id="valid-msg-name" class="hide"></div>' + '<div id="error-msg-name" class="hide"></div>');
      }

      $name.attr("data-storage", "false");

      $(document).on("input", '#modalPopup input[name="name"]', function () {
        validateNameField(this);
      });

      /*
       * Anchors do not actually respect
       * .prop("disabled", true), therefore
       * explicitly prevent navigation if
       * the name is invalid.
       */
      $(document).on("click", '[href="#submit-form-2step"], ' + '[href="#submit-form-2step-order"]', function (event) {
        var $field = $('#modalPopup input[name="name"]');

        if ($field.length) {
          validateNameField($field[0]);
        }

        if (!invalidName) {
          return;
        }

        event.preventDefault();
        event.stopImmediatePropagation();

        $field.trigger("focus");
      });
    }

    /* =========================================================
     12. KLAVIYO CUSTOMER HELPERS
     ========================================================= */

    function getPopupValue(selector) {
      var $input = $("#modalPopup " + selector).first();

      if (!$input.length) {
        $input = $(selector).first();
      }

      return $input.length ? $.trim($input.val() || "") : "";
    }

    function splitFullName(fullName) {
      fullName = $.trim(fullName || "");

      if (!fullName) {
        return {
          firstName: "",
          lastName: "",
        };
      }

      var parts = fullName.split(/\s+/);

      return {
        firstName: parts.shift() || "",
        lastName: parts.join(" "),
      };
    }

    function getFormattedPhone() {
      var input = document.querySelector('#modalPopup input[name="phone"]');

      if (!input) return "";

      /*
       * Prefer intl-tel-input's E.164 number
       * where available.
       */
      try {
        if (window.intlTelInputGlobals && typeof window.intlTelInputGlobals.getInstance === "function") {
          var instance = window.intlTelInputGlobals.getInstance(input);

          if (instance) {
            var formatted = instance.getNumber();

            if (formatted && formatted.charAt(0) === "+") {
              return formatted;
            }
          }
        }
      } catch (err) {}

      /*
       * Don't send an unknown local-format
       * number as Klaviyo phone_number.
       */
      return "";
    }

    /* =========================================================
     13. BUILD KLAVIYO PAYLOAD
     ========================================================= */

    function buildKlaviyoPayload(email) {
      var fullName = getPopupValue('input[name="name"]');

      var rawPhone = getPopupValue('input[name="phone"]');

      var name = splitFullName(fullName);

      var rep = getSalesRep();

      var selectedPackage = getSelectedPackageKey();

      var attributes = {
        email: email,

        properties: {
          signup_source: "physical_sales",

          sales_rep: rep || "",

          selected_package: selectedPackage || "",

          full_name: fullName || "",

          phone_entered: rawPhone || "",

          utm_source: queryParams.get("utm_source") || "",

          utm_medium: queryParams.get("utm_medium") || "",

          utm_campaign: queryParams.get("utm_campaign") || "",

          utm_content: queryParams.get("utm_content") || "",
        },

        subscriptions: {
          email: {
            marketing: {
              consent: "SUBSCRIBED",
            },
          },
        },
      };

      if (name.firstName) {
        attributes.first_name = name.firstName;
      }

      if (name.lastName) {
        attributes.last_name = name.lastName;
      }

      var formattedPhone = getFormattedPhone();

      if (formattedPhone) {
        attributes.phone_number = formattedPhone;
      }

      return {
        data: {
          type: "subscription",

          attributes: {
            custom_source: LMCT_FIELD_SALES.klaviyo.source,

            profile: {
              data: {
                type: "profile",
                attributes: attributes,
              },
            },
          },

          relationships: {
            list: {
              data: {
                type: "list",
                id: LMCT_FIELD_SALES.klaviyo.listId,
              },
            },
          },
        },
      };
    }

    /* =========================================================
     14. SEND TO KLAVIYO
     ========================================================= */

    function sendCustomerToKlaviyo() {
      var $email = $('#modalPopup input[name="email"]').first();

      if (!$email.length) {
        $email = $('input[name="email"]').first();
      }

      if (!$email.length) return;

      var email = $.trim($email.val() || "");

      var validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!validEmail.test(email)) {
        return;
      }

      var normalizedEmail = email.toLowerCase();

      var sentKey = "lmctKlaviyoSent:" + normalizedEmail;

      if ($email.attr("data-kl-sent") === normalizedEmail) {
        return;
      }

      if (sessionGet(sentKey) === "1") {
        return;
      }

      $email.attr("data-kl-sent", normalizedEmail);

      sessionSet(sentKey, "1");

      if (!window.fetch) return;

      try {
        fetch("https://a.klaviyo.com/client/subscriptions/" + "?company_id=" + encodeURIComponent(LMCT_FIELD_SALES.klaviyo.companyId), {
          method: "POST",

          keepalive: true,

          headers: {
            "Content-Type": "application/json",

            revision: "2025-07-15",
          },

          body: JSON.stringify(buildKlaviyoPayload(email)),
        }).catch(function () {
          /*
           * Never allow Klaviyo failure
           * to interrupt CF checkout.
           */
        });
      } catch (err) {}
    }

    /* =========================================================
     15. KLAVIYO CHECKOUT TRIGGER
     ========================================================= */

    function initKlaviyo() {
      /*
       * Actual FINAL ClickFunnels checkout
       * button from this funnel:
       *
       * #submit-form-2step-order
       */

      $(document).on("click", '[href="#submit-form-2step-order"]', function () {
        sendCustomerToKlaviyo();
      });
    }

    /* =========================================================
     16. INITIALISE
     ========================================================= */

    $(function () {
      initRepTracking();
      initPackageButtons();
      initialisePopupStyles();
      initNameValidation();
      initKlaviyo();
    });
  })(jQuery);
</script>

<script>

   *

   * inside this ClickFunnels popup.
   */

  CFPT.prodPrices = {

<!-- =========================================================
     CF PRO TOOLS ORDER SUMMARY
     ========================================================= -->

<script>
  /**************************
   * Copyright 2019 CF Pro Tools, All Rights Reserved
   * Do not share, or distribute this code without author's consent.
   * This copyright notice must remain in place whenever using
   * this code - DO NOT REMOVE
   * Author: Jaime Smith
   * Website: https://cfprotools.com
   * Add-on: CF Order Summary
   * Version: 2.0
   * Last Updated: 10/28/2019
   **************************/

  var $summTemplate = null;

  $(function () {
    window.cfpe = window.cfpe || {};

    window.cfpe.orderTotal = window.cfpe.orderTotal || 0;

    window.cfptOrderTotal = null;

    setSummaryTemplate();

    $("#bump-offer").off();

    rebuildOrderSummary();

    $(document).on("change", ".qty_select," + '.o2step_step2 [name="purchase[product_id]"],' + '[data-de-type="orpo"] [name="purchase[product_id]"],' + "#bump-offer", function () {
      $("#bump-offer, " + '[id*="bump_offer_"]').each(function () {
        var bumpId = $(this).val();

        var $hidden = $("#cfAR " + '[name="purchase[product_ids][]"]' + '[value="' + bumpId + '"]');

        $hidden.prop("checked", $(this).is(":checked"));
      });

      rebuildOrderSummary();
    });

    $(document).on("cfpt:cart-updated", function () {
      rebuildOrderSummary();
    });
  });

  function setSummaryTemplate() {
    $('[data-de-type="ors"], ' + ".elOrderProductOptions:not(:has(input,select))")
      .first()
      .attr("data-title", "cf-order-summary");

    $summTemplate = $('[data-title="cf-order-summary"] ' + ".elOrderProductOptinProducts")
      .first()
      .clone();
  }

  function rebuildOrderSummary() {
    var cfpt = window.CFPT || {};

    var prodPrices = cfpt.prodPrices || {};

    var freePriceDisplay = cfpt.freePriceDisplay || null;

    var orderTotalLabel = cfpt.orderTotalLabel || null;

    var prodSelParent = '[data-de-type="orpo"]';

    var appendTo = '[data-title="cf-order-summary"] ' + ".elOrderProductOptions";

    if ($(".o2step_wrapper").length > 0) {
      prodSelParent = ".o2step_step2";

      appendTo = '[data-title="cf-order-summary"]';
    }

    if (!$summTemplate) {
      setSummaryTemplate();
    }

    var $summary = $('[data-title="cf-order-summary"]');

    $summary.hide();

    $summary.find(".elOrderProductOptinProducts").remove();

    window.cfptCartProds = {};

    $("#cfAR " + '[name="purchase[product_ids][]"]:checked').each(function () {
      var productId = String($(this).val());

      if (window.cfptCartProds[productId]) {
        window.cfptCartProds[productId].qty++;
      } else {
        window.cfptCartProds[productId] = {
          qty: 1,
        };
      }
    });

    var orderTotal = 0;
    var orderCurrency = "AUD";

    $.each(window.cfptCartProds, function (productId, item) {
      var qty = item.qty;

      var $productInput = $(prodSelParent + ' [name="' + productId + '_qty"]');

      if (!$productInput.length) {
        $productInput = $(prodSelParent + ' [name="purchase[product_id]"]' + '[value="' + productId + '"]');
      }

      if (!$productInput.length) {
        return;
      }

      var $product = $productInput.closest("[data-cf-product-template]");

      if (!$product.length) {
        return;
      }

      var productName = $product.find("[data-cf-product-name]").html() || "";

      var $priceElement = $product.find("[data-cf-product-price]");

      var productPrice;

      /*
       * First use our explicit price map.
       */
      if (Object.prototype.hasOwnProperty.call(prodPrices, productId)) {
        productPrice = Number(prodPrices[productId]);
      }

      /*
       * If product is not configured,
       * prefer CF's numeric data-product-amount.
       *
       * This avoids turning:
       *
       * $199 (2 month free)
       *
       * into:
       *
       * 1992
       */
      if (!Number.isFinite(productPrice)) {
        productPrice = parseFloat($productInput.attr("data-product-amount"));
      }

      /*
       * Last-resort fallback:
       * take ONLY the first monetary number.
       */
      if (!Number.isFinite(productPrice)) {
        var priceText = $priceElement.text() || "";

        var match = priceText.match(/[\d,]+(?:\.\d+)?/);

        if (match) {
          productPrice = parseFloat(match[0].replace(/,/g, ""));
        }
      }

      if (!Number.isFinite(productPrice)) {
        return;
      }

      var subtotal = qty * productPrice;

      var currency = $priceElement.attr("taxamo-currency") || "AUD";

      orderCurrency = currency;

      var $row = $summTemplate.clone();

      $row.attr("data-product_id", productId);

      $row.attr("data-quantity", qty);

      $row.find(".product-name").html(productName);

      if (freePriceDisplay && subtotal === 0) {
        $row.find(".product-price").attr("taxamo-currency", currency).html(freePriceDisplay);
      } else {
        var formatted = subtotal.toLocaleString(undefined, {
          style: "currency",
          currency: currency,
        });

        $row.find(".product-price").attr("taxamo-currency", currency).html(formatted);
      }

      $row.appendTo($(appendTo));

      orderTotal += subtotal;
    });

    if (orderTotal > 0) {
      var $total = $summTemplate.clone();

      $total.addClass("cf-order-total-row").css({
        "border-top": "1px solid #DDD",

        "margin-top": ".5em",
      });

      $total.find(".product-name").html(orderTotalLabel);

      $total
        .find(".product-price")
        .attr("taxamo-currency", orderCurrency)
        .html(
          orderTotal.toLocaleString(undefined, {
            style: "currency",

            currency: orderCurrency,
          }),
        );

      $total.appendTo($(appendTo));

      $summary.show();

      window.cfptOrderTotal = orderTotal;
    } else {
      $summary.hide();

      window.cfptOrderTotal = null;
    }
  }
</script>

<!-- ============================================================
     SECTION 05 — PHONE VALIDATION (intl-tel-input v29.1.2, AU)   [REQUIRED]
     Replaces the v19 script. No CSS class names changed.
     ============================================================ -->

<!-- [VENDOR] intl-tel-input -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@29.1.2/dist/css/intlTelInput.min.css" />
<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@29.1.2/dist/js/intlTelInput.min.js"></script>

<script>
  (function ($) {
    "use strict";

    /* ------------------------------------------------------------
     CONFIG
     ------------------------------------------------------------ */

    var ITI_VERSION = "29.1.2";
    var UTILS_URL = "https://cdn.jsdelivr.net/npm/intl-tel-input@" + ITI_VERSION + "/dist/js/utils.js";

    var PHONE_SELECTOR = 'input[name="phone"]';
    var SUBMIT_SELECTOR = '[href="#submit-form"], [href="#submit-form-2step"], [href="#submit-form-2step-order"]';

    var BLOCK_INVALID_SUBMIT = true; /* stop the click when the number is invalid */
    var SUBMIT_AS_E164 = true; /* rewrite the field to +614xxxxxxxx just before submit */

    /* Length alone cannot separate a mobile from a landline here, because both
     are nine significant digits. Every Australian mobile in service is 04
     followed by eight digits, and ACMA only allocates new mobile prefixes
     inside that block, so this rule holds as new prefixes are released.
     ACMA has reserved 05 as the overflow range for when 04 runs out, but
     nothing has been issued in it. If that changes, add '5' below. */
    var AU_MOBILE_ONLY = true;
    var AU_MOBILE_LEADING = "4";
    var AU_MOBILE_RE = new RegExp("^\\+61[" + AU_MOBILE_LEADING + "]\\d{8}$");
    var AU_MOBILE_MSG = "Enter an Australian mobile number";

    var OK_COLOUR = "#4a8920";
    var BAD_COLOUR = "#b91517";

    /* ------------------------------------------------------------
     STATE
     ------------------------------------------------------------ */

    var fields = [];
    var utilsLoaded = false;
    var gateBound = false;

    /* ------------------------------------------------------------
     HELPERS
     ------------------------------------------------------------ */

    function value(f) {
      return (f.input.value || "").trim();
    }

    function isVisible(f) {
      return !!(f.input.offsetWidth || f.input.offsetHeight || f.input.getClientRects().length);
    }

    function lengthValid(f) {
      try {
        return f.iti.isValidNumber();
      } catch (err) {
        return false;
      }
    }

    function mobileValid(f) {
      if (!AU_MOBILE_ONLY) {
        return true;
      }
      try {
        return AU_MOBILE_RE.test(f.iti.getNumber() || "");
      } catch (err) {
        return false;
      }
    }

    function isValid(f) {
      if (!utilsLoaded) {
        return true;
      }
      return lengthValid(f) && mobileValid(f);
    }

    function messageFor(f) {
      if (!value(f)) {
        return "Please enter a number";
      }

      /* Correct length but wrong shape means a landline, a service number,
       or filler like 555555555. */
      if (lengthValid(f)) {
        return AU_MOBILE_MSG;
      }

      var codes = window.intlTelInput.VALIDATION_ERROR || {};
      var code;
      try {
        code = f.iti.getValidationError();
      } catch (err) {
        code = null;
      }
      if (code === codes.INVALID_COUNTRY_CODE) {
        return AU_MOBILE_MSG;
      }
      if (code === codes.TOO_SHORT) {
        return "Too short";
      }
      if (code === codes.TOO_LONG) {
        return "Too long";
      }
      return "Invalid number";
    }

    function paintNeutral(f) {
      f.$error.text("").addClass("hide").removeClass("errorMsg");
      f.$valid.addClass("hide").removeClass("validMsg");
      f.$input.css({ "border-color": "", "border-width": "" });
    }

    function paintValid(f) {
      f.$error.text("").addClass("hide").removeClass("errorMsg");
      f.$valid.removeClass("hide").addClass("validMsg");
      f.$input.css({ "border-color": OK_COLOUR, "border-width": "3px" });
    }

    function paintInvalid(f) {
      f.$valid.addClass("hide").removeClass("validMsg");
      f.$error.text(messageFor(f)).removeClass("hide").addClass("errorMsg");
      f.$input.css({ "border-color": BAD_COLOUR, "border-width": "3px" });
    }

    /* Empty returns true so CF1 handles its own required message.
     Errors are only painted once the field has been left or a submit
     was attempted, so the user is not shouted at mid typing. */
    function evaluate(f, forceErrors) {
      if (!value(f)) {
        paintNeutral(f);
        return true;
      }
      if (isValid(f)) {
        paintValid(f);
        return true;
      }
      if (forceErrors || f.touched) {
        f.touched = true;
        paintInvalid(f);
      } else {
        paintNeutral(f);
      }
      return false;
    }

    function firstInvalid() {
      for (var i = 0; i < fields.length; i++) {
        var f = fields[i];
        if (!isVisible(f)) {
          continue;
        }
        if (!value(f)) {
          continue;
        }
        if (!isValid(f)) {
          return f;
        }
      }
      return null;
    }

    function writeE164() {
      if (!SUBMIT_AS_E164 || !utilsLoaded) {
        return;
      }
      for (var i = 0; i < fields.length; i++) {
        var f = fields[i];
        if (!value(f) || !isValid(f)) {
          continue;
        }
        try {
          var full = f.iti.getNumber();
          if (full) {
            f.input.value = full;
          }
        } catch (err) {}
      }
    }

    /* ------------------------------------------------------------
     SUBMIT GATE
     CF1 submit buttons are anchors, so the disabled property does
     nothing. Capture phase runs before the CF1 handlers, which lets
     stopImmediatePropagation actually hold the click.
     ------------------------------------------------------------ */

    function onSubmitClick(e) {
      var button = e.target && e.target.closest ? e.target.closest(SUBMIT_SELECTOR) : null;
      if (!button) {
        return;
      }

      var bad = firstInvalid();
      if (!bad) {
        writeE164();
        return;
      }
      if (!BLOCK_INVALID_SUBMIT) {
        return;
      }

      e.preventDefault();
      e.stopImmediatePropagation();
      bad.touched = true;
      paintInvalid(bad);
      try {
        bad.input.focus();
      } catch (err) {}
    }

    /* ------------------------------------------------------------
     SETUP
     ------------------------------------------------------------ */

    function setup(input) {
      if (window.intlTelInput.getInstance(input)) {
        return;
      }

      var $input = $(input);

      var iti = window.intlTelInput(input, {
        initialCountry: "au",
        onlyCountries: ["au"],
        countrySelectorMode: "OFF",
        separateDialCode: false,
        numberDisplayFormat: "NATIONAL",
        allowedNumberTypes: ["MOBILE"],
        formatAsYouType: true,
        strictMode: true,
        strictRejectAnimation: true,
        placeholderNumberPolicy: "AGGRESSIVE",
        customPlaceholder: function (exampleNumber) {
          return exampleNumber ? "Number Here... " + exampleNumber : "Number Here...";
        },
        loadUtils: function () {
          return import(UTILS_URL);
        },
      });

      var $wrap = $input.closest(".iti");
      var isFirst = fields.length === 0;

      var $valid = $('<div class="hide">\u2713 Valid</div>');
      var $error = $('<div class="hide"></div>');
      if (isFirst) {
        $valid.attr("id", "valid-msg");
        $error.attr("id", "error-msg");
      }
      $wrap.after($error);
      $wrap.after($valid);

      var f = {
        input: input,
        $input: $input,
        iti: iti,
        $valid: $valid,
        $error: $error,
        touched: false,
      };
      fields.push(f);

      $input.on("input change countrychange", function () {
        evaluate(f, false);
      });
      $input.on("blur", function () {
        evaluate(f, true);
      });

      /* Utils carry the validation rules and load after the page does.
       Until then nothing is blocked, and every field is re checked
       once they arrive so autofilled numbers get their tick. */
      if (iti.promise && iti.promise.then) {
        iti.promise.then(
          function () {
            utilsLoaded = true;
            for (var i = 0; i < fields.length; i++) {
              if (value(fields[i])) {
                evaluate(fields[i], false);
              }
            }
          },
          function () {
            utilsLoaded = false;
          },
        );
      }
    }

    function scan() {
      if (!window.intlTelInput) {
        return;
      }
      $(PHONE_SELECTOR).each(function () {
        setup(this);
      });
      if (!gateBound && fields.length) {
        document.addEventListener("click", onSubmitClick, true);
        gateBound = true;
      }
    }

    $(function () {
      $("#valid-msg, #error-msg").remove();
      scan();
    });

    window.addEventListener("load", scan);
  })(window.jQuery);
</script>
