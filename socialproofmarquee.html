  .lmctMarquee {

    );
    overflow: hidden;
    position: relative;
    font-family: "Montserrat", sans-serif;
  }
  .lmctMarqueeInner {
    display: flex;
    width: max-content;

  }
  .lmctMarqueeTrack {

    flex-shrink: 0;

  .lmctMarqueeItem {

    white-space: nowrap;
    padding: 0 clamp(12px, 2.5vw, 30px);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.15);
  }
  .lmctMarqueeLogo {
    flex-shrink: 0;
    width: clamp(20px, 3.2vw, 34px);
    height: clamp(20px, 3.2vw, 34px);
    margin: 0 clamp(4px, 1vw, 10px);
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.15));
  }
  @keyframes lmctScroll {
    0% {
      transform: translateX(0);
    }
    100% {

    }
  }
</style>
