<!-- ============================================
     LMCT+ PETROL FOOTER
     Three-column desktop / stacked mobile
     ============================================ -->
<style>
  .lmf *,
  .lmf *::before,
  .lmf *::after {
    box-sizing: border-box;
  }
  .lmf {
    position: relative;
    width: 100%;
    background: linear-gradient(180deg, #05162a 0%, #0a1d3a 100%);
    font-family:
      "Montserrat",
      system-ui,
      -apple-system,
      sans-serif;
    color: #ffffff;
    overflow: hidden;
  }
  /* Top accent stripe */
  .lmf::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      #3ba8ee 25%,
      #5cc6f7 50%,
      #3ba8ee 75%,
      transparent 100%
    );
    z-index: 2;
  }
  .lmf-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 44px 24px 28px 24px;
    position: relative;
    z-index: 1;
  }
  /* Main grid (stacked mobile, 3 col desktop) */
  .lmf-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 36px;
    text-align: center;
  }
  /* --- Brand column --- */
  .lmf-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .lmf-logo {
    width: 180px;
    height: auto;
    display: block;
    filter: drop-shadow(0 3px 10px rgba(0, 0, 0, 0.5));
  }
  .lmf-tagline {
    color: rgba(255, 255, 255, 0.55);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.4;
    margin: 0;
  }
  /* --- Column headings --- */
  .lmf-heading {
    color: #ffffff;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 0 0 14px 0;
    line-height: 1;
    position: relative;
    padding-bottom: 10px;
  }
  .lmf-heading::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 2px;
    background: linear-gradient(90deg, #3ba8ee, #5cc6f7);
    border-radius: 2px;
  }
  /* --- Legal column --- */
  .lmf-legal-links {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
  }
  .lmf-link {
    color: #5cc6f7;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.01em;
    text-decoration: none;
    line-height: 1.3;
    transition: color 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .lmf-link:hover {
    color: #ffffff;
  }
  .lmf-link::before {
    content: "";
    width: 4px;
    height: 4px;
    background: #3ba8ee;
    border-radius: 50%;
    flex-shrink: 0;
    opacity: 0.7;
  }
  /* --- Contact column --- */
  .lmf-contact {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .lmf-phone {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: rgba(59, 168, 238, 0.12);
    border: 1px solid rgba(59, 168, 238, 0.25);
    border-radius: 999px;
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    text-decoration: none;
    line-height: 1;
    transition:
      background 0.15s ease,
      border-color 0.15s ease,
      transform 0.15s ease;
  }
  .lmf-phone:hover {
    background: rgba(59, 168, 238, 0.22);
    border-color: rgba(59, 168, 238, 0.5);
    transform: translateY(-1px);
  }
  .lmf-phone svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }
  .lmf-abn {
    color: rgba(255, 255, 255, 0.6);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.03em;
    line-height: 1.4;
    margin: 0;
  }
  .lmf-abn strong {
    color: rgba(255, 255, 255, 0.85);
    font-weight: 700;
  }
  /* --- Bottom bar --- */
  .lmf-bottom {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }
  .lmf-copyright {
    color: rgba(255, 255, 255, 0.5);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.04em;
    line-height: 1.4;
    margin: 0;
  }
  .lmf-copyright strong {
    color: rgba(255, 255, 255, 0.8);
    font-weight: 700;
  }
  /* ============================================
     DESKTOP
     ============================================ */
  @media (min-width: 768px) {
    .lmf-inner {
      padding: 56px 32px 32px 32px;
    }
    .lmf-grid {
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 48px;
      text-align: left;
      align-items: start;
    }
    .lmf-brand {
      align-items: flex-start;
    }
    .lmf-tagline {
      text-align: left;
    }
    .lmf-logo {
      width: 200px;
    }
    .lmf-heading {
      text-align: left;
    }
    .lmf-heading::after {
      left: 0;
      transform: none;
    }
    .lmf-legal-links {
      align-items: flex-start;
    }
    .lmf-contact {
      align-items: flex-start;
    }
    .lmf-bottom {
      margin-top: 44px;
      flex-direction: row;
      justify-content: space-between;
      text-align: left;
    }
  }
  @media (min-width: 1024px) {
    .lmf-logo {
      width: 220px;
    }
  }
</style>
