<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
      }
      .app-banner-wrap {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      /* ── Banner Image ── */
      .banner-img {
        width: 100%;
        border-radius: 14px;
        display: block;
      }
      /* ── Store Buttons Row ── */
      .store-row {
        display: flex;
        gap: 10px;
      }
      .store-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px 24px;
        border-radius: 12px;
        text-decoration: none;
        background: #000;
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        transition: all 0.25s ease;
      }
      .store-btn:hover {
        border-color: rgba(255, 255, 255, 0.35);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      }
      .store-icon {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
      }
      .store-icon svg {
        width: 100%;
        height: 100%;
      }
      .store-text {
        display: flex;
        flex-direction: column;
        line-height: 1;
      }
      .store-text .small {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 0.3px;
        font-weight: 500;
        margin-bottom: 3px;
      }
      .store-text .big {
        font-size: 20px;
        color: #fff;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      /* ── Responsive ── */
      @media (max-width: 500px) {
        .store-row {
          flex-direction: column;
        }
        .store-btn {
          padding: 14px 20px;
        }
        .store-text .big {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-banner-wrap">
      <img
        src="https://images.clickfunnels.com/30/be623d4de641ea8313ca4ea3a721dc/app-banner.png"
        alt="Download the LMCT+ App"
        class="banner-img"
      />
      <div class="store-row">
        <a
          href="https://apps.apple.com/au/app/lmct/id1621538736"
          class="store-btn"
          target="_blank"
          rel="noopener"
        >
          <div class="store-icon">
            <svg
              viewBox="0 0 32 32"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M22.4 16.8c0-3.1 2.5-4.5 2.6-4.6-1.4-2.1-3.6-2.3-4.4-2.4-1.9-.2-3.6 1.1-4.6 1.1-.9 0-2.4-1.1-3.9-1.1-2 0-3.9 1.2-4.9 3-2.1 3.6-.5 9 1.5 12 1 1.5 2.2 3.1 3.8 3 1.5-.1 2.1-1 3.9-1s2.3 1 3.9 1c1.6 0 2.7-1.5 3.7-3 1.2-1.7 1.6-3.3 1.7-3.4-.1-.1-3.3-1.2-3.3-4.6zM19.4 8c.8-1 1.4-2.5 1.3-3.9-1.2.1-2.7.8-3.6 1.8-.8.9-1.5 2.3-1.3 3.7 1.4.1 2.8-.7 3.6-1.6z"
                fill="white"
              />
            </svg>
          </div>
          <div class="store-text">
            <span class="small">Download on the</span>
            <span class="big">App Store</span>
          </div>
        </a>
        <a
          href="https://play.google.com/store/apps/details?id=com.lmctmembers&pli=1"
          class="store-btn"
          target="_blank"
          rel="noopener"
        >
          <div class="store-icon">
            <svg
              viewBox="0 0 32 32"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M5.4 4.2c-.3.3-.4.8-.4 1.4v20.8c0 .6.2 1.1.4 1.4l.1.1L17 16.4v-.3L5.5 4.1l-.1.1z"
                fill="#4285F4"
              />
              <path
                d="M20.8 20.3L17 16.4v-.3l3.8-3.9.1.1 4.5 2.6c1.3.7 1.3 1.9 0 2.7l-4.5 2.6-.1.1z"
                fill="#FBBC04"
              />
              <path
                d="M20.9 20.2L17 16.2 5.4 27.8c.4.5 1.1.5 1.9.1l13.6-7.7"
                fill="#EA4335"
              />
              <path
                d="M20.9 12.2L7.3 4.5c-.8-.5-1.5-.4-1.9.1L17 16.2l3.9-4z"
                fill="#34A853"
              />
            </svg>
          </div>
          <div class="store-text">
            <span class="small">GET IT ON</span>
            <span class="big">Google Play</span>
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
