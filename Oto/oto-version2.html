<!--
╔══════════════════════════════════════════════════════════════════╗
║  LMCT+ OTO PAGE  ·  RED URGENCY HEADER + 3 IMAGES               ║
║                                                                  ║
║  TO EDIT:                                                        ║
║  1. Banner text  → .epsTextMain below                           ║
║  2. Fill %       → --eps-fill on .epsBannerRoot                 ║
║  3. Accent green → --oto-green on .otoRoot                      ║
╚══════════════════════════════════════════════════════════════════╝
-->
<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap"
  rel="stylesheet"
/>
<style>
  .otoRoot,
  .otoRoot * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  .otoRoot {
    --oto-green: #85e63c;
    --oto-card-top: #141414;
    --oto-card-bot: #050505;
    width: 100%;
    padding: 16px;
    font-family: "Montserrat", sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  /* ── card ─────────────────────────────────────────────── */
  @property --otoAngle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
  }
  .otoCard {
    position: relative;
    width: 100%;
    max-width: 620px;
    border-radius: 22px;
    padding: 0; /* banner is flush to the top edge */
    background:
      radial-gradient(
        120% 80% at 50% 30%,
        rgba(133, 230, 60, 0.14) 0%,
        rgba(133, 230, 60, 0) 55%
      ),
      linear-gradient(180deg, var(--oto-card-top) 0%, var(--oto-card-bot) 100%);
    box-shadow:
      0 4px 16px rgba(0, 0, 0, 0.35),
      inset 0 0 0 2px rgba(255, 26, 26, 0.45); /* red edge fallback */
    overflow: hidden; /* clips the banner to the rounded top corners */
  }
  /* flowing red border that circulates around the whole card */
  .otoCard::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 3px;
    background: conic-gradient(
      from var(--otoAngle),
      #4d0000 0deg,
      #ff1a1a 55deg,
      #ff7a7a 90deg,
      #ff1a1a 125deg,
      #4d0000 210deg,
      #4d0000 360deg
    );
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: otoBorderFlow 4s linear infinite;
    pointer-events: none;
    z-index: 3;
  }
  @keyframes otoBorderFlow {
    to {
      --otoAngle: 360deg;
    }
  }
  .otoInner {
    padding: 24px 24px 30px;
  }
  .otoScreenTimer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin: 0 auto 18px;
    text-align: center;
  }
  .otoScreenTimerCopy {
    color: #b9b9b9;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.25;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
  }
  .otoScreenTimerBox {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-width: 208px;
    min-height: 48px;
    padding: 7px 26px;
    border: 2px solid #ff2029;
    border-radius: 9px;
    background:
      radial-gradient(
        circle at 50% 0%,
        rgba(255, 32, 41, 0.22),
        transparent 62%
      ),
      linear-gradient(180deg, rgba(29, 0, 0, 0.96) 0%, #080000 100%);
    color: #ff2029;
    box-shadow:
      0 0 13px rgba(255, 32, 41, 0.62),
      inset 0 0 18px rgba(255, 32, 41, 0.14);
  }
  .otoScreenTimerIcon {
    width: 25px;
    height: 25px;
    flex: 0 0 auto;
    color: currentColor;
    filter: drop-shadow(0 0 8px rgba(255, 32, 41, 0.55));
  }
  .otoScreenTimerValue {
    color: currentColor;
    font-size: 33px;
    font-weight: 900;
    letter-spacing: 0.03em;
    line-height: 1;
    text-shadow: 0 0 10px rgba(255, 32, 41, 0.6);
    font-variant-numeric: tabular-nums;
  }
  /* ── images ───────────────────────────────────────────── */
  .otoHeading,
  .otoBody {
    position: relative;
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto;
  }
  .otoHeading {
    max-width: 100%;
  }
  .otoBody {
    max-width: 92%;
    margin-top: 14px;
  }
  .otoImageFrame {
    position: relative;
    margin: 22px auto 0;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      0 12px 30px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .otoImageFrame img {
    display: block;
    width: 100%;
    height: auto;
  }
  .otoBoostDesign {
    display: grid;
    grid-template-columns: 43% 57%;
    min-height: 218px;
    background: #050505;
  }
  .otoBoostPhotoWrap {
    position: relative;
    display:flex;
    align-items:center;
    overflow: hidden;
    border-radius: 14px 0 0 14px;
    background: #ffffff;
  }
  .otoBoostPhotoWrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      90deg,
      rgba(0, 0, 0, 0) 74%,
      rgba(0, 0, 0, 0.34) 100%
    );
    pointer-events: none;
  }
  .otoImageFrame .otoBoostPhoto {
    width: 100%;
    /* height: 100%; */
    object-fit: cover;
    object-position: center;
  }
  .otoBoostPanel {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    border: 2px solid #76f182;
    border-left: 0;
    border-radius: 0 14px 14px 0;
    overflow: hidden;
    background:
      radial-gradient(
        circle at 94% 12%,
        rgba(63, 242, 77, 0.22),
        transparent 36%
      ),
      linear-gradient(180deg, #171717 0%, #070707 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.12),
      0 0 18px rgba(73, 255, 86, 0.3);
  }
  .otoBoostStats {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 25px 24px 16px;
  }
  .otoBoostStat {
    min-width: 0;
    text-align: center;
  }
  .otoBoostLabel {
    display: block;
    min-height: 24px;
    color: #f2f2f2;
    font-size: clamp(12px, 2vw, 16px);
    font-weight: 800;
    line-height: 1.1;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.55);
  }
  .otoBoostStatAfter .otoBoostLabel,
  .otoBoostStatAfter .otoBoostNumber {
    color: #35f044;
  }
  .otoBoostNumber {
    display: block;
    margin-top: 4px;
    color: #fff;
    font-size: clamp(15px, 6vw, 25px);
    font-weight: 900;
    line-height: 0.86;
    text-shadow:
      0 3px 0 rgba(255, 255, 255, 0.04),
      0 7px 15px rgba(0, 0, 0, 0.55);
  }
  .otoBoostEntries {
    display: block;
    margin-top: 10px;
    color: #9b9b9b;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.08em;
    line-height: 1;
    text-transform: uppercase;
  }
  .otoBoostDivider {
    width: 2px;
    height: 108px;
    margin: 0 19px;
    border-radius: 999px;
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.06),
      rgba(255, 255, 255, 0.62),
      rgba(255, 255, 255, 0.06)
    );
  }
  .otoBoostArrow {
    color: #31ef42;
    font-size: clamp(28px, 6vw, 40px);
    text-shadow: 0 0 14px rgba(54, 239, 70, 0.42);
  }
  .otoBoostStats {
    position: relative;
  }
  .otoBoostBonus {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    min-height: 48px;
    padding: 10px 16px;
    background: linear-gradient(180deg, #51fb42 0%, #34e82e 100%);
    color: #061307;
    font-size: clamp(14px, 2vw, 18px);
    font-weight: 900;
    line-height: 1;
    text-transform: uppercase;
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.32);
  }
  .otoBoostGift {
    font-size: clamp(20px, 4vw, 28px);
    line-height: 1;
    filter: brightness(0);
  }
  .otoCheckoutOffer {
    margin: 24px auto 0;
    text-align: center;
  }
  .otoCheckoutPanel {
    position: relative;
    overflow: hidden;
    padding: clamp(18px, 4vw, 27px) clamp(16px, 4vw, 34px)
      clamp(16px, 3.5vw, 24px);
    border: 1px solid rgba(255, 83, 83, 0.45);
    border-radius: 17px;
    background:
      radial-gradient(
        circle at 50% -18%,
        rgba(255, 56, 56, 0.18),
        transparent 34%
      ),
      linear-gradient(180deg, #1b1d20 0%, #070a0a 78%, #050707 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 -1px 18px rgba(255, 44, 44, 0.12);
  }
  .otoCheckoutPanel::before {
    content: "";
    position: absolute;
    top: 0;
    left: 7%;
    right: 7%;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 92, 92, 0.9),
      transparent
    );
  }
  .otoWasLine {
    position: relative;
    z-index: 1;
    color: #a7a8ac;
    font-size: clamp(14px, 3vw, 18px);
    font-weight: 800;
    line-height: 1.05;
  }
  .otoWasPrice {
    position: relative;
    display: inline-block;
    color: #c7c7ca;
  }
  .otoWasPrice::after {
    content: "";
    position: absolute;
    left: -4%;
    right: -4%;
    top: 52%;
    height: 2px;
    border-radius: 999px;
    background: #f13838;
    box-shadow: 0 0 8px rgba(255, 40, 40, 0.55);
    transform: rotate(-5deg);
  }
  .otoOfferTitle {
    position: relative;
    z-index: 1;
    margin-top: 4px;
    color: #f3f3f4;
    font-size: clamp(18px, 4vw, 23px);
    font-weight: 900;
    line-height: 1;
  }
  .otoOfferPrice {
    position: relative;
    z-index: 1;
    display: block;
    margin-top: 5px;
    color: #fff;
    font-size: clamp(76px, 18vw, 118px);
    font-weight: 900;
    letter-spacing: 0;
    line-height: 0.86;
    text-shadow:
      0 0 14px rgba(255, 36, 36, 0.24),
      0 8px 20px rgba(0, 0, 0, 0.55);
  }
  .otoPurchaseNote {
    position: relative;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: clamp(7px, 1.8vw, 10px);
    max-width: 390px;
    margin: clamp(11px, 2.5vw, 16px) auto 0;
    color: #c6c7cc;
    font-size: clamp(12px, 2.5vw, 14px);
    font-weight: 700;
    line-height: 1.25;
  }
  .otoShieldIcon {
    width: clamp(18px, 4vw, 24px);
    height: clamp(18px, 4vw, 24px);
    flex: 0 0 auto;
    color: #858a92;
  }
  .otoOfferCta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 3vw, 18px);
    width: 100%;
    margin-top: clamp(8px, 2vw, 10px);
    min-height: clamp(64px, 13vw, 86px);
    padding: clamp(14px, 3.5vw, 22px) clamp(16px, 4vw, 26px);
    border: 0;
    border-radius: 14px;
    background: linear-gradient(180deg, #58ff3f 0%, #35ec2f 100%);
    color: #061507;
    font-size: clamp(16px, 4.7vw, 26px);
    font-weight: 900;
    letter-spacing: 0;
    line-height: 1;
    text-transform: uppercase;
    box-shadow:
      0 0 22px rgba(63, 255, 49, 0.55),
      inset 0 2px 0 rgba(255, 255, 255, 0.32),
      inset 0 -4px 0 rgba(0, 0, 0, 0.12);
    cursor: pointer;
  }
  .otoOfferCta > span:last-child {
    white-space: nowrap;
  }
  .otoRocketBadge {
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(44px, 10vw, 56px);
    height: clamp(44px, 10vw, 56px);
    flex: 0 0 auto;
    border-radius: 999px;
    background: #031505;
    color: #49f943;
  }
  .otoRocketBadge svg {
    width: 60%;
    height: 60%;
  }
  .otoOneClick {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    gap: 8px;
    margin-top: clamp(10px, 2.5vw, 14px);
    color: #acadb3;
    font-size: clamp(13px, 2.8vw, 16px);
    font-weight: 700;
    line-height: 1;
  }
  .otoLockIcon {
    width: clamp(14px, 3vw, 17px);
    height: clamp(14px, 3vw, 17px);
    flex: 0 0 auto;
    color: #a9aab0;
  }
  .otoDeclineLink {
    display: block;
    margin-top: clamp(15px, 3.5vw, 20px);
    margin-right: auto;
    margin-left: auto;
    border: 0;
    background: none;
    color: #9b9ca2;
    font-size: clamp(12px, 2.8vw, 15px);
    font-weight: 700;
    line-height: 1.2;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-color: rgba(155, 156, 162, 0.58);
    cursor: pointer;
  }
  /* ── entrance ─────────────────────────────────────────── */
  .otoAnim {
    opacity: 0;
    transform: translateY(14px);
    animation: otoRise 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }
  .otoD1 {
    animation-delay: 0.04s;
  }
  .otoD2 {
    animation-delay: 0.18s;
  }
  .otoD3 {
    animation-delay: 0.31s;
  }
  .otoD4 {
    animation-delay: 0.44s;
  }
  .otoD5 {
    animation-delay: 0.56s;
  }
  .otoD6 {
    animation-delay: 0.68s;
  }
  @keyframes otoRise {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @media (max-width: 520px) {
    .otoCard {
      border-radius: 18px;
    }
    .otoInner {
      padding: 18px 16px 24px;
    }
    .otoScreenTimer {
      gap: 7px;
      margin-bottom: 15px;
    }
    .otoScreenTimerCopy {
      font-size: 13px;
    }
    .otoScreenTimerBox {
      min-width: 174px;
      min-height: 42px;
      gap: 10px;
      padding: 7px 18px;
      border-radius: 8px;
    }
    .otoScreenTimerIcon {
      width: 21px;
      height: 21px;
    }
    .otoScreenTimerValue {
      font-size: 28px;
    }
    .otoBody {
      max-width: 100%;
    }
    .otoBoostDesign {
      min-height: 150px;
    }
    .otoBoostStats {
      padding: 18px 14px 10px;
    }
    .otoBoostLabel {
      min-height: 18px;
    }
    .otoBoostNumber {
      margin-top: 3px;
    }
    .otoBoostEntries {
      margin-top: 7px;
      font-size: 10px;
      letter-spacing: 0.06em;
    }
    .otoBoostDivider {
      height: 77px;
      margin: 0 12px;
    }

    .otoBoostBonus {
      min-height: 36px;
      gap: 8px;
      padding: 8px 10px;
    }
    .otoCheckoutOffer {
      margin-top: 18px;
    }
    .otoCheckoutPanel {
      border-radius: 14px;
    }
    .otoPurchaseNote {
      max-width: 300px;
    }
    .otoOfferCta {
      border-radius: 12px;
      gap: clamp(8px, 2.6vw, 12px);
      padding: clamp(13px, 3.2vw, 18px) clamp(12px, 3.5vw, 18px);
      font-size: clamp(12px, 3.8vw, 15px);
    }
    .otoRocketBadge {
      width: clamp(36px, 9vw, 44px);
      height: clamp(36px, 9vw, 44px);
    }
  }
  /* ═══════════ RED URGENCY BANNER (header) ═══════════ */
  .epsBannerRoot,
  .epsBannerRoot * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  .epsBannerRoot {
    --eps-bg: #141414;
    --eps-fill-start: #cc0000;
    --eps-fill-mid: #ff0000;
    --eps-fill-end: #ff1a1a;
    --eps-fill: 90%;
    --eps-text: #fff;
    width: 100%;
    font-family: "Montserrat", sans-serif;
    position: relative;
  }
  .epsBannerWrap {
    position: relative;
    width: 100%;
    background: var(--eps-bg);
    overflow: hidden;
    border-radius: 0; /* card clips the corners */
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .epsBannerFill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(
      90deg,
      var(--eps-fill-start) 0%,
      var(--eps-fill-mid) 40%,
      var(--eps-fill-end) 70%,
      var(--eps-fill-mid) 100%
    );
    animation:
      epsFillUp 2.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards,
      epsFillPulse 2.4s ease-in-out 3s infinite;
  }
  @keyframes epsFillUp {
    0% {
      width: 0%;
    }
    100% {
      width: var(--eps-fill);
    }
  }
  @keyframes epsFillPulse {
    0%,
    100% {
      width: var(--eps-fill);
    }
    50% {
      width: calc(var(--eps-fill) + 3%);
    }
  }
  .epsBannerFill::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, 0.1) 40%,
      rgba(255, 255, 255, 0.18) 50%,
      rgba(255, 255, 255, 0.1) 60%,
      transparent 100%
    );
    animation: epsBarShimmer 2.5s ease-in-out 1s infinite;
  }
  @keyframes epsBarShimmer {
    0% {
      left: -100%;
    }
    100% {
      left: 200%;
    }
  }
  .epsBannerStripes {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 8px,
      rgba(0, 0, 0, 0.12) 8px,
      rgba(0, 0, 0, 0.12) 16px
    );
    background-size: 22.6px 100%;
    animation: epsStripeMove 0.8s linear infinite;
  }
  @keyframes epsStripeMove {
    0% {
      background-position: 0 0;
    }
    100% {
      background-position: 22.6px 0;
    }
  }
  .epsBannerEdge {
    position: absolute;
    top: 0;
    right: 0;
    width: 4px;
    height: 100%;
    background: rgba(255, 255, 255, 0.35);
    box-shadow: 0 0 12px 2px rgba(255, 255, 255, 0.25);
    animation: epsEdgePulse 1.2s ease-in-out infinite;
  }
  @keyframes epsEdgePulse {
    0%,
    100% {
      opacity: 0.6;
    }
    50% {
      opacity: 1;
    }
  }
  .epsBannerInner {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 24px;
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    gap: 14px;
    pointer-events: none;
  }
  .epsIcon {
    flex: 0 0 auto;
    font-size: 26px;
    line-height: 1;
    display: inline-block;
    animation: epsIconShake 0.55s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes epsIconShake {
    0%,
    100% {
      transform: rotate(-8deg) scale(1);
    }
    25% {
      transform: rotate(6deg) scale(1.06);
    }
    50% {
      transform: rotate(-4deg) scale(1);
    }
    75% {
      transform: rotate(8deg) scale(1.06);
    }
  }
  .epsTextMain {
    flex: 0 1 auto;
    min-width: 0;
    font-weight: 900;
    font-size: 30px;
    color: var(--eps-text);
    letter-spacing: 0.06em;
    line-height: 1;
    white-space: nowrap;
    text-transform: uppercase;
    display: inline-block;
    animation:
      epsTextShake 0.18s ease-in-out infinite,
      epsTextGlow 1.4s ease-in-out infinite;
  }
  @keyframes epsTextShake {
    0%,
    100% {
      transform: translate(0, 0);
    }
    25% {
      transform: translate(-0.6px, 0.4px);
    }
    50% {
      transform: translate(0.5px, -0.5px);
    }
    75% {
      transform: translate(-0.4px, -0.3px);
    }
  }
  @keyframes epsTextGlow {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.88;
    }
  }
  @media (max-width: 520px) {
    .epsBannerInner {
      padding: 14px 14px;
      gap: 10px;
    }
    .epsIcon {
      font-size: 20px;
    }
    .epsTextMain {
      font-size: 19px;
      letter-spacing: 0.03em;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .otoAnim {
      animation: none;
      opacity: 1;
      transform: none;
    }
    .otoCard::before {
      animation: none;
    }
    .epsBannerFill,
    .epsBannerFill::after,
    .epsBannerStripes,
    .epsBannerEdge,
    .epsIcon,
    .epsTextMain {
      animation: none;
    }
    .epsBannerFill {
      width: var(--eps-fill);
    }
  }
</style>
<div class="otoRoot">
  <div class="otoCard">
    <!-- red urgency header -->
    <div class="epsBannerRoot otoAnim otoD1" id="epsBannerRoot">

<script>
  /* ============== EDIT THIS ============== */
  var EPS_SECONDS = 60; /* countdown start in seconds */
  /* ======================================= */
  window.addEventListener("load", function () {
    var el = document.getElementById("epsCountText");
    var screenTimer = document.getElementById("otoScreenTimerValue");
    var screenTimerBox = document.getElementById("otoScreenTimerBox");
    if (!el && !screenTimer) return;
    var remaining = EPS_SECONDS;
    function formatClock(totalSeconds) {
      var safeSeconds = Math.max(0, totalSeconds);
      var minutes = Math.floor(safeSeconds / 60);
      var seconds = safeSeconds % 60;
      var mm = minutes < 10 ? "0" + minutes : "" + minutes;
      var ss = seconds < 10 ? "0" + seconds : "" + seconds;
      return mm + ":" + ss;
    }
    function render() {
      if (el) {
        if (remaining > 0) {
          var s = remaining < 10 ? "0" + remaining : "" + remaining;
          el.textContent = "OFFER EXPIRING: " + s;
        } else {
          el.textContent = "OFFER EXPIRED";
        }
      }
      if (screenTimer) {
        screenTimer.textContent = formatClock(remaining);
      }
      if (screenTimerBox) {
        screenTimerBox.setAttribute(
          "aria-label",
          remaining > 0
            ? "This deal expires in " + formatClock(remaining)
            : "This deal has expired",
        );
      }
    }
    render();
    var iv = setInterval(function () {
      remaining -= 1;
      render();
      if (remaining <= 0) {
        clearInterval(iv);
      }
    }, 1000);
  });
</script>
