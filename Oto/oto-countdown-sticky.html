<!-- LMCT+ PREMIUM LIGHT STICKY OTO BAR FOR CLICKFUNNELS -->
<link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet" />

<style>
  .lmct_oto_sticky_light {
    --lmct-progress: 0%;
    --lmct-top-correction: 0px;
    --lmct-blue: #088fd3;
    --lmct-blue-bright: #25b7ff;
    --lmct-red: #ef2347;
    --lmct-orange: #ff8a00;
    --lmct-ink: #06111f;
    --lmct-muted: rgba(6, 17, 31, 0.68);
    --lmct-line: rgba(8, 143, 211, 0.18);
    --lmct-soft-blue: rgba(8, 143, 211, 0.1);
    --lmct-soft-orange: rgba(255, 138, 0, 0.13);

    position: fixed !important;
    top: calc(0px - var(--lmct-top-correction)) !important;
    left: 50% !important;
    right: auto !important;
    z-index: 2147483000;
    width: 100vw !important;
    max-width: none !important;
    min-width: 0;
    margin: 0 0 0 -50vw !important;
    padding: 0 !important;
    font-family: "Montserrat", Arial, sans-serif;
    color: var(--lmct-ink);
    box-sizing: border-box;
    isolation: isolate;
    transform: translateZ(0);
  }

  .lmct_oto_sticky_light *,
  .lmct_oto_sticky_light *::before,
  .lmct_oto_sticky_light *::after {
    box-sizing: border-box;
  }

  .lmct_oto_sticky_light :where(div, span) {
    margin: 0;
  }

  .lmct_oto_sticky_light_bar {
    position: relative;
    overflow: hidden;
    display: block;
    width: 100% !important;
    max-width: none !important;
    min-height: 68px;
    margin: 0 !important;
    padding: 7px 16px 8px !important;
    background:
      linear-gradient(
        90deg,
        rgba(8, 143, 211, 0.12),
        rgba(255, 255, 255, 0.96) 31%,
        rgba(255, 255, 255, 0.96) 67%,
        rgba(255, 138, 0, 0.13)
      ),
      #ffffff;
    border-bottom: 1px solid var(--lmct-line);
    box-shadow:
      0 14px 32px rgba(6, 17, 31, 0.13),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    backdrop-filter: saturate(150%) blur(14px);
  }

  .lmct_oto_sticky_light_bar::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    pointer-events: none;
    background: linear-gradient(
      90deg,
      var(--lmct-blue),
      var(--lmct-blue-bright),
      var(--lmct-orange)
    );
  }

  .lmct_oto_sticky_light_inner {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    /* flex-wrap: wrap; */
    gap: 22px;
    width: 100%;
    max-width: 1170px;
    min-height: 66px;
    margin: 0 auto !important;
    padding: 0 !important;
  }

  .lmct_oto_sticky_light_content {
    position: relative;
    z-index: 2;
    min-width: 0;
    display: flex;
    align-items: center;
    flex: 1 1 auto;
    gap: 13px;
    margin: 0 !important;
  }

  .lmct_oto_sticky_light_badge {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 32px;
    padding: 8px 11px;
    border-radius: 7px;
    color: #ffffff;
    background: var(--lmct-ink);
    font-size: 12px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0;
    text-transform: uppercase;
    box-shadow: 0 8px 20px rgba(6, 17, 31, 0.18);
    white-space: nowrap;
  }

  .lmct_oto_sticky_light_badge::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--lmct-blue-bright);
    box-shadow: 0 0 0 5px rgba(37, 183, 255, 0.2);
    animation: lmctLightPulse 1.1s ease-in-out infinite;
  }

  .lmct_oto_sticky_light_text {
    min-width: 0;
  }

  .lmct_oto_sticky_light_title {
    margin: 0;
    color: var(--lmct-ink);
    font-size: 22px;
    font-weight: 950;
    line-height: 1.08;
    letter-spacing: 0;
    text-transform: uppercase;
    text-wrap: balance;
  }

  .lmct_oto_sticky_light_title strong {
    color: var(--lmct-blue);
    font-weight: 950;
  }

  .lmct_oto_sticky_light_sub {
    margin: 4px 0 0;
    color: var(--lmct-muted);
    font-size: 13px;
    font-weight: 700;
    line-height: 1.28;
  }

  .lmct_oto_sticky_light_sub strong {
    color: var(--lmct-ink);
    font-weight: 900;
  }

  .lmct_oto_sticky_light_timer_stack {
    position: relative;
    z-index: 2;
    display: flex;
    flex: 0 0 min(328px, 100%);
    flex-direction: column;
    gap: 6px;
    width: 100%;
    min-width: 254px;
    max-width: 328px;
    margin: 0 !important;
  }

  .lmct_oto_sticky_light_timer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 11px;
    min-height: 48px;
    padding: 7px 8px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid var(--lmct-line);
    box-shadow:
      0 10px 24px rgba(6, 17, 31, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  .lmct_oto_sticky_light_label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 28px;
    padding: 7px 8px;
    border-radius: 6px;
    color: #7c2d02;
    background: var(--lmct-soft-orange);
    border: 1px solid rgba(255, 138, 0, 0.22);
    font-size: 10px;
    font-weight: 950;
    line-height: 1;
    letter-spacing: 0;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .lmct_oto_sticky_light_digits {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 5px;
    min-width: 0;
  }

  .lmct_oto_sticky_light_digit {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 38px;
    min-width: 25px;
    overflow: hidden;
    border-radius: 6px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 38%),
      #06111f;
    border: 1px solid rgba(37, 183, 255, 0.18);
    box-shadow:
      inset 0 2px 9px rgba(0, 0, 0, 0.86),
      0 5px 14px rgba(6, 17, 31, 0.12);
  }

  .lmct_oto_sticky_light_digit::before {
    content: "8";
    position: absolute;
    font-family: "DS-Digital", "Share Tech Mono", monospace;
    font-size: 51px;
    font-weight: 700;
    line-height: 1;
    color: rgba(255, 255, 255, 0.08);
  }

  .lmct_oto_sticky_light_digit span {
    position: relative;
    z-index: 2;
    font-family: "DS-Digital", "Share Tech Mono", monospace;
    font-size: 51px;
    font-weight: 700;
    line-height: 0;
    color: var(--lmct-blue-bright);
    font-variant-numeric: tabular-nums;
    text-shadow:
      0 0 7px rgba(37, 183, 255, 0.78),
      0 0 18px rgba(37, 183, 255, 0.3);
  }

  .lmct_oto_sticky_light_digit.flip span {
    animation: lmctLightDigitFlip 0.24s ease-out;
  }

  .lmct_oto_sticky_light_sep {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 1px;
  }

  .lmct_oto_sticky_light_sep span {
    width: 5px;
    height: 5px;
    border-radius: 999px;
    background: var(--lmct-blue-bright);
    box-shadow: 0 0 10px rgba(37, 183, 255, 0.68);
    animation: lmctLightSepPulse 1s ease-in-out infinite;
  }

  .lmct_oto_sticky_light_progress {
    position: relative;
    overflow: hidden;
    height: 10px;
    border-radius: 999px;
    background: rgba(6, 17, 31, 0.08);
    border: 1px solid rgba(8, 143, 211, 0.14);
  }

  .lmct_oto_sticky_light_progress_fill {
    position: absolute;
    inset: 1px auto 1px 1px;
    width: var(--lmct-progress);
    max-width: calc(100% - 2px);
    border-radius: inherit;
    background: linear-gradient(
      90deg,
      var(--lmct-blue),
      var(--lmct-blue-bright),
      var(--lmct-orange)
    );
    box-shadow: 0 0 12px rgba(8, 143, 211, 0.38);
    transition: width 0.78s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .lmct_oto_sticky_light.urgent .lmct_oto_sticky_light_badge {
    background: linear-gradient(135deg, #b9082d, var(--lmct-red));
  }

  .lmct_oto_sticky_light.urgent .lmct_oto_sticky_light_badge::before {
    background: #ffffff;
    box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.18);
  }

  .lmct_oto_sticky_light.urgent .lmct_oto_sticky_light_label {
    animation: lmctLightUrgentPulse 0.75s ease-in-out infinite;
  }

  .lmct_oto_sticky_light.urgent .lmct_oto_sticky_light_digit span {
    color: #ff4f4f;
    text-shadow:
      0 0 7px rgba(255, 79, 79, 0.9),
      0 0 18px rgba(239, 35, 60, 0.45);
  }

  .lmct_oto_sticky_light.urgent .lmct_oto_sticky_light_sep span {
    background: #ff4f4f;
    box-shadow: 0 0 10px rgba(255, 79, 79, 0.75);
  }

  .lmct_oto_sticky_light.urgent .lmct_oto_sticky_light_progress_fill {
    background: linear-gradient(90deg, var(--lmct-orange), var(--lmct-red));
  }

  .lmct_oto_sticky_light.expired .lmct_oto_sticky_light_bar {
    filter: saturate(0.65);
  }

  .lmct_oto_sticky_light_sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @keyframes lmctLightPulse {
    0%,
    100% {
      transform: scale(1);
      opacity: 1;
    }

    50% {
      transform: scale(1.32);
      opacity: 0.65;
    }
  }

  @keyframes lmctLightDigitFlip {
    0% {
      transform: translateY(-5px);
      opacity: 0.35;
    }

    100% {
      transform: translateY(0);
      opacity: 1;
    }
  }

  @keyframes lmctLightSepPulse {
    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0.35;
    }
  }

  @keyframes lmctLightUrgentPulse {
    0%,
    100% {
      transform: scale(1);
    }

    50% {
      transform: scale(1.035);
    }
  }

  @media (max-width: 1100px) {
    .lmct_oto_sticky_light_bar {
      padding-right: 14px !important;
      padding-left: 14px !important;
    }

    .lmct_oto_sticky_light_title {
      font-size: 20px;
    }
  }

  @media (max-width: 900px) {
    .lmct_oto_sticky_light_inner {
      gap: 15px;
      min-height: 70px;
    }

    .lmct_oto_sticky_light_bar {
      padding: 9px 16px 10px !important;
    }

    .lmct_oto_sticky_light_title {
      font-size: 18px;
    }

    .lmct_oto_sticky_light_sub {
      font-size: 12px;
    }

    .lmct_oto_sticky_light_timer_stack {
      min-width: 246px;
      max-width: 306px;
    }

    .lmct_oto_sticky_light_timer {
      gap: 8px;
    }

    .lmct_oto_sticky_light_digit {
      width: 30px;
      height: 39px;
    }

    .lmct_oto_sticky_light_digit span,
    .lmct_oto_sticky_light_digit::before {
      font-size: 49px;
    }
  }

  @media (max-width: 780px) {
    .lmct_oto_sticky_light_inner {
      min-height: 104px;
    }

    .lmct_oto_sticky_light_bar {
      padding: 10px 12px 11px !important;
      text-align: left;
    }

    .lmct_oto_sticky_light_content {
      flex-direction: column;
      align-items: flex-start;
      gap: 9px;
      width: 100%;
    }

    .lmct_oto_sticky_light_badge {
      min-height: 27px;
      padding: 7px 9px;
      font-size: 10px;
    }

    .lmct_oto_sticky_light_title {
      font-size: 16px;
      line-height: 1.12;
    }

    .lmct_oto_sticky_light_sub {
      display: none;
    }

    .lmct_oto_sticky_light_timer_stack {
      width: 100%;
      min-width: 0;
    }

    .lmct_oto_sticky_light_timer {
      min-height: 49px;
      padding: 6px;
      gap: 7px;
    }

    .lmct_oto_sticky_light_label {
      min-height: 27px;
      padding: 6px 7px;
      font-size: 9px;
    }

    .lmct_oto_sticky_light_digit {
      width: 28px;
      height: 37px;
    }

    .lmct_oto_sticky_light_digit span,
    .lmct_oto_sticky_light_digit::before {
      font-size: 46px;
    }
  }

  @media (max-width: 580px) {
    .lmct_oto_sticky_light_bar {
      min-height: 108px;
      padding-right: 10px !important;
      padding-left: 10px !important;
    }

    .lmct_oto_sticky_light_content {
      gap: 8px;
    }

    .lmct_oto_sticky_light_badge {
      padding-right: 8px;
      padding-left: 8px;
      font-size: 9px;
    }

    .lmct_oto_sticky_light_timer_stack {
      max-width: 250px;
    }
    .lmct_oto_sticky_light_title {
      font-size: 15px;
    }

    .lmct_oto_sticky_light_timer {
      gap: 6px;
    }

    .lmct_oto_sticky_light_label {
      font-size: 8px;
    }

    .lmct_oto_sticky_light_digit {
      width: 26px;
      height: 35px;
    }

    .lmct_oto_sticky_light_digit span,
    .lmct_oto_sticky_light_digit::before {
      font-size: 43px;
    }
  }

  @media (max-width: 415px) {
    .lmct_oto_sticky_light_inner {
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .lmct_oto_sticky_light_content {
      align-items: center;
      text-align: center;
    }
    .lmct_oto_sticky_light_title {
      font-size: 14px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lmct_oto_sticky_light,
    .lmct_oto_sticky_light *,
    .lmct_oto_sticky_light *::before,
    .lmct_oto_sticky_light *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<div
  class="lmct_oto_sticky_light"
  id="lmctOtoStickyLight"
  role="region"
  aria-label="One-time offer countdown"
  data-seconds="60"
  data-session-lock="true"
  data-push-page="true"
>
  <div class="lmct_oto_sticky_light_bar">
    <div class="lmct_oto_sticky_light_inner">
      <div class="lmct_oto_sticky_light_content">
        <span class="lmct_oto_sticky_light_badge" id="lmctOtoStickyStatus">
          One time offer
        </span>

        <div class="lmct_oto_sticky_light_text">
          <h3 class="lmct_oto_sticky_light_title">
            Last chance &mdash; <strong>double your entries</strong>
          </h3>
          <p class="lmct_oto_sticky_light_sub" id="lmctOtoStickySub">
            Add the 2X boost before final checkout. One-time payment only.
          </p>
        </div>
      </div>

      <div class="lmct_oto_sticky_light_timer_stack">
        <div
          class="lmct_oto_sticky_light_timer"
          role="timer"
          aria-label="One-time offer countdown"
        >
          <span class="lmct_oto_sticky_light_label" id="lmctOtoStickyLabel">
            Offer closes in
          </span>

          <div class="lmct_oto_sticky_light_digits" aria-hidden="true">
            <div class="lmct_oto_sticky_light_digit">
              <span id="lmctLightM1">0</span>
            </div>
            <div class="lmct_oto_sticky_light_digit">
              <span id="lmctLightM2">1</span>
            </div>

            <div class="lmct_oto_sticky_light_sep" aria-hidden="true">
              <span></span>
              <span></span>
            </div>

            <div class="lmct_oto_sticky_light_digit">
              <span id="lmctLightS1">0</span>
            </div>
            <div class="lmct_oto_sticky_light_digit">
              <span id="lmctLightS2">0</span>
            </div>
          </div>
        </div>

        <div class="lmct_oto_sticky_light_progress" aria-hidden="true">
          <span class="lmct_oto_sticky_light_progress_fill"></span>
        </div>
      </div>

      <span
        class="lmct_oto_sticky_light_sr"
        id="lmctOtoStickyA11y"
        aria-live="polite"
      ></span>
    </div>
  </div>
</div>

<script>
  (function () {
    var wrap = document.getElementById("lmctOtoStickyLight");
    if (!wrap) return;

    var digits = [
      document.getElementById("lmctLightM1"),
      document.getElementById("lmctLightM2"),
      document.getElementById("lmctLightS1"),
      document.getElementById("lmctLightS2"),
    ];

    if (
      digits.some(function (el) {
        return !el;
      })
    )
      return;

    var statusEl = document.getElementById("lmctOtoStickyStatus");
    var labelEl = document.getElementById("lmctOtoStickyLabel");
    var subEl = document.getElementById("lmctOtoStickySub");
    var a11yEl = document.getElementById("lmctOtoStickyA11y");

    var previousDigits = ["", "", "", ""];
    var duration = parseInt(wrap.getAttribute("data-seconds"), 10);
    var pushPage = wrap.getAttribute("data-push-page") !== "false";
    var sessionLock = wrap.getAttribute("data-session-lock") !== "false";
    var storageKey = "lmctOtoStickyLightDeadline:" + window.location.pathname;
    var deadline;
    var lastA11y = "";
    var timerInterval;

    if (!duration || duration < 10) duration = 60;

    deadline = Date.now() + duration * 1000;

    try {
      if (sessionLock && window.sessionStorage) {
        var storedDeadline = parseInt(
          window.sessionStorage.getItem(storageKey),
          10,
        );

        if (storedDeadline && storedDeadline > Date.now()) {
          deadline = storedDeadline;
        } else {
          window.sessionStorage.setItem(storageKey, String(deadline));
        }
      }
    } catch (err) {}

    function pad(n) {
      return n < 10 ? "0" + n : String(n);
    }

    function setText(el, text) {
      if (el && el.textContent !== text) el.textContent = text;
    }

    function setDigit(index, value) {
      if (previousDigits[index] === value) return;

      digits[index].textContent = value;

      var cell = digits[index].parentElement;
      cell.classList.remove("flip");
      void cell.offsetWidth;
      cell.classList.add("flip");

      previousDigits[index] = value;
    }

    function updatePageOffset() {
      if (!pushPage || !document.body) return;

      wrap.style.setProperty("--lmct-top-correction", "0px");

      var height = Math.ceil(wrap.getBoundingClientRect().height);
      document.body.style.setProperty(
        "padding-top",
        height + "px",
        "important",
      );

      var topOffset = Math.round(wrap.getBoundingClientRect().top);
      if (Math.abs(topOffset) > 1) {
        wrap.style.setProperty("--lmct-top-correction", topOffset + "px");
      }
    }

    function setMode(remaining) {
      wrap.classList.toggle("urgent", remaining <= 15 && remaining > 0);
      wrap.classList.toggle("expired", remaining <= 0);

      if (remaining <= 0) {
        setText(statusEl, "Offer ended");
        setText(labelEl, "Ended");
        setText(subEl, "Continue checkout with your current entries.");
        return;
      }

      if (remaining <= 15) {
        setText(statusEl, "Final seconds");
        setText(labelEl, "Last call");
        setText(subEl, "Add the 2X boost before checkout continues.");
        return;
      }

      setText(statusEl, "One time offer");
      setText(labelEl, "Offer closes in");
      setText(
        subEl,
        "Add the 2X boost before final checkout. One-time payment only.",
      );
    }

    function render() {
      var remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      var elapsed = duration - remaining;
      var progress = Math.min(100, Math.max(0, (elapsed / duration) * 100));
      var minutes = Math.floor(remaining / 60);
      var seconds = remaining % 60;
      var mm = pad(minutes);
      var ss = pad(seconds);

      wrap.style.setProperty("--lmct-progress", progress + "%");

      setDigit(0, mm.charAt(0));
      setDigit(1, mm.charAt(1));
      setDigit(2, ss.charAt(0));
      setDigit(3, ss.charAt(1));

      setMode(remaining);

      if (a11yEl && (remaining <= 10 || remaining % 10 === 0)) {
        var message =
          remaining + " seconds remaining for the one-time entry upgrade.";
        if (remaining <= 0) {
          message = "The one-time entry upgrade countdown has ended.";
        }

        if (lastA11y !== message) {
          a11yEl.textContent = message;
          lastA11y = message;
        }
      }

      if (remaining <= 0 && timerInterval) {
        clearInterval(timerInterval);
      }
    }

    updatePageOffset();
    render();

    timerInterval = setInterval(render, 1000);

    window.addEventListener("resize", updatePageOffset);
    window.addEventListener("orientationchange", updatePageOffset);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updatePageOffset).catch(function () {});
    }
  })();
</script>
