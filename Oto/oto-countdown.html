<link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet" />

<style>
  .lmct_digital_oto {
    --lmct-progress: 0%;
    --lmct-premium-gold: #ffc300;
    --lmct-premium-gold-soft: #fff4be;
    --lmct-premium-red: #ef233c;
    --lmct-premium-red-dark: #b91c1c;
    --lmct-premium-navy: #07111f;
    --lmct-bar-color: var(--lmct-premium-gold);
    --lmct-bar-glow: rgba(255, 195, 0, 0.64);
    width: 100%;
    margin: 0 auto;
    font-family: "Montserrat", Arial, sans-serif;
    box-sizing: border-box;
  }

  .lmct_digital_oto *,
  .lmct_digital_oto *::before,
  .lmct_digital_oto *::after {
    box-sizing: border-box;
  }

  .lmct_digital_oto_housing {
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: clamp(14px, 2vw, 28px);
    padding: clamp(18px, 2.4vw, 28px);
    border-radius: 24px;
    color: #ffffff;
    background:
      radial-gradient(
        circle at 12% 0%,
        rgba(255, 195, 0, 0.18),
        transparent 34%
      ),
      radial-gradient(
        circle at 88% 100%,
        rgba(239, 35, 60, 0.22),
        transparent 34%
      ),
      linear-gradient(135deg, #07111f 0%, #081b35 48%, #030712 100%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
      0 18px 46px rgba(0, 0, 0, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
    animation: lmctHousingBreath 4.8s ease-in-out infinite;
  }

  .lmct_digital_oto_housing::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(
        90deg,
        rgba(255, 195, 0, 0.16),
        transparent 28%,
        transparent 72%,
        rgba(239, 35, 60, 0.14)
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.035) 0,
        rgba(255, 255, 255, 0.035) 1px,
        transparent 1px,
        transparent 38px
      ),
      linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.08) 0%,
        transparent 38%,
        rgba(0, 0, 0, 0.18) 100%
      );
    pointer-events: none;
  }

  .lmct_digital_oto_logo {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
  }

  .lmct_digital_oto_logo img {
    display: block;
    width: clamp(92px, 12vw, 150px);
    height: auto;
    filter: drop-shadow(0 8px 18px rgba(255, 195, 0, 0.18));
    animation: lmctLogoFloat 3.8s ease-in-out infinite;
  }

  @keyframes lmctLogoFloat {
    0%,
    100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-4px);
    }
  }

  .lmct_digital_oto_copy {
    position: relative;
    z-index: 2;
    min-width: 0;
  }

  .lmct_digital_oto_kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 7px;
    color: rgba(255, 255, 255, 0.84);
    font-size: clamp(11px, 1.2vw, 13px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .lmct_digital_oto_kicker::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--lmct-premium-red);
    box-shadow:
      0 0 0 5px rgba(239, 35, 60, 0.18),
      0 0 18px rgba(239, 35, 60, 0.48);
    animation: lmctLiveDot 1.35s ease-in-out infinite;
  }

  @keyframes lmctLiveDot {
    0%,
    100% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(0.72);
      opacity: 0.62;
    }
  }

  .lmct_digital_oto_timer_stack {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-self: end;
    gap: 10px;
    width: max-content;
    max-width: 100%;
  }

  .lmct_digital_oto_title {
    margin: 0;
    font-size: clamp(22px, 3vw, 42px);
    font-weight: 950;
    line-height: 0.95;
    letter-spacing: -0.04em;
    text-transform: uppercase;
    text-shadow: 0 10px 26px rgba(0, 0, 0, 0.38);
  }

  .lmct_digital_oto_title span {
    color: var(--lmct-premium-gold);
    text-shadow:
      0 0 8px rgba(255, 195, 0, 0.85),
      0 0 22px rgba(255, 122, 0, 0.36);
  }

  .lmct_digital_oto_alerts {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 12px;
  }

  .lmct_digital_oto_alerts span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 9px;
    border-radius: 999px;
    color: #160900;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.45), transparent 44%),
      linear-gradient(180deg, #fff4be 0%, #ffc300 100%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    font-size: clamp(10px, 1vw, 12px);
    font-weight: 950;
    line-height: 1;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    box-shadow:
      0 8px 20px rgba(255, 195, 0, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    animation: lmctAlertBadge 1.15s ease-in-out infinite;
  }

  .lmct_digital_oto_alerts span:nth-child(2) {
    animation-delay: 0.18s;
  }

  .lmct_digital_oto_alerts span:nth-child(3) {
    animation-delay: 0.36s;
  }

  @keyframes lmctAlertBadge {
    0%,
    100% {
      transform: translateY(0);
      filter: brightness(1);
    }
    50% {
      transform: translateY(-2px);
      filter: brightness(1.18);
    }
  }

  .lmct_digital_oto_timer {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 18px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 38%),
      linear-gradient(180deg, #151b25 0%, #070a10 100%);
    border: 1px solid rgba(255, 195, 0, 0.34);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.13),
      inset 0 -1px 0 rgba(0, 0, 0, 0.8),
      0 14px 32px rgba(0, 0, 0, 0.32),
      0 0 22px rgba(255, 195, 0, 0.08);
    transform-origin: center;
    animation: lmctTimerReady 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .lmct_digital_oto_timer::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: repeating-linear-gradient(
      0deg,
      rgba(255, 255, 255, 0.025) 0,
      rgba(255, 255, 255, 0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }

  .lmct_digital_oto_timer.tick {
    animation: lmctTimerTick 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes lmctTimerReady {
    0% {
      transform: translateY(8px) scale(0.97);
      opacity: 0;
    }
    100% {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
  }

  @keyframes lmctTimerTick {
    0% {
      transform: scale(1);
    }
    38% {
      transform: scale(1.018);
    }
    100% {
      transform: scale(1);
    }
  }

  .lmct_digital_oto_housing::after {
    content: "";
    position: absolute;
    top: -30%;
    bottom: -30%;
    left: -48%;
    width: 28%;
    transform: rotate(18deg);
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 195, 0, 0.16),
      transparent
    );
    opacity: 0.65;
    pointer-events: none;
    animation: lmctPanelSweep 5.5s ease-in-out infinite;
  }

  @keyframes lmctHousingBreath {
    0%,
    100% {
      box-shadow:
        0 18px 46px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    50% {
      box-shadow:
        0 20px 54px rgba(0, 0, 0, 0.34),
        0 0 42px rgba(255, 195, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }
  }

  @keyframes lmctPanelSweep {
    0%,
    42% {
      left: -48%;
    }
    72%,
    100% {
      left: 118%;
    }
  }

  .lmct_digital_oto_icon {
    position: relative;
    z-index: 2;
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border-radius: 999px;
    color: #ffffff;
    background: linear-gradient(180deg, #ef233c 0%, #b91c1c 100%);
    box-shadow: 0 8px 18px rgba(239, 35, 60, 0.34);
    flex-shrink: 0;
    animation: lmctIconPulse 1.5s ease-in-out infinite;
  }

  @keyframes lmctIconPulse {
    0%,
    100% {
      box-shadow: 0 8px 18px rgba(239, 35, 60, 0.34);
    }
    50% {
      box-shadow:
        0 8px 18px rgba(239, 35, 60, 0.34),
        0 0 0 8px rgba(239, 35, 60, 0.12);
    }
  }

  .lmct_digital_oto_icon svg {
    width: 21px;
    height: 21px;
  }

  .lmct_digital_oto_digits {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .lmct_digital_oto_digit {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(35px, 4.2vw, 54px);
    height: clamp(50px, 5.5vw, 72px);
    overflow: hidden;
    border-radius: 8px;
    background: #05070a;
    box-shadow:
      inset 0 0 0 1px rgba(255, 195, 0, 0.18),
      inset 0 2px 10px rgba(0, 0, 0, 0.9),
      0 0 18px rgba(255, 195, 0, 0.08);
  }

  .lmct_digital_oto_digit::before {
    content: "8";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: "DS-Digital", "Share Tech Mono", monospace;
    font-weight: 700;
    font-size: clamp(58px, 7vw, 92px);
    line-height: 1;
    color: rgba(255, 195, 0, 0.08);
    pointer-events: none;
  }

  .lmct_digital_oto_digit::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateY(-120%);
    background: linear-gradient(
      180deg,
      transparent,
      rgba(255, 195, 0, 0.18),
      transparent
    );
    pointer-events: none;
    animation: lmctDigitScan 2.7s ease-in-out infinite;
  }

  @keyframes lmctDigitScan {
    0%,
    52% {
      transform: translateY(-120%);
    }
    74%,
    100% {
      transform: translateY(120%);
    }
  }

  .lmct_digital_oto_digit span {
    position: relative;
    z-index: 1;
    font-family: "DS-Digital", "Share Tech Mono", monospace;
    font-weight: 700;
    font-size: clamp(58px, 7vw, 92px);
    line-height: 1;
    color: var(--lmct-premium-gold);
    font-variant-numeric: tabular-nums;
    text-shadow:
      0 0 8px rgba(255, 195, 0, 0.85),
      0 0 20px rgba(255, 122, 0, 0.42);
  }

  .lmct_digital_oto_digit.flip span {
    animation: lmctDigitalFlip 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes lmctDigitalFlip {
    0% {
      transform: translateY(-6px) scale(1.08);
      opacity: 0.35;
    }
    100% {
      transform: translateY(0) scale(1);
      opacity: 1;
    }
  }

  .lmct_digital_oto_sep {
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 0 2px;
  }

  .lmct_digital_oto_sep span {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--lmct-premium-gold);
    box-shadow: 0 0 12px rgba(255, 195, 0, 0.82);
    animation: lmctSepPulse 1s ease-in-out infinite;
  }

  @keyframes lmctSepPulse {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.28;
    }
  }

  .lmct_digital_oto_progress {
    position: relative;
    overflow: hidden;
    margin: 1px !important;
    height: 13px;
    border-radius: 999px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.18)),
      rgba(2, 8, 16, 0.82);
    border: 1px solid rgba(255, 195, 0, 0.34);
    box-shadow:
      inset 0 1px 3px rgba(0, 0, 0, 0.7),
      0 8px 22px rgba(255, 195, 0, 0.12);
  }

  .lmct_digital_oto_progress_fill {
    position: absolute;
    overflow: hidden;
    inset: 2px auto 2px 2px;
    width: var(--lmct-progress);
    max-width: calc(100% - 4px);
    border-radius: 999px;
    background:
      linear-gradient(
        90deg,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0.32),
        rgba(255, 255, 255, 0)
      ),
      linear-gradient(
        90deg,
        #ffd0be 0%,
        var(--lmct-premium-gold) 54%,
        #ff0000 100%
      );
    box-shadow:
      0 0 14px var(--lmct-bar-glow),
      inset 0 1px 0 rgba(255, 255, 255, 0.46);
    transition:
      width 0.78s cubic-bezier(0.22, 1, 0.36, 1),
      background 0.3s ease,
      box-shadow 0.3s ease;
  }

  .lmct_digital_oto_progress_fill::after {
    content: "";
    position: absolute;
    inset: 0;
    transform: translateX(-100%);
    border-radius: inherit;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.55),
      transparent
    );
    animation: lmctProgressShine 1.2s ease-in-out infinite;
  }

  .lmct_digital_oto_progress_markers {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent calc(10% - 1px),
      rgba(255, 255, 255, 0.12) calc(10% - 1px),
      rgba(255, 255, 255, 0.12) 10%
    );
    pointer-events: none;
  }

  @keyframes lmctProgressShine {
    0% {
      transform: translateX(-100%);
    }
    100% {
      transform: translateX(100%);
    }
  }

  .lmct_digital_oto_sub {
    position: relative;
    z-index: 2;
    grid-column: 1 / -1;
    margin: 2px 0 0;
    padding: 11px 16px 12px;
    border-radius: 14px;
    text-align: center;
    color: #160900;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.52), transparent 36%),
      linear-gradient(180deg, #fff4be 0%, #ffc300 100%);
    font-size: clamp(13px, 1.45vw, 16px);
    font-weight: 850;
    line-height: 1.35;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.7),
      0 10px 24px rgba(255, 195, 0, 0.16);
  }

  .lmct_digital_oto.urgent .lmct_digital_oto_digit span {
    color: #ff4f4f;
    text-shadow:
      0 0 6px rgba(255, 79, 79, 0.95),
      0 0 18px rgba(239, 35, 60, 0.75),
      0 0 34px rgba(239, 35, 60, 0.55);
    animation: lmctUrgentPulse 0.8s ease-in-out infinite;
  }

  .lmct_digital_oto.urgent .lmct_digital_oto_sep span {
    background: #ff4f4f;
    box-shadow:
      0 0 8px rgba(255, 79, 79, 0.95),
      0 0 18px rgba(239, 35, 60, 0.75);
  }

  .lmct_digital_oto.urgent {
    --lmct-bar-color: var(--lmct-premium-red);
    --lmct-bar-glow: rgba(239, 35, 60, 0.78);
  }

  .lmct_digital_oto.urgent .lmct_digital_oto_progress_fill {
    background:
      linear-gradient(
        90deg,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0.32),
        rgba(255, 255, 255, 0)
      ),
      linear-gradient(90deg, #ffc300 0%, #ff7a00 48%, #ef233c 100%);
  }

  @keyframes lmctUrgentPulse {
    0%,
    100% {
      transform: scale(1);
    }
    50% {
      transform: scale(1.045);
    }
  }

  @media (max-width: 770px) {
    .lmct_digital_oto_housing {
      grid-template-columns: 1fr;
      justify-items: center;
      text-align: center;
      gap: 15px;
      padding: 18px 13px;
      border-radius: 18px;
    }

    .lmct_digital_oto_logo img {
      width: 128px;
    }

    .lmct_digital_oto_title {
      font-size: clamp(25px, 7.5vw, 36px);
    }

    .lmct_digital_oto_timer {
      width: 100%;
      max-width: 330px;
      justify-content: center;
      padding: 10px;
    }

    .lmct_digital_oto_timer_stack {
      justify-self: center;
      width: 100%;
      max-width: 330px;
    }

    .lmct_digital_oto_digit {
      width: clamp(34px, 11vw, 46px);
      height: clamp(50px, 15vw, 62px);
    }

    .lmct_digital_oto_digit span,
    .lmct_digital_oto_digit::before {
      font-size: clamp(58px, 18vw, 78px);
    }

    .lmct_digital_oto_icon {
      width: 34px;
      height: 34px;
    }

    .lmct_digital_oto_sub {
      width: 100%;
      font-size: 13px;
    }
    .lmct_digital_oto_alerts {
      justify-content: center;
    }
  }

  @media (max-width: 390px) {
    .lmct_digital_oto_timer {
      gap: 7px;
    }

    .lmct_digital_oto_digits {
      gap: 3px;
    }

    .lmct_digital_oto_sep span {
      width: 6px;
      height: 6px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lmct_digital_oto_housing,
    .lmct_digital_oto_housing::after,
    .lmct_digital_oto_logo img,
    .lmct_digital_oto_kicker::before,
    .lmct_digital_oto_alerts span,
    .lmct_digital_oto_timer,
    .lmct_digital_oto_timer.tick,
    .lmct_digital_oto_icon,
    .lmct_digital_oto_digit::after,
    .lmct_digital_oto_digit.flip span,
    .lmct_digital_oto_sep span,
    .lmct_digital_oto.urgent .lmct_digital_oto_digit span,
    .lmct_digital_oto_progress_fill::after {
      animation: none;
    }
  }
</style>

<script>
  (function () {
    var wrap = document.getElementById("lmctDigitalOto");
    if (!wrap) return;

    var els = [
      document.getElementById("lmctOtoM1"),
      document.getElementById("lmctOtoM2"),
      document.getElementById("lmctOtoS1"),
      document.getElementById("lmctOtoS2"),
    ];

    if (
      els.some(function (el) {
        return !el;
      })
    )
      return;

    var prev = ["", "", "", ""];
    var timerBox = wrap.querySelector(".lmct_digital_oto_timer");
    var remaining = 60;
    var duration = remaining;
    var hasRendered = false;

    function pad(n) {
      return n < 10 ? "0" + n : "" + n;
    }

    function setDigit(index, value) {
      if (prev[index] === value) return;

      els[index].textContent = value;

      var cell = els[index].parentElement;
      cell.classList.remove("flip");
      void cell.offsetWidth;
      cell.classList.add("flip");

      prev[index] = value;
    }

    function tick() {
      var safeRemaining = Math.max(0, remaining);
      var elapsed = duration - safeRemaining;
      var progress = Math.min(100, Math.max(0, (elapsed / duration) * 100));
      var minutes = Math.floor(safeRemaining / 60);
      var seconds = safeRemaining % 60;

      wrap.style.setProperty("--lmct-progress", progress + "%");

      var mm = pad(minutes);
      var ss = pad(seconds);

      setDigit(0, mm.charAt(0));
      setDigit(1, mm.charAt(1));
      setDigit(2, ss.charAt(0));
      setDigit(3, ss.charAt(1));

      if (safeRemaining <= 15) {
        wrap.classList.add("urgent");
      }

      if (hasRendered && timerBox) {
        timerBox.classList.remove("tick");
        void timerBox.offsetWidth;
        timerBox.classList.add("tick");
      }

      hasRendered = true;

      if (remaining <= 0) {
        wrap.style.setProperty("--lmct-progress", "100%");
        clearInterval(timerInterval);
        return;
      }

      remaining -= 1;
    }

    tick();

    var timerInterval = setInterval(tick, 1000);
  })();
</script>
