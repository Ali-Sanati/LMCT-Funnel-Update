<script>
  (function () {
    "use strict";

    const COMPANY_ID = "S9SGLM";
    const LIST_ID = "UuDfaY";
    const REVISION = "2026-07-15";
    const SNAPSHOT_KEY = "lmct_sheets_signup_v1";
    const GARLIC = "garlic:lmctgiveaway.com*>input.";

    const UPGRADE_WINDOW_URL = "https://api.lmctplus.com/api/v1/public/upgrade-offer/window";
    const SENT_KEY = "lmct_klaviyo_sent_" + LIST_ID;
    const WINDOW_KEY = "lmct_deer_park_upgrade_window_" + LIST_ID;

    function read(key) {
      try {
        return (localStorage.getItem(key) || "").trim();
      } catch (_) {
        return "";
      }
    }

    function readSignup() {
      try {
        const data = JSON.parse(read(SNAPSHOT_KEY) || "null");
        const age = data && Date.now() - data.capturedAt;

        if (data && data.email && Number.isFinite(data.capturedAt) && age >= 0 && age < 86400000) {
          return data;
        }
      } catch (_) {}

      return {
        email: read(GARLIC + "email"),
        name: read(GARLIC + "name"),
        phone: read(GARLIC + "phone"),
        plan: read("lmct_deer_park_plan"),
        customerHash: read("lmct_unique_hash"),
      };
    }

    function normalizePhone(value) {
      let phone = String(value || "").replace(/[^\d+]/g, "");
      if (/^04\d{8}$/.test(phone)) phone = "+61" + phone.slice(1);
      else if (/^614\d{8}$/.test(phone)) phone = "+" + phone;
      return /^\+[1-9]\d{7,14}$/.test(phone) ? phone : "";
    }

    async function getUpgradeWindow(signature) {
      const cached = JSON.parse(sessionStorage.getItem(WINDOW_KEY) || "null");
      if (cached && cached.signature === signature) {
        return cached.properties;
      }

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);

      try {
        const response = await fetch(UPGRADE_WINDOW_URL, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal,
        });

        if (!response.ok) {
          throw new Error("Upgrade offer window: HTTP " + response.status);
        }

        const { statusCode, data } = await response.json();

        if (statusCode !== 200 || !data) {
          throw new Error("Upgrade offer window: invalid response.");
        }

        const properties = {
          lmct_deer_park_upgrade_purchased_at: data.purchasedAt,
          lmct_deer_park_upgrade_opens_at: data.opensAt,
          lmct_deer_park_upgrade_expires_at: data.expiresAt,
        };

        const validDates = Object.values(properties).every((value) => typeof value === "string" && Number.isFinite(Date.parse(value)));

        if (!validDates) {
          throw new Error("Upgrade offer window: missing or invalid timestamps.");
        }

        sessionStorage.setItem(WINDOW_KEY, JSON.stringify({ signature, properties }));
        return properties;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function post(endpoint, data) {
      const response = await fetch("https://a.klaviyo.com/client/" + endpoint + "/?company_id=" + encodeURIComponent(COMPANY_ID), {
        method: "POST",
        keepalive: true,
        headers: {
          "Content-Type": "application/json",
          revision: REVISION,
        },
        body: JSON.stringify({ data }),
      });

      if (!response.ok) {
        throw new Error(endpoint + ": HTTP " + response.status + " " + (await response.text()));
      }
    }

    // Read before the Google Sheets script clears the pending signup.
    const signup = readSignup();

    async function sendToKlaviyo() {
      const email = String(signup.email || "")
        .trim()
        .toLowerCase();
      if (!email) return;

      const name = String(signup.name || "").trim();
      const [firstName, ...lastName] = name.split(/\s+/);
      const phone = normalizePhone(signup.phone);

      const properties = Object.fromEntries(
        Object.entries({
          full_name: name,
          phone_raw: signup.phone,
          lmct_unique_hash: signup.customerHash,
          deer_park_plan: signup.plan,
          lmct_signup_id: signup.submissionId,
          utm_rep: signup.rep,
          utm_source: signup.utm_source,
          utm_medium: signup.utm_medium,
          utm_campaign: signup.utm_campaign,
          utm_content: signup.utm_content,
          utm_term: signup.utm_term,
          utm_id: signup.utm_id,
        }).filter(([, value]) => value != null && value !== ""),
      );

      const attributes = {
        email,
        ...(firstName ? { first_name: firstName } : {}),
        ...(lastName.length ? { last_name: lastName.join(" ") } : {}),
        ...(phone ? { phone_number: phone } : {}),
        properties,
      };

      const signature = signup.submissionId || JSON.stringify(attributes);

      try {
        if (sessionStorage.getItem(SENT_KEY) === signature) return;

        const upgradeProperties = await getUpgradeWindow(signature);
        Object.assign(properties, upgradeProperties);

        await post("profiles", { type: "profile", attributes });

        await post("subscriptions", {
          type: "subscription",
          attributes: {
            custom_source: "LMCT+ Deer Park ClickFunnels",
            profile: {
              data: {
                type: "profile",
                attributes: {
                  email,
                  subscriptions: {
                    email: { marketing: { consent: "SUBSCRIBED" } },
                  },
                },
              },
            },
          },
          relationships: {
            list: { data: { type: "list", id: LIST_ID } },
          },
        });

        sessionStorage.setItem(SENT_KEY, signature);
        sessionStorage.removeItem(WINDOW_KEY);
        console.log("Klaviyo: profile, upgrade window and subscription requests accepted.");
      } catch (error) {
        console.error("Klaviyo:", error);
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", sendToKlaviyo, { once: true });
    } else {
      sendToKlaviyo();
    }
  })();
</script>
