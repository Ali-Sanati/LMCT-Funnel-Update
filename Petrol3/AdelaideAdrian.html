<style>

  .lmctAA__page {

    --lmctAA-navy: #020d48;
    --lmctAA-navy-deep: #01072c;
    --lmctAA-blue: #075ee6;
    --lmctAA-blue-bright: #03bfff;
    --lmctAA-cyan: #19d5ff;
    --lmctAA-lime: #cfff00;
    --lmctAA-lime-bright: #ecff28;
    --lmctAA-white: #ffffff;
    --lmctAA-muted: #c9d4f0;
    position: relative;
    isolation: isolate;
    width: 100%;
    min-width: 0;
    overflow: hidden;
    color: var(--lmctAA-white);
    font-family: "Inter", Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 26%, rgba(0, 121, 255, 0.55), transparent 27rem), radial-gradient(circle at 78% 54%, rgba(0, 164, 255, 0.25), transparent 31rem),

  }

  .lmctAA__page,
  .lmctAA__page * {
    box-sizing: border-box;
  }

  .lmctAA__page::before {
    position: absolute;
    z-index: -2;
    inset: 0;
    content: "";
    pointer-events: none;
    background-image:
      linear-gradient(90deg, rgba(1, 7, 43, 0.88) 0%, rgba(1, 8, 45, 0.7) 35%, rgba(1, 8, 45, 0.16) 64%, rgba(1, 8, 45, 0.1) 100%),

    background-position:
      center,
      center,
      right center;
    background-size:
      100% 100%,
      100% 100%,
      cover;
    background-repeat: no-repeat;
  }

  .lmctAA__page::after {
    position: absolute;
    z-index: -1;
    inset: 0;
    content: "";
    pointer-events: none;
    opacity: 0.22;
    background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent 75%);
    mask-image: linear-gradient(to bottom, #000, transparent 75%);

  .lmctAA__shell {
    position: relative;
    z-index: 1;
    width: min(1440px, calc(100% - 64px));
    margin: 0 auto;
    padding: 30px 0 38px;
  }

  .lmctAA__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    margin: 0 0 42px;
  }

  .lmctAA__brandWrap {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .lmctAA__brandLogo {
    display: block;
    width: clamp(170px, 18vw, 250px);
    height: auto;
  }

  .lmctAA__speedLines {
    display: grid;
    gap: 8px;
    width: 92px;
    transform: skewX(-27deg);
  }

  .lmctAA__speedLines i {
    display: block;
    height: 4px;
    border-radius: 99px;
    background: linear-gradient(90deg, transparent, var(--lmctAA-cyan));
    box-shadow: 0 0 14px rgba(25, 213, 255, 0.55);
  }

  .lmctAA__speedLines i:last-child {
    width: 70%;
    margin-left: 19px;
  }

  .lmctAA__brand {
    display: grid;
    justify-items: center;
    margin: 0;
    color: var(--lmctAA-white);
    filter: drop-shadow(0 5px 5px rgba(0, 0, 35, 0.38));

  .lmctAA__brand strong {
    font-family: "Barlow Condensed", Impact, sans-serif;
    font-size: clamp(58px, 7.8vw, 98px);
    font-weight: 900;
    letter-spacing: -0.055em;
    line-height: 0.72;
  }

  .lmctAA__brand span {
    display: block;
    min-width: 84%;
    margin-top: 12px;
    padding: 6px 20px 7px;
    border: 1px solid rgba(255, 255, 255, 0.72);
    border-radius: 999px;
    font-size: clamp(16px, 2.2vw, 28px);
    font-weight: 800;
    letter-spacing: 0.12em;
    line-height: 1;
    text-align: center;
    background: linear-gradient(180deg, #36d7ff, #049adf);
    box-shadow: 0 7px 18px rgba(0, 178, 255, 0.25);
  }

  .lmctAA__exclusive {
    display: flex;
    align-items: center;
    gap: 13px;
    max-width: 370px;
    padding: 14px 27px 15px;
    border-radius: 999px;
    color: #061035;
    background: linear-gradient(125deg, var(--lmctAA-lime-bright), #a9fa00);
    box-shadow: 0 16px 30px rgba(120, 255, 0, 0.18);

  .lmctAA__exclusive svg {
    flex: 0 0 32px;
    width: 32px;
    height: 32px;
  }

  .lmctAA__exclusive strong {
    font-family: "Barlow Condensed", Impact, sans-serif;
    font-size: clamp(17px, 1.65vw, 22px);
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.02;
    text-transform: uppercase;

  .lmctAA__exclusive strong span {

    margin-bottom: 4px;
    font-size: 0.62em;
    font-weight: 900;
    letter-spacing: 0.13em;

  .lmctAA__layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 42px;
    align-items: center;
    width: min(700px, 52vw);

  .lmctAA__offer {

    width: 100%;
    min-width: 0;
    padding: 18px 0 24px;

    background-size: contain;

  .lmctAA__price {

    color: var(--lmctAA-white);
    font-family: "Barlow Condensed", Impact, sans-serif;
    font-size: clamp(38px, 5.2vw, 67px);
    font-style: italic;
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 0.95;
    text-align: center;
    text-transform: uppercase;

    box-shadow:

    transform: rotate(0.7deg);
  }

  .lmctAA__bonus {
    display: grid;
    grid-template-columns: auto 2px minmax(0, 1fr);
    gap: clamp(16px, 2.6vw, 33px);
    align-items: center;
    width: min(95%, 670px);
    margin: 35px auto 0;
  }

  .lmctAA__bonusPrice {
    color: var(--lmctAA-lime);
    font-family: "Barlow Condensed", Impact, sans-serif;

    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 0.68;

  .lmctAA__bonusCopy {

    font-style: italic;
    font-weight: 800;
    letter-spacing: -0.025em;
    line-height: 0.86;
    text-transform: uppercase;
  }

  .lmctAA__bonusCopy::after {
    position: absolute;
    right: 0;
    bottom: 0;
    left: 0;
    height: 8px;
    content: "";

    background: var(--lmctAA-lime);
    clip-path: polygon(0 55%, 40% 20%, 74% 0, 100% 44%, 67% 55%, 28% 100%);
    transform: rotate(-2deg);
  }

  .lmctAA__action {
    position: relative;
    z-index: 5;
    width: min(92%, 700px);
    margin: 0 auto;
    padding: 18px;
    border: 1px solid rgba(255, 255, 255, 0.26);
    border-radius: 28px;
    background: rgba(3, 21, 91, 0.42);
    box-shadow:
      0 28px 70px rgba(0, 4, 47, 0.32),
      inset 0 0 34px rgba(0, 133, 255, 0.11);
    backdrop-filter: blur(10px);
  }

  .lmctAA__cta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    width: 100%;
    min-height: 92px;
    padding: 13px 15px 13px 27px;
    border: 2px solid rgba(255, 255, 255, 0.82);
    border-radius: 20px;
    color: var(--lmctAA-navy-deep) !important;
    font-family: "Barlow Condensed", Impact, sans-serif;
    font-size: clamp(31px, 3.4vw, 45px);
    font-style: italic;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 0.95;
    text-decoration: none !important;
    text-transform: uppercase;
    background: linear-gradient(115deg, var(--lmctAA-lime-bright), var(--lmctAA-lime) 57%, #9cf600);
    box-shadow:
      0 0 19px rgba(179, 255, 0, 0.6),
      inset 0 0 14px rgba(255, 255, 255, 0.42);
    transition:
      transform 170ms ease,
      box-shadow 170ms ease,
      filter 170ms ease;
  }

  .lmctAA__ctaIcon {
    display: grid;
    flex: 0 0 58px;
    width: 58px;
    height: 58px;
    place-items: center;
    border-radius: 50%;
    color: var(--lmctAA-lime);
    background: var(--lmctAA-navy-deep);
    box-shadow: 0 8px 18px rgba(1, 7, 44, 0.24);
    transition: transform 170ms ease;
  }

  .lmctAA__ctaIcon svg {
    display: block;
    width: 29px;
    height: 29px;
  }

  .lmctAA__cta:hover {
    color: var(--lmctAA-navy-deep) !important;
    filter: brightness(1.04);
    box-shadow:
      0 0 26px rgba(179, 255, 0, 0.72),
      inset 0 0 14px rgba(255, 255, 255, 0.5);
    transform: translateY(-2px);
  }

  .lmctAA__cta:hover .lmctAA__ctaIcon {
    transform: translate(3px, -3px) scale(1.04);
  }

  .lmctAA__cta:focus-visible {
    outline: 3px solid var(--lmctAA-white);
    outline-offset: 4px;
  }

  .lmctAA__trust {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0;
    width: min(700px, 52vw);
    margin-top: 48px;
    padding: 4px 0;
  }

  .lmctAA__trustItem {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    min-width: 0;
    padding: 8px 26px;
  }

  .lmctAA__trustItem + .lmctAA__trustItem::before {
    position: absolute;
    top: 8px;
    bottom: 8px;
    left: 0;
    width: 2px;
    content: "";
    background: linear-gradient(transparent, var(--lmctAA-cyan) 16%, var(--lmctAA-cyan) 84%, transparent);
  }

  .lmctAA__trustIcon {
    display: grid;
    flex: 0 0 62px;
    width: 62px;
    height: 62px;
    place-items: center;
    border: 2px solid var(--lmctAA-cyan);
    border-radius: 50%;
    color: var(--lmctAA-white);
    background: radial-gradient(circle at 35% 25%, #0987ff, #0431a0 72%);
    box-shadow:
      0 0 19px rgba(0, 194, 255, 0.42),
      inset 0 0 15px rgba(0, 211, 255, 0.2);
  }

  .lmctAA__trustIcon svg {
    display: block;
    width: 31px;
    height: 31px;
  }

  .lmctAA__trustItem strong {
    min-width: 0;
    font-family: "Barlow Condensed", Impact, sans-serif;
    font-size: clamp(18px, 2.2vw, 20px);
    font-weight: 800;
    letter-spacing: 0.01em;
    line-height: 0.95;
    text-transform: uppercase;
  }

  @media (max-width: 980px) {
    .lmctAA__shell {
      width: min(100% - 48px, 900px);
    }

    .lmctAA__layout,
    .lmctAA__trust {
      width: min(680px, 72vw);
    }

    .lmctAA__speedLines {
      width: 60px;
    }

    .lmctAA__trustItem {
      padding-inline: 18px;
    }

    .lmctAA__trustIcon {
      flex-basis: 54px;
      width: 54px;
      height: 54px;
    }
  }

    .lmctAA__brand span {

    }

    .lmctAA__annual {
      width: 94%;

    }

    .lmctAA__bonusPrice {

    }

    .lmctAA__bonusCopy {
      font-size: clamp(29px, 9.2vw, 47px);
    }

    .lmctAA__action {
      padding: 12px;
      border-radius: 22px;
    }

    .lmctAA__cta {
      min-height: 78px;
      padding: 11px 12px 11px 21px;
      border-radius: 16px;
      font-size: clamp(27px, 8.4vw, 37px);
    }

      flex-basis: 50px;
      width: 50px;
      height: 50px;
    }

    }
