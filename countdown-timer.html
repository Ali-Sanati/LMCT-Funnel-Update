<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap"
  rel="stylesheet"
/>

<style>
  .lmctCountdown,
  .lmctCountdown * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .lmctCountdown {
    width: 100%;
    font-family: "Montserrat", sans-serif;
    color: #ffffff;
    overflow: visible;
  }

  .lmctCountdownTop {
    position: relative;
    background:
      radial-gradient(
        circle at 50% -30%,
        rgba(255, 255, 255, 0.16),
        transparent 48%
      ),
      linear-gradient(180deg, #d50000 0%, #b20303 42%, #7d0000 100%);
    padding: clamp(4px, 0.8vw, 8px) clamp(14px, 2vw, 24px)
      clamp(14px, 2vw, 18px);
    box-shadow:
      inset 0 -1px 0 rgba(255, 255, 255, 0.08),
      0 8px 24px rgba(48, 0, 0, 0.24);
  }

  .lmctCountdownTitle {
    text-align: center;
    font-size: clamp(20px, 3vw, 31px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: 0.015em;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
  }

  .lmctCountdownProgress {
    /* width: min(48vw, 440px); */
    max-width: 1170px;
    height: clamp(16px, 2vw, 22px);
    margin: clamp(7px, 1vw, 10px) auto 0;
    padding: 2px;
    overflow: hidden;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.86);
    background: rgba(98, 0, 0, 0.42);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.14),
      0 3px 8px rgba(0, 0, 0, 0.22);
  }

  .lmctCountdownProgressFill {
    position: relative;
    height: 100%;
    width: 0%;
    border-radius: 4px;
    overflow: hidden;
    transform-origin: left center;
    will-change: width, transform;
    background: linear-gradient(90deg, #ff4600 0%, #ff7b00 52%, #ffb100 100%);
    transition:
      width 1.7s cubic-bezier(0.25, 0.46, 0.45, 0.94),
      filter 0.35s ease,
      box-shadow 0.35s ease;
    animation: lmctCountdownFillPulse 2s ease-in-out infinite;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.34),
      0 0 14px rgba(255, 143, 0, 0.28),
      0 0 30px rgba(255, 98, 0, 0.18);
  }

  .lmctCountdownProgressFill.is-live {
    transition:
      width 0.95s linear,
      filter 0.35s ease,
      box-shadow 0.35s ease;
  }

  .lmctCountdownProgressFill::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 245, 214, 0.1) 40%,
      rgba(255, 245, 214, 0.2) 50%,
      rgba(255, 245, 214, 0.1) 60%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: lmctCountdownBarShimmer 2s ease-in-out 1s infinite;
    pointer-events: none;
  }

  .lmctCountdownProgressStripes {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(
      -45deg,
      transparent 0 8px,
      rgba(0, 0, 0, 0.12) 8px 16px
    );
    background-size: 22.6px 100%;
    border-radius: inherit;
    animation: lmctCountdownStripeMove 0.8s linear infinite;
    pointer-events: none;
  }

  .lmctCountdownProgressEdge {
    position: absolute;
    top: 0;
    right: 0;
    width: clamp(4px, 0.8vw, 6px);
    height: 100%;
    background: rgba(255, 245, 214, 0.42);
    box-shadow:
      0 0 10px rgba(255, 245, 214, 0.35),
      0 0 18px rgba(255, 98, 0, 0.42);
    border-radius: 0 4px 4px 0;
    animation: lmctCountdownBarEdgePulse 1.2s ease-in-out infinite;
    pointer-events: none;
  }

  .lmctCountdownProgressFill.is-ending {
    filter: saturate(1.12) brightness(1.04);
    animation-duration: 1.25s;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.38),
      0 0 18px rgba(255, 143, 0, 0.34),
      0 0 32px rgba(255, 98, 0, 0.24);
  }

  .lmctCountdownProgressFill.is-ending::before {
    animation-duration: 1.1s;
  }

  .lmctCountdownProgressFill.is-ending .lmctCountdownProgressStripes {
    animation-duration: 0.56s;
  }

  .lmctCountdownProgressFill.is-ending .lmctCountdownProgressEdge {
    animation-duration: 0.78s;
  }

  @keyframes lmctCountdownFillPulse {
    0% {
      transform: scaleX(1);
    }
    50% {
      transform: scaleX(1.018);
    }
    100% {
      transform: scaleX(1);
    }
  }

  @keyframes lmctCountdownBarShimmer {
    0% {
      left: -100%;
    }
    100% {
      left: 200%;
    }
  }

  @keyframes lmctCountdownStripeMove {
    0% {
      background-position: 0 0;
    }
    100% {
      background-position: 22.6px 0;
    }
  }

  @keyframes lmctCountdownBarEdgePulse {
    0%,
    100% {
      opacity: 0.6;
    }
    50% {
      opacity: 1;
    }
  }

  .lmctCountdownClockWrap {
    position: absolute;
    left: 50%;
    bottom: -100%;
    transform: translate(-50%, -50%);
    width: min(calc(100% - 28px), 260px);
    z-index: 2;
  }

  .lmctCountdownClockWrap::before,
  .lmctCountdownClockWrap::after {
    content: "";
    position: absolute;
    top: 11px;
    width: 46px;
    height: 30px;
    background: linear-gradient(180deg, #ffd84b 0%, #ffbf17 100%);
    box-shadow: 0 6px 12px rgba(93, 54, 0, 0.25);
    z-index: -1;
  }

  /* .lmctCountdownClockWrap::before {
    left: -24px;
    clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%);
  }

  .lmctCountdownClockWrap::after {
    right: -24px;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 22% 100%);
  } */

  .lmctCountdownClock {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(6px, 1vw, 10px);
    padding: 5px 14px 7px;
    border-radius: 0 0 18px 18px;
    background: linear-gradient(180deg, #861212 0%, #970000 44%, #780000 100%);
    /* border: 1px solid rgba(103, 0, 0, 0.84); */
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 10px 18px rgba(62, 0, 0, 0.26);
  }

  .lmctCountdownUnit {
    min-width: clamp(48px, 8vw, 58px);
    text-align: center;
  }

  .lmctCountdownValue {
    display: block;
    font-size: clamp(22px, 4vw, 36px);
    line-height: 0.95;
    font-weight: 900;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
  }

  .lmctCountdownLabel {
    display: block;
    margin-top: 1px;
    font-size: clamp(10px, 1.4vw, 14px);
    line-height: 1;
    font-weight: 700;
    text-transform: lowercase;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.94);
  }

  .lmctCountdownDivider {
    display: block;
    padding-top: clamp(4px, 0.7vw, 6px);
    font-size: clamp(20px, 3.2vw, 32px);
    line-height: 1;
    font-weight: 900;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.24);
  }

  .lmctCountdownCaution {
    height: clamp(22px, 3.7vw, 38px);
    background:
      linear-gradient(180deg, rgba(0, 0, 0, 0.15), transparent 28%),
      repeating-linear-gradient(
        -72deg,
        #000000 0 17px,
        #000000 17px 31px,
        #ffd760 31px 52px
      );
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, 0.1),
      inset 0 -1px 0 rgba(0, 0, 0, 0.22);
  }

  @media (max-width: 770px) {
    .lmctCountdownTop {
      padding-left: 12px;
      padding-right: 12px;
    }

    .lmctCountdownProgress {
      width: min(70vw, 360px);
    }

    .lmctCountdownClockWrap {
      width: min(calc(100% - 22px), 228px);
    }

    .lmctCountdownClockWrap::before,
    .lmctCountdownClockWrap::after {
      height: 24px;
      bottom: 10px;
    }

    /* .lmctCountdownClockWrap::before {
      left: -16px;
    }

    .lmctCountdownClockWrap::after {
      right: -16px;
    } */
  }
</style>

<div
  class="lmctCountdown"
  data-target=""
  data-initial="13:52:39"
  data-duration-hours="24"
  data-progress="89"
>
  <div class="lmctCountdownTop">
    <div class="lmctCountdownTitle">LESS THAN 24 HOURS!</div>
    <div class="lmctCountdownProgress" aria-hidden="true">
      <div class="lmctCountdownProgressFill">
        <div class="lmctCountdownProgressStripes"></div>
        <div class="lmctCountdownProgressEdge"></div>
      </div>
    </div>

    <div class="lmctCountdownClockWrap">
      <div class="lmctCountdownClock">
        <div class="lmctCountdownUnit">
          <span class="lmctCountdownValue" data-lmct-hours>13</span>
          <span class="lmctCountdownLabel">hours</span>
        </div>
        <span class="lmctCountdownDivider">:</span>
        <div class="lmctCountdownUnit">
          <span class="lmctCountdownValue" data-lmct-minutes>52</span>
          <span class="lmctCountdownLabel">mins</span>
        </div>
        <span class="lmctCountdownDivider">:</span>
        <div class="lmctCountdownUnit">
          <span class="lmctCountdownValue" data-lmct-seconds>39</span>
          <span class="lmctCountdownLabel">secs</span>
        </div>
      </div>
    </div>
  </div>

  <div class="lmctCountdownCaution" aria-hidden="true"></div>
</div>

<script>
  (function () {
    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function pad(value) {
      return String(Math.max(0, value)).padStart(2, "0");
    }

    function parseInitialTime(value) {
      if (!value) {
        return null;
      }

      var parts = value.split(":").map(Number);
      if (
        parts.length !== 3 ||
        parts.some(function (part) {
          return Number.isNaN(part) || part < 0;
        })
      ) {
        return null;
      }

      return ((parts[0] * 60 + parts[1]) * 60 + parts[2]) * 1000;
    }

    document.querySelectorAll(".lmctCountdown").forEach(function (root) {
      var hoursEl = root.querySelector("[data-lmct-hours]");
      var minutesEl = root.querySelector("[data-lmct-minutes]");
      var secondsEl = root.querySelector("[data-lmct-seconds]");
      var progressEl = root.querySelector(".lmctCountdownProgressFill");
      var fallbackDurationMs = Math.max(
        1000,
        (parseFloat(root.dataset.durationHours) || 24) * 60 * 60 * 1000,
      );
      var explicitTargetMs = root.dataset.target
        ? new Date(root.dataset.target).getTime()
        : NaN;
      var initialMs = parseInitialTime(root.dataset.initial);
      var configuredProgress = parseFloat(root.dataset.progress);
      var targetMs = Number.isFinite(explicitTargetMs)
        ? explicitTargetMs
        : Date.now() + (initialMs !== null ? initialMs : fallbackDurationMs);
      var initialRemainingMs = Math.max(1000, targetMs - Date.now());
      var initialProgress = Number.isFinite(configuredProgress)
        ? clamp(configuredProgress, 0, 100)
        : 100;
      var hasAnimatedIn = false;
      var liveTransitionTimerId = null;

      function render(remainingMs, animateIn) {
        var safeRemainingMs = Math.max(0, remainingMs);
        var totalSeconds = Math.floor(safeRemainingMs / 1000);
        var hours = Math.floor(totalSeconds / 3600);
        var minutes = Math.floor((totalSeconds % 3600) / 60);
        var seconds = totalSeconds % 60;
        var fillPercent = root.dataset.progress
          ? clamp(
              (safeRemainingMs / initialRemainingMs) * initialProgress,
              0,
              100,
            )
          : clamp((safeRemainingMs / fallbackDurationMs) * 100, 0, 100);

        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);
        if (animateIn && !hasAnimatedIn) {
          progressEl.classList.remove("is-live");
          progressEl.style.width = "0%";
          window.requestAnimationFrame(function () {
            progressEl.style.width = fillPercent.toFixed(2) + "%";
          });

          if (liveTransitionTimerId) {
            window.clearTimeout(liveTransitionTimerId);
          }
          liveTransitionTimerId = window.setTimeout(function () {
            progressEl.classList.add("is-live");
          }, 1750);
          hasAnimatedIn = true;
        } else {
          progressEl.style.width = fillPercent.toFixed(2) + "%";
        }

        progressEl.classList.toggle("is-ending", fillPercent <= 18);
      }

      function tick() {
        var remainingMs = targetMs - Date.now();
        render(remainingMs);

        if (remainingMs <= 0) {
          if (liveTransitionTimerId) {
            window.clearTimeout(liveTransitionTimerId);
          }
          window.clearInterval(timerId);
        }
      }

      render(targetMs - Date.now(), true);
      var timerId = window.setInterval(tick, 1000);
    });
  })();
</script>
