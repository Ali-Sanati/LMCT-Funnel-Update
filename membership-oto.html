<script>
  (function () {
    var THANK_YOU_PAGE_URL = "https://lmctgiveaway.com/250k-cash-thank-you";
    var STORAGE_KEY = "garlic:lmctgiveaway.com*>input.email";
    var API_URL = "https://lmctmembers.com/api/check-user-active";

    function hideInitialErrors() {
      var modalError = document.querySelector(
        "#cCmodalPopup > div > div.de.elHeadlineWrapper > div",
      );
      var creditCardForm = document.querySelector(
        '[data-title="Credit Card Form"]',
      );
      var declinedMessage = document.getElementById("order-declined-message");

      if (modalError) modalError.style.display = "none";
      if (creditCardForm) creditCardForm.style.display = "none";
      if (declinedMessage) declinedMessage.style.display = "none";
    }

    function getBuyButton() {
      return document.querySelector('a[href="#submit-form"]');
    }

    function getEmailInput() {
      return (
        document.querySelector('input[name="email"]') ||
        document.querySelector('input[name="contact[email]"]') ||
        document.getElementById("cf_contact_email")
      );
    }

    function getPackageButtons() {
      return Array.from(
        document.querySelectorAll("a.elButton[rel='noopener noreferrer']"),
      ).filter(function (button) {
        return button.innerText.includes("Select");
      });
    }

    function getOtoButtons() {
      return document.querySelectorAll('a[href*="#yes-link-multi-"]');
    }

    function normalizeEmail(email) {
      return (email || "").trim().toLowerCase();
    }

    function isValidEmail(email) {
      return email.includes("@") && email.includes(".") && email.length > 5;
    }

    function hideExpressButtons() {
      var applePayButton = document.getElementById("payment-request-button");
      var linkSaveButton = document.getElementById("link-save");

      if (applePayButton) applePayButton.style.display = "none";
      if (linkSaveButton) linkSaveButton.style.display = "none";
    }

    function showExpressButtons() {
      var applePayButton = document.getElementById("payment-request-button");
      var linkSaveButton = document.getElementById("link-save");

      if (
        applePayButton &&
        applePayButton.innerText.trim() !==
          "Apple or Android Pay will Display here when available."
      ) {
        applePayButton.style.display = "block";
      }

      if (linkSaveButton) {
        linkSaveButton.style.display = "inline-flex";
      }
    }

    function updateBuyButton(isActive, buyButton, originalButtonHtml) {
      if (!buyButton) return;

      var parentElement = buyButton.parentElement;

      if (isActive) {
        buyButton.href = THANK_YOU_PAGE_URL;
        buyButton.innerHTML =
          '<span class="elButtonMain">LOYALTY MEMBERSHIP ALREADY ACTIVE WITH THIS EMAIL! CLICK TO CONTINUE ></span><span class="elButtonSub"></span>';

        if (parentElement) parentElement.removeAttribute("data-title");
        buyButton.style.backgroundColor = "gray";
        hideExpressButtons();
      } else {
        buyButton.href = "#submit-form";
        buyButton.innerHTML = originalButtonHtml || buyButton.innerHTML;

        if (parentElement)
          parentElement.setAttribute("data-title", "rainbow-b");
        buyButton.style.backgroundColor = "";
        showExpressButtons();
      }
    }

    function redirectIfActive(responseData) {
      if (responseData && responseData.is_active) {
        window.location.href = THANK_YOU_PAGE_URL;
        return true;
      }
      return false;
    }

    function updateOfferButtonsForActiveMembers(packageButtons, otoButtons) {
      packageButtons.forEach(function (button) {
        var parent = button.parentElement;
        if (parent) parent.removeAttribute("data-title");

        button.innerHTML =
          '<span class="elButtonMain">LOYALTY MEMBERSHIP ALREADY ACTIVE WITH THIS EMAIL! CLICK TO CONTINUE ></span><span class="elButtonSub"></span>';
        button.href = THANK_YOU_PAGE_URL;
        button.style.backgroundColor = "gray";
        button.removeAttribute("data-upsell");
      });

      otoButtons.forEach(function (button) {
        var parent = button.parentElement;
        if (parent) parent.removeAttribute("data-title");

        button.innerHTML =
          '<span class="elButtonMain">LOYALTY MEMBERSHIP ALREADY ACTIVE WITH THIS EMAIL! CLICK TO CONTINUE ></span><span class="elButtonSub"></span>';
        button.href = THANK_YOU_PAGE_URL;
        button.style.backgroundColor = "gray";
        button.removeAttribute("data-upsell");
      });
    }

    function checkUserActive(email) {
      return fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ email: email }),
        headers: {
          "Content-Type": "application/json",
        },
      }).then(function (response) {
        return response.json();
      });
    }

    function handleEmailCheck(email, buyButton, originalButtonHtml) {
      var normalizedEmail = normalizeEmail(email);
      if (!isValidEmail(normalizedEmail)) return;

      checkUserActive(normalizedEmail)
        .then(function (responseData) {
          updateBuyButton(
            !!responseData.is_active,
            buyButton,
            originalButtonHtml,
          );
        })
        .catch(function (error) {
          console.error("Membership check failed:", error);
          updateBuyButton(false, buyButton, originalButtonHtml);
        });
    }

    function attachEmailSuggestionListener(handler) {
      var emailSuggestionLink = document.querySelector(".email_suggestion a");
      if (
        !emailSuggestionLink ||
        emailSuggestionLink.dataset.memberCheckBound === "true"
      ) {
        return;
      }

      emailSuggestionLink.dataset.memberCheckBound = "true";
      emailSuggestionLink.addEventListener("click", function () {
        handler(emailSuggestionLink.innerText);
      });
    }

    function observeEmailSuggestions(handler) {
      var observer = new MutationObserver(function (mutationsList) {
        mutationsList.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (
              node.querySelector &&
              node.querySelector(".email_suggestion a")
            ) {
              attachEmailSuggestionListener(handler);
            }
          });
        });
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true,
      });
    }

    function init() {
      hideInitialErrors();

      var buyButton = getBuyButton();
      var emailInput = getEmailInput();
      var packageButtons = getPackageButtons();
      var otoButtons = getOtoButtons();
      var originalButtonHtml = buyButton ? buyButton.innerHTML : "";

      console.log("buyButton", buyButton);
      console.log("emailInput", emailInput);
      console.log("packageButtons", packageButtons);
      console.log("otoButtons", otoButtons);

      if (buyButton && emailInput) {
        function onEmailChange(forcedEmail) {
          var email = forcedEmail || emailInput.value;
          handleEmailCheck(email, buyButton, originalButtonHtml);
        }

        emailInput.addEventListener("input", function () {
          onEmailChange();
        });

        attachEmailSuggestionListener(onEmailChange);
        observeEmailSuggestions(onEmailChange);

        emailInput.dispatchEvent(new Event("input", { bubbles: true }));
        return;
      }

      var storedEmail = normalizeEmail(localStorage.getItem(STORAGE_KEY));
      if (!isValidEmail(storedEmail)) return;

      checkUserActive(storedEmail)
        .then(function (responseData) {
          if (redirectIfActive(responseData)) return;

          if (responseData && responseData.is_active) {
            updateOfferButtonsForActiveMembers(packageButtons, otoButtons);
          }
        })
        .catch(function (error) {
          console.error("Membership check failed:", error);
          updateBuyButton(false, buyButton, originalButtonHtml);
        });
    }

    window.addEventListener("load", function () {
      setTimeout(function () {
        try {
          init();
        } catch (err) {
          console.error("Script exception:", err);
        }
      }, 1000);
    });
  })();
</script>
