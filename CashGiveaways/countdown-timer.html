<link
  href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap"
  rel="stylesheet"
/>

<style>
  .lmctCountdown,
  .lmctCountdown * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  .lmctCountdown {
    --lmct-ink: #0b1526;
    --lmct-muted: #5f6f86;
    --lmct-brand-1: #0476c4;
    --lmct-brand-2: #0c9ffd;
    --lmct-brand-3: #3fb8ff;
    --lmct-danger: #eb5757;
    --lmct-hot: #ff7a00;
    --lmct-warning: #ffd166;
    width: 100%;
    font-family: "Montserrat", sans-serif;
    color: #ffffff;
    overflow: visible;
  }

  .lmctCountdownTop {
    position: relative;
    isolation: isolate;
    overflow: visible;
    padding: clamp(15px, 2.2vw, 24px) clamp(14px, 2vw, 24px)
      clamp(18px, 2.8vw, 28px);
    background:
      linear-gradient(90deg, rgba(235, 87, 87, 0.95), #ff7a00 42%, rgba(12, 159, 253, 0)) top / 100% 5px no-repeat,
      repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.075) 0 1px, transparent 1px 12px),
      linear-gradient(135deg, #06182d 0%, #074472 47%, #0c9ffd 100%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow:
      inset 0 -1px 0 rgba(255, 255, 255, 0.12),
      0 16px 34px rgba(8, 25, 54, 0.16);
  }

  .lmctCountdownTop::after {
    content: "";
    position: absolute;
    inset: auto 0 0;
    height: clamp(18px, 3vw, 28px);
    z-index: -1;
    background: linear-gradient(180deg, rgba(5, 17, 34, 0), rgba(5, 17, 34, 0.26));
    pointer-events: none;
  }

  .lmctCountdownHeader {
    display: grid;
    gap: clamp(7px, 1vw, 10px);
    max-width: 1170px;
    margin: 0 auto;
    text-align: center;
  }

  .lmctCountdownKicker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
    padding: 8px 14px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    background: rgba(235, 87, 87, 0.2);
    box-shadow: 0 10px 24px rgba(235, 87, 87, 0.18);
    color: #fff7ed;
    font-size: clamp(10px, 1.5vw, 12px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .lmctCountdownKicker::before {
    content: "";
    width: 9px;
    height: 9px;
    flex: 0 0 auto;
    border-radius: 999px;
    background: var(--lmct-warning);
    box-shadow:
      0 0 0 7px rgba(255, 209, 102, 0.14),
      0 0 18px rgba(255, 209, 102, 0.62);
    animation: lmctCountdownDotPulse 1.2s ease-in-out infinite;
  }

  .lmctCountdownTitle {
    text-align: center;
    font-size: clamp(23px, 4vw, 44px);
    line-height: 0.95;
    font-weight: 900;
    letter-spacing: 0;
    text-transform: uppercase;
    text-shadow:
      0 4px 14px rgba(0, 0, 0, 0.3),
      0 0 20px rgba(12, 159, 253, 0.18);
  }

  .lmctCountdownSubline {
    color: rgba(255, 255, 255, 0.86);
    font-size: clamp(11px, 1.7vw, 14px);
    font-weight: 800;
    line-height: 1.35;
    text-transform: uppercase;
  }

  .lmctCountdownProgress {
    max-width: 1170px;
    height: clamp(16px, 2vw, 22px);
    margin: clamp(13px, 1.7vw, 18px) auto 0;
    padding: 2px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.72);
    border-radius: 999px;
    background: rgba(4, 18, 34, 0.46);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.12),
      0 5px 13px rgba(0, 0, 0, 0.24);
  }

  .lmctCountdownProgressFill {
    position: relative;
    height: 100%;
    width: 0%;
    overflow: hidden;
    border-radius: inherit;
    transform-origin: left center;
    will-change: width, transform;
    background: linear-gradient(90deg, #eb5757 0%, #ff7a00 52%, #ffd166 100%);
    transition:
      width 1.7s cubic-bezier(0.25, 0.46, 0.45, 0.94),
      filter 0.35s ease,
      box-shadow 0.35s ease;
    animation: lmctCountdownFillPulse 2s ease-in-out infinite;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.42),
      0 0 18px rgba(255, 122, 0, 0.34),
      0 0 34px rgba(235, 87, 87, 0.22);
  }

  .lmctCountdownProgressFill.is-live {
    transition:
      width 0.95s linear,
      filter 0.35s ease,
      box-shadow 0.35s ease;
  }

  .lmctCountdownProgressFill::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
      90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.1) 40%,
      rgba(255, 255, 255, 0.28) 50%,
      rgba(255, 255, 255, 0.1) 60%,
      rgba(255, 255, 255, 0) 100%
    );
    animation: lmctCountdownBarShimmer 2s ease-in-out 1s infinite;
    pointer-events: none;
  }

  .lmctCountdownProgressStripes {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background-image: repeating-linear-gradient(
      -45deg,
      transparent 0 8px,
      rgba(0, 0, 0, 0.12) 8px 16px
    );
    background-size: 22.6px 100%;
    animation: lmctCountdownStripeMove 0.8s linear infinite;
    pointer-events: none;
  }

  .lmctCountdownProgressEdge {
    position: absolute;
    top: 0;
    right: 0;
    width: clamp(4px, 0.8vw, 6px);
    height: 100%;
    border-radius: 0 999px 999px 0;
    background: rgba(255, 255, 255, 0.7);
    box-shadow:
      0 0 12px rgba(255, 255, 255, 0.55),
      0 0 20px rgba(255, 122, 0, 0.58);
    animation: lmctCountdownBarEdgePulse 1.2s ease-in-out infinite;
    pointer-events: none;
  }

  .lmctCountdownProgressFill.is-ending {
    filter: saturate(1.14) brightness(1.05);
    animation-duration: 1.25s;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.42),
      0 0 20px rgba(235, 87, 87, 0.44),
      0 0 36px rgba(255, 122, 0, 0.28);
  }

  .lmctCountdownProgressFill.is-ending::before {
    animation-duration: 1.1s;
  }

  .lmctCountdownProgressFill.is-ending .lmctCountdownProgressStripes {
    animation-duration: 0.56s;
  }

  .lmctCountdownProgressFill.is-ending .lmctCountdownProgressEdge {
    animation-duration: 0.78s;
  }

  @keyframes lmctCountdownDotPulse {
    0%,
    100% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.22);
      opacity: 0.72;
    }
  }

  @keyframes lmctCountdownFillPulse {
    0% {
      transform: scaleX(1);
    }
    50% {
      transform: scaleX(1.012);
    }
    100% {
      transform: scaleX(1);
    }
  }

  @keyframes lmctCountdownBarShimmer {
    0% {
      left: -100%;
    }
    100% {
      left: 200%;
    }
  }

  @keyframes lmctCountdownStripeMove {
    0% {
      background-position: 0 0;
    }
    100% {
      background-position: 22.6px 0;
    }
  }

  @keyframes lmctCountdownBarEdgePulse {
    0%,
    100% {
      opacity: 0.6;
    }
    50% {
      opacity: 1;
    }
  }

  .lmctCountdownClockWrap {
    position: relative;
    z-index: 1;
    width: min(calc(100% - 28px), 430px);
    margin: clamp(18px, 2.2vw, 24px) auto 0;
  }

  .lmctCountdownClock {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(7px, 1vw, 12px);
    padding: clamp(10px, 1.5vw, 14px) clamp(12px, 2vw, 20px);
    border: 1px solid rgba(235, 87, 87, 0.24);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.96);
    color: var(--lmct-ink);
    box-shadow:
      0 18px 36px rgba(8, 25, 54, 0.22),
      0 0 0 6px rgba(255, 255, 255, 0.16),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  .lmctCountdownUnit {
    min-width: clamp(54px, 8vw, 82px);
    text-align: center;
  }

  .lmctCountdownValue {
    display: block;
    color: var(--lmct-ink);
    font-size: clamp(30px, 5vw, 48px);
    line-height: 0.92;
    font-weight: 900;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    transform-origin: 50% 15%;
    backface-visibility: hidden;
  }

  .lmctCountdownUnit:last-child .lmctCountdownValue {
    color: var(--lmct-danger);
    text-shadow: 0 0 18px rgba(235, 87, 87, 0.18);
  }

  .lmctDigitFlip {
    animation: lmctDigitFlip 0.42s cubic-bezier(0.2, 0.72, 0.22, 1);
  }

  @keyframes lmctDigitFlip {
    0% {
      opacity: 0.3;
      transform: translateY(6px) rotateX(-88deg);
    }
    55% {
      opacity: 1;
    }
    100% {
      opacity: 1;
      transform: translateY(0) rotateX(0deg);
    }
  }

  .lmctCountdownLabel {
    display: block;
    margin-top: 4px;
    color: var(--lmct-muted);
    font-size: clamp(10px, 1.4vw, 13px);
    line-height: 1;
    font-weight: 800;
    text-transform: uppercase;
  }

  .lmctCountdownDivider {
    display: block;
    padding-top: clamp(4px, 0.7vw, 7px);
    color: var(--lmct-brand-2);
    font-size: clamp(24px, 3.4vw, 38px);
    line-height: 1;
    font-weight: 900;
  }

  .lmctCountdownCaution {
    position: relative;
    overflow: hidden;
    height: clamp(14px, 2vw, 20px);
    background:
      repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.16) 0 10px, rgba(255, 255, 255, 0) 10px 21px),
      linear-gradient(90deg, #eb5757 0%, #ff7a00 50%, #0476c4 100%);
    box-shadow:
      inset 0 2px 0 rgba(255, 255, 255, 0.14),
      inset 0 -1px 0 rgba(0, 0, 0, 0.18);
  }

  .lmctCountdownCaution::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.24), transparent);
    transform: translateX(-100%);
    animation: lmctCountdownRailSweep 2.6s ease-in-out infinite;
  }

  @keyframes lmctCountdownRailSweep {
    0% {
      transform: translateX(-100%);
    }
    60%,
    100% {
      transform: translateX(100%);
    }
  }

  .lmctCountdown.lmctUrgent .lmctCountdownTop {
    background:
      linear-gradient(90deg, #eb5757, #ff7a00 45%, rgba(12, 159, 253, 0)) top / 100% 5px no-repeat,
      repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.075) 0 1px, transparent 1px 12px),
      linear-gradient(135deg, #160b12 0%, #8b1725 54%, #ff7a00 100%);
  }

  .lmctCountdown.lmctUrgent .lmctCountdownKicker,
  .lmctCountdown.lmctUrgent .lmctCountdownClock {
    animation: lmctUrgentFlash 0.88s ease-in-out infinite;
  }

  .lmctCountdown.lmctUrgent .lmctCountdownProgressFill {
    animation-duration: 1.08s;
  }

  .lmctCountdown.lmctUrgent .lmctCountdownProgressFill::before {
    animation-duration: 0.95s;
  }

  .lmctCountdown.lmctUrgent .lmctCountdownProgressStripes {
    animation-duration: 0.46s;
  }

  .lmctCountdown.lmctUrgent .lmctCountdownProgressEdge {
    animation-duration: 0.62s;
  }

  @keyframes lmctUrgentFlash {
    0%,
    100% {
      filter: brightness(1);
    }
    50% {
      filter: brightness(1.08) saturate(1.12);
    }
  }

  @media (max-width: 770px) {
    .lmctCountdownTop {
      padding-right: 12px;
      padding-left: 12px;
    }

    .lmctCountdownKicker {
      padding: 7px 12px;
      letter-spacing: 0.08em;
    }

    .lmctCountdownProgress {
      width: 100%;
    }

    .lmctCountdownClockWrap {
      width: min(calc(100% - 22px), 380px);
    }

    .lmctCountdownClock {
      border-radius: 16px;
    }

    .lmctCountdownUnit {
      min-width: clamp(46px, 18vw, 68px);
    }
  }

  @media (max-width: 430px) {
    .lmctCountdownTop {
      padding-bottom: 18px;
    }

    .lmctCountdownSubline {
      width: min(100%, 28ch);
      margin: 0 auto;
      font-size: 10px;
    }

    .lmctCountdownClock {
      gap: 5px;
      padding: 10px;
    }

    .lmctCountdownUnit {
      min-width: 44px;
    }

    .lmctCountdownValue {
      font-size: clamp(27px, 10vw, 34px);
    }

    .lmctCountdownLabel {
      font-size: 9px;
    }

    .lmctCountdownDivider {
      font-size: 24px;
      padding-top: 5px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lmctCountdown *,
    .lmctCountdown *::before,
    .lmctCountdown *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<div
  id="lmctBannerRoot"
  class="lmctCountdown"
  data-target=""
  data-initial="13:52:39"
  data-duration-hours="24"
  data-progress="89"
  role="timer"
  aria-label="Offer countdown"
>
  <div class="lmctCountdownTop">
    <div class="lmctCountdownHeader">
      <div class="lmctCountdownKicker">Final entry window</div>
      <div class="lmctCountdownTitle">Less than 24 hours!</div>
      <div class="lmctCountdownSubline">Secure your entries before the draw closes.</div>
    </div>

    <div class="lmctCountdownProgress" aria-hidden="true">
      <div class="lmctCountdownProgressFill">
        <div class="lmctCountdownProgressStripes"></div>
        <div class="lmctCountdownProgressEdge"></div>
      </div>
    </div>

    <div class="lmctCountdownClockWrap">
      <div class="lmctCountdownClock">
        <div class="lmctCountdownUnit">
          <span
            class="lmctCountdownValue"
            id="lmctHours"
            data-lmct-hours
          >13</span>
          <span class="lmctCountdownLabel">hours</span>
        </div>
        <span class="lmctCountdownDivider">:</span>
        <div class="lmctCountdownUnit">
          <span
            class="lmctCountdownValue"
            id="lmctMins"
            data-lmct-minutes
          >52</span>
          <span class="lmctCountdownLabel">mins</span>
        </div>
        <span class="lmctCountdownDivider">:</span>
        <div class="lmctCountdownUnit">
          <span
            class="lmctCountdownValue"
            id="lmctSecs"
            data-lmct-seconds
          >39</span>
          <span class="lmctCountdownLabel">secs</span>
        </div>
      </div>
    </div>
  </div>

  <div class="lmctCountdownCaution" aria-hidden="true"></div>
</div>

<script>
  var LMCT_TARGET_DATE =
    typeof window.LMCT_TARGET_DATE === "string" ? window.LMCT_TARGET_DATE : "";
  var LMCT_TIMEZONE =
    typeof window.LMCT_TIMEZONE === "string" ? window.LMCT_TIMEZONE : "AEST";

  (function () {
    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function pad(value) {
      return String(Math.max(0, value)).padStart(2, "0");
    }

    function parseInitialTime(value) {
      if (!value) {
        return null;
      }

      var parts = value.split(":").map(Number);
      if (
        parts.length !== 3 ||
        parts.some(function (part) {
          return Number.isNaN(part) || part < 0;
        })
      ) {
        return null;
      }

      return ((parts[0] * 60 + parts[1]) * 60 + parts[2]) * 1000;
    }

    function flip(element) {
      element.classList.remove("lmctDigitFlip");
      void element.offsetWidth;
      element.classList.add("lmctDigitFlip");
    }

    function parseTimezoneTarget(dateString, timezoneName) {
      var timezoneOffsets = { AEST: 10, AEDT: 11 };
      var parts = dateString
        ? dateString.match(
            /(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/
          )
        : null;

      if (!parts) {
        return NaN;
      }

      return Date.UTC(
        Number(parts[1]),
        Number(parts[2]) - 1,
        Number(parts[3]),
        Number(parts[4]) - (timezoneOffsets[timezoneName] || 10),
        Number(parts[5]),
        Number(parts[6])
      );
    }

    var root = document.getElementById("lmctBannerRoot");
    if (!root) {
      return;
    }

    var hoursEl =
      document.getElementById("lmctHours") ||
      root.querySelector("[data-lmct-hours]");
    var minutesEl =
      document.getElementById("lmctMins") ||
      root.querySelector("[data-lmct-minutes]");
    var secondsEl =
      document.getElementById("lmctSecs") ||
      root.querySelector("[data-lmct-seconds]");
    var progressEl = root.querySelector(".lmctCountdownProgressFill");

    if (!hoursEl || !minutesEl || !secondsEl || !progressEl) {
      return;
    }

    var fallbackDurationMs = Math.max(
      1000,
      (parseFloat(root.dataset.durationHours) || 24) * 60 * 60 * 1000
    );
    var inlineTargetMs = root.dataset.target
      ? new Date(root.dataset.target).getTime()
      : NaN;
    var ruleTargetMs = parseTimezoneTarget(LMCT_TARGET_DATE, LMCT_TIMEZONE);
    var initialMs = parseInitialTime(root.dataset.initial);
    var configuredProgress = parseFloat(root.dataset.progress);
    var targetMs = Number.isFinite(inlineTargetMs)
      ? inlineTargetMs
      : Number.isFinite(ruleTargetMs)
        ? ruleTargetMs
        : Date.now() + (initialMs !== null ? initialMs : fallbackDurationMs);
    var initialRemainingMs = Math.max(1000, targetMs - Date.now());
    var initialProgress = Number.isFinite(configuredProgress)
      ? clamp(configuredProgress, 0, 100)
      : 100;
    var hasAnimatedIn = false;
    var liveTransitionTimerId = null;
    var previousHours = "";
    var previousMinutes = "";
    var previousSeconds = "";

    function renderProgress(remainingMs, animateIn) {
      var safeRemainingMs = Math.max(0, remainingMs);
      var fillPercent = root.dataset.progress
        ? clamp(
            (safeRemainingMs / initialRemainingMs) * initialProgress,
            0,
            100
          )
        : clamp((safeRemainingMs / fallbackDurationMs) * 100, 0, 100);

      if (animateIn && !hasAnimatedIn) {
        progressEl.classList.remove("is-live");
        progressEl.style.width = "0%";
        window.requestAnimationFrame(function () {
          progressEl.style.width = fillPercent.toFixed(2) + "%";
        });

        if (liveTransitionTimerId) {
          window.clearTimeout(liveTransitionTimerId);
        }
        liveTransitionTimerId = window.setTimeout(function () {
          progressEl.classList.add("is-live");
        }, 1750);
        hasAnimatedIn = true;
      } else {
        progressEl.style.width = fillPercent.toFixed(2) + "%";
      }

      progressEl.classList.toggle("is-ending", fillPercent <= 18);
    }

    function tick() {
      var remainingMs = targetMs - Date.now();
      var remainingSeconds = Math.max(0, Math.floor(remainingMs / 1000));
      var hours = Math.floor(remainingSeconds / 3600);
      var minutes = Math.floor((remainingSeconds % 3600) / 60);
      var seconds = remainingSeconds % 60;
      var hoursString = pad(hours);
      var minutesString = pad(minutes);
      var secondsString = pad(seconds);

      if (hoursString !== previousHours) {
        hoursEl.textContent = hoursString;
        flip(hoursEl);
        previousHours = hoursString;
      }

      if (minutesString !== previousMinutes) {
        minutesEl.textContent = minutesString;
        flip(minutesEl);
        previousMinutes = minutesString;
      }

      if (secondsString !== previousSeconds) {
        secondsEl.textContent = secondsString;
        flip(secondsEl);
        previousSeconds = secondsString;
      }

      root.setAttribute(
        "aria-label",
        hoursString +
          " hours, " +
          minutesString +
          " minutes, and " +
          secondsString +
          " seconds remaining"
      );

      renderProgress(remainingMs, !hasAnimatedIn);

      if (hours === 0 && (minutes > 0 || seconds > 0)) {
        root.classList.add("lmctUrgent");
      } else {
        root.classList.remove("lmctUrgent");
      }

      if (remainingMs <= 0) {
        if (liveTransitionTimerId) {
          window.clearTimeout(liveTransitionTimerId);
        }
        window.clearInterval(timerId);
      }
    }

    tick();
    var timerId = window.setInterval(tick, 1000);
  })();
</script>
