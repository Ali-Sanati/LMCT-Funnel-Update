<style>
  /* ===== LMCT+ Cash Hero Section ===== */
  .cash-hero {
    font-family:
      "Inter",
      "Segoe UI",
      system-ui,
      -apple-system,
      sans-serif;
    position: relative;
    isolation: isolate;
    width: 100%;
    padding: 72px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    box-sizing: border-box;
    background:
      radial-gradient(
        circle at 50% 16%,
        rgba(164, 255, 158, 0.18),
        transparent 22%
      ),
      radial-gradient(
        circle at 18% 28%,
        rgba(70, 255, 158, 0.16),
        transparent 30%
      ),
      radial-gradient(
        circle at 82% 20%,
        rgba(255, 214, 92, 0.12),
        transparent 28%
      ),
      linear-gradient(
        180deg,
        #0f5f28 0%,
        #0b4a20 26%,
        #083217 64%,
        #041b0d 100%
      );
  }

  .cash-hero *,
  .cash-hero *::before,
  .cash-hero *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* Light burst overlay */
  .cash-hero::before {
    content: "";
    position: absolute;
    inset: -24% -16% auto;
    height: 88%;
    transform: none;
    background:
      radial-gradient(
        circle at 50% 24%,
        rgba(181, 255, 162, 0.28),
        transparent 20%
      ),
      radial-gradient(
        circle at 22% 42%,
        rgba(64, 222, 132, 0.18),
        transparent 28%
      ),
      radial-gradient(
        circle at 78% 40%,
        rgba(255, 212, 98, 0.14),
        transparent 30%
      );
    filter: blur(16px);
    opacity: 0.95;
    animation: cashHeroGlowShift 12s ease-in-out infinite alternate;
    pointer-events: none;
    z-index: 0;
  }

  .cash-hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.03),
        rgba(255, 255, 255, 0) 16%
      ),
      linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.02),
        rgba(255, 255, 255, 0) 24%,
        rgba(255, 255, 255, 0.02) 76%,
        rgba(255, 255, 255, 0) 100%
      ),
      radial-gradient(circle at 50% 110%, rgba(0, 0, 0, 0.45), transparent 54%);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 0;
  }

  .cash-light-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }

  .cash-light-beam,
  .cash-light-orb {
    position: absolute;
    pointer-events: none;
  }

  .cash-light-beam {
    top: -18%;
    width: 34vw;
    min-width: 180px;
    max-width: 420px;
    height: 138%;
    opacity: 0.46;
    filter: blur(4px);
    background: linear-gradient(
      180deg,
      rgba(214, 255, 160, 0) 0%,
      rgba(214, 255, 160, 0.12) 16%,
      rgba(118, 255, 160, 0.2) 42%,
      rgba(255, 218, 111, 0.08) 72%,
      rgba(255, 255, 255, 0) 100%
    );
    clip-path: polygon(46% 0, 62% 0, 100% 100%, 0 100%);
    transform-origin: top center;
    mix-blend-mode: screen;
    animation: cashBeamSweep 10s ease-in-out infinite;
  }

  .cash-light-beam-1 {
    left: 6%;
    --beam-rot: -18deg;
    animation-delay: -2.8s;
  }

  .cash-light-beam-2 {
    left: 35%;
    --beam-rot: -3deg;
    opacity: 0.32;
    animation-duration: 12s;
    animation-delay: -1.4s;
  }

  .cash-light-beam-3 {
    right: 4%;
    --beam-rot: 16deg;
    animation-delay: -5.6s;
  }

  .cash-light-orb {
    --orb-base-x: 0px;
    border-radius: 999px;
    mix-blend-mode: screen;
    filter: blur(8px);
    animation: cashOrbFloat 8.5s ease-in-out infinite;
  }

  .cash-light-orb-1 {
    top: 10%;
    left: 12%;
    width: 120px;
    height: 120px;
    background: radial-gradient(
      circle,
      rgba(82, 255, 128, 0.24),
      rgba(82, 255, 128, 0) 68%
    );
  }

  .cash-light-orb-2 {
    top: 6%;
    right: 14%;
    width: 180px;
    height: 180px;
    background: radial-gradient(
      circle,
      rgba(255, 215, 98, 0.18),
      rgba(255, 215, 98, 0) 72%
    );
    animation-delay: -3.2s;
    animation-duration: 10.5s;
  }

  .cash-light-orb-3 {
    top: 34%;
    left: 50%;
    width: 220px;
    height: 220px;
    --orb-base-x: -50%;
    background: radial-gradient(
      circle,
      rgba(159, 255, 184, 0.12),
      rgba(159, 255, 184, 0) 74%
    );
    animation-delay: -1.7s;
    animation-duration: 11.5s;
  }

  .cash-glitter-field {
    position: absolute;
    left: 50%;
    bottom: 18%;
    width: min(74vw, 760px);
    height: 120px;
    transform: translateX(-50%);
    background:
      radial-gradient(
        circle at 8% 44%,
        rgba(255, 255, 255, 0.3) 0 2px,
        transparent 3px
      ),
      radial-gradient(
        circle at 24% 68%,
        rgba(190, 255, 164, 0.28) 0 2px,
        transparent 3px
      ),
      radial-gradient(
        circle at 40% 30%,
        rgba(255, 223, 146, 0.28) 0 2px,
        transparent 3px
      ),
      radial-gradient(
        circle at 58% 54%,
        rgba(255, 255, 255, 0.22) 0 2px,
        transparent 3px
      ),
      radial-gradient(
        circle at 70% 28%,
        rgba(184, 255, 158, 0.24) 0 2px,
        transparent 3px
      ),
      radial-gradient(
        circle at 86% 62%,
        rgba(255, 221, 134, 0.22) 0 2px,
        transparent 3px
      );
    opacity: 0.72;
    filter: blur(0.2px);
    animation: cashGlitterPulse 4.2s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }

  .cash-hero-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    max-width: 700px;
    width: 100%;
  }

  /* --- Top Label --- */
  .cash-label {
    display: inline-block;
    background: linear-gradient(
      180deg,
      rgba(6, 16, 7, 0.88),
      rgba(2, 8, 3, 0.94)
    );
    border: 1px solid rgba(211, 255, 185, 0.16);
    color: #fff;
    font-size: clamp(28px, 5vw, 38px);
    font-weight: 500;
    font-style: italic;
    padding: 8px 28px;
    border-radius: 24px;
    letter-spacing: 0.5px;
    box-shadow:
      0 12px 28px rgba(0, 0, 0, 0.28),
      0 0 24px rgba(72, 255, 140, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    margin-bottom: 20px;
  }

  /* --- Main Headline --- */
  .cash-headline {
    font-size: clamp(48px, 5vw, 68px);
    font-weight: 800;
    color: #f8fff5;
    letter-spacing: 1px;
    line-height: 1.2;
    margin-bottom: 18px;
    text-shadow:
      0 2px 8px rgba(0, 0, 0, 0.34),
      0 0 18px rgba(131, 255, 129, 0.12);
  }

  /* --- Price Banner Stack --- */
  .cash-price-stack {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Stacked card layers behind price */
  .cash-price-wrap {
    position: relative;
    display: inline-block;
  }

  .cash-price-wrap::before,
  .cash-price-wrap::after {
    content: "";
    position: absolute;
    border-radius: 12px;
    background: rgba(6, 30, 10, 0.72);
    border: 1px solid rgba(190, 255, 157, 0.16);
  }

  .cash-price-wrap::before {
    top: 6px;
    left: -8px;
    right: -8px;
    bottom: -6px;
    transform: rotate(-1.2deg);
    z-index: 0;
    box-shadow:
      0 10px 24px rgba(0, 0, 0, 0.28),
      0 0 26px rgba(134, 255, 145, 0.1);
  }

  .cash-price-wrap::after {
    top: 12px;
    left: -14px;
    right: -14px;
    bottom: -12px;
    transform: rotate(1.5deg);
    z-index: -1;
    box-shadow:
      0 16px 36px rgba(0, 0, 0, 0.34),
      0 0 42px rgba(255, 217, 122, 0.08);
  }

  .cash-price-banner {
    position: relative;
    z-index: 1;
    display: inline-block;
    overflow: hidden;
    background:
      linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.08),
        rgba(255, 255, 255, 0) 26%
      ),
      linear-gradient(180deg, #16753a 0%, #0b4d24 54%, #082f17 100%);
    border: 2px solid rgba(191, 255, 160, 0.26);
    border-radius: 12px;
    padding: 16px 48px;
    box-shadow:
      0 20px 46px rgba(0, 0, 0, 0.34),
      0 0 30px rgba(53, 255, 106, 0.1),
      inset 0 1px 0 rgba(100, 255, 100, 0.12);
    transition:
      transform 0.3s ease,
      box-shadow 0.3s ease;
    cursor: default;
  }

  .cash-price-banner::before {
    content: "";
    position: absolute;
    inset: -10% auto -10% -24%;
    width: 54%;
    background: linear-gradient(
      100deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0.08) 42%,
      rgba(255, 255, 255, 0.28) 50%,
      rgba(255, 255, 255, 0.08) 58%,
      rgba(255, 255, 255, 0) 100%
    );
    transform: skewX(-16deg) translateX(-160%);
    animation: cashBannerSweep 4.8s ease-in-out infinite;
    pointer-events: none;
  }

  .cash-price-banner:hover {
    transform: scale(1.04);
    box-shadow:
      0 22px 50px rgba(0, 0, 0, 0.38),
      0 0 48px rgba(95, 255, 124, 0.14),
      0 0 22px rgba(255, 222, 135, 0.1),
      inset 0 1px 0 rgba(100, 255, 100, 0.15);
  }

  .cash-price {
    font-size: clamp(56px, 14vw, 120px);
    font-weight: 900;
    color: #8cff63;
    line-height: 1;
    letter-spacing: 2px;
    text-shadow:
      0 0 16px rgba(215, 255, 181, 0.3),
      0 0 34px rgba(61, 255, 92, 0.34),
      0 0 66px rgba(255, 220, 128, 0.12),
      0 4px 8px rgba(0, 0, 0, 0.5);
  }

  /* --- Bottom Banner --- */
  .cash-bottom-banner {
    display: inline-block;
    background: linear-gradient(
      180deg,
      rgba(7, 19, 9, 0.92),
      rgba(0, 0, 0, 0.94)
    );
    border: 1px solid rgba(190, 255, 157, 0.12);
    padding: 12px 40px;
    border-radius: 8px;
    margin-top: -4px;
    position: relative;
    z-index: 2;
    box-shadow:
      0 16px 32px rgba(0, 0, 0, 0.3),
      0 0 24px rgba(82, 255, 128, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .cash-bottom-text {
    font-size: clamp(20px, 4vw, 36px);
    font-weight: 900;
    color: #f8fff6;
    text-transform: uppercase;
    letter-spacing: 4px;
    line-height: 1;
    text-shadow:
      0 2px 6px rgba(0, 0, 0, 0.4),
      0 0 16px rgba(155, 255, 149, 0.12);
  }

  /* ===== Badges Section ===== */
  .badges-section {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(
        circle at 50% 0%,
        rgba(128, 255, 120, 0.14),
        transparent 30%
      ),
      radial-gradient(
        circle at 15% 16%,
        rgba(255, 218, 119, 0.08),
        transparent 24%
      ),
      linear-gradient(180deg, #0a4a1f 0%, #062912 52%, #03150a 100%);
    border-top: 1px solid rgba(195, 255, 176, 0.08);
    box-shadow: inset 0 12px 34px rgba(0, 0, 0, 0.28);
    padding: 48px 16px 2px;
    font-family:
      "Inter",
      "Segoe UI",
      system-ui,
      -apple-system,
      sans-serif;
  }

  .badges-section::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.03),
        rgba(255, 255, 255, 0) 18%
      ),
      radial-gradient(
        circle at 50% -8%,
        rgba(176, 255, 157, 0.12),
        transparent 32%
      );
    pointer-events: none;
  }

  .badges-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 48px;
    max-width: 900px;
    margin: 0 auto;
  }

  /* Cash Benefit Badge */
  .cash-benefit {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 16px;
    transition:
      transform 0.3s ease,
      filter 0.3s ease;
    cursor: default;
  }

  .cash-benefit:hover {
    transform: scale(1.05);
    filter: drop-shadow(0 0 18px rgba(132, 255, 115, 0.16));
  }

  @media (min-width: 640px) {
    .cash-benefit {
      font-size: 20px;
    }
  }

  /* Badge Icon */
  .badge-icon {
    width: 84px;
    height: 84px;
    border-radius: 999px;
    border: 1px solid rgba(185, 255, 160, 0.08);
    background:
      radial-gradient(
        circle at 30% 28%,
        rgba(255, 255, 255, 0.14),
        rgba(255, 255, 255, 0) 36%
      ),
      linear-gradient(180deg, rgba(8, 22, 10, 0.85), rgba(0, 0, 0, 0.78));
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      border-color 0.3s ease,
      transform 0.3s ease,
      box-shadow 0.3s ease,
      background 0.3s ease;
    flex-shrink: 0;
    box-shadow:
      0 14px 24px rgba(0, 0, 0, 0.24),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .badge-icon-img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }
  .cash-benefit:hover .badge-icon {
    border-color: #00ff27;
    box-shadow:
      0 16px 28px rgba(0, 0, 0, 0.28),
      0 0 20px rgba(98, 255, 104, 0.15),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  @media (min-width: 640px) {
    /* .badge-icon {
      width: 80px;
      height: 80px;
    } */
  }

  /* SVG Icons */
  .badge-icon img {
    width: 60px;
  }

  /* Badge Title */
  .badge-title {
    font-weight: bold;
    color: #00ff27;
    filter: drop-shadow(0 1px 2px rgba(0, 255, 68, 0.3));
    margin-top: 12px;
    font-size: 1em;
    letter-spacing: 0.04em;
  }

  /* Badge Subtitle */
  .badge-subtitle {
    color: rgba(255, 255, 255, 0.94);
    font-size: 0.9em;
    margin-top: 4px;
  }

  @media (min-width: 640px) {
    .badge-subtitle {
      font-size: 1em;
    }
  }

  /* Responsive */
  @media (max-width: 767px) {
    .cash-hero {
      padding: 48px 12px;
    }
    .cash-label {
      padding: 6px 20px;
      margin-bottom: 16px;
    }
    .cash-headline {
      margin-bottom: 14px;
    }
    .cash-price-banner {
      padding: 12px 28px;
      border-radius: 10px;
    }
    .cash-price-wrap::before {
      top: 4px;
      left: -5px;
      right: -5px;
      bottom: -4px;
      border-radius: 10px;
    }
    .cash-price-wrap::after {
      top: 8px;
      left: -9px;
      right: -9px;
      bottom: -8px;
      border-radius: 10px;
    }
    .cash-bottom-banner {
      padding: 10px 24px;
      border-radius: 6px;
    }
    .cash-bottom-text {
      letter-spacing: 3px;
    }
    .badges-container {
      gap: 32px;
    }
  }

  @media (min-width: 1200px) {
    .cash-hero {
      padding: 80px 24px;
    }
    .cash-price-banner {
      padding: 20px 64px;
    }
    .cash-bottom-banner {
      padding: 14px 52px;
    }
    .badges-section {
      padding: 64px 24px 64px;
    }
  }
  .cash-rain-wrap {
    position: relative;
    overflow: hidden;
  }

  .cash-rain-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .cash-hero-inner {
    position: relative;
    z-index: 2;
  }

  /* Shared particle base */
  .cash-particle {
    position: absolute;
    top: -120px;
    left: 0;
    pointer-events: none;
    will-change: transform, opacity;
  }

  /* Dollar bill */
  .cash-dollar {
    width: var(--size, 56px);
    height: calc(var(--size, 56px) * 0.58);
    opacity: var(--opacity, 0.7);
    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;
    transform-origin: center;
    animation: cash-fall var(--duration, 7s) linear infinite;
    animation-delay: var(--delay, 0s);

y="360" r="16"/%3E%3C/g%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3C/svg%3E%0A');
  }

  /* Coin */
  .cash-coin {
    width: var(--size, 26px);
    height: var(--size, 26px);
    border-radius: 50%;
    opacity: var(--opacity, 0.8);
    background: radial-gradient(
      circle at 35% 35%,
      #fff3a6 0%,
      #ffd700 38%,
      #d4a514 72%,
      #9b7400 100%
    );
    box-shadow:
      inset 0 2px 3px rgba(255, 255, 255, 0.45),
      inset 0 -2px 3px rgba(0, 0, 0, 0.18),
      0 4px 10px rgba(0, 0, 0, 0.18);
    animation: cash-fall-spin var(--duration, 5s) ease-in infinite;
    animation-delay: var(--delay, 0s);
    z-index: 2;
  }

  .cash-coin::before {
    content: "$";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: calc(var(--size, 26px) * 0.55);
    font-weight: 900;
    color: rgba(80, 55, 0, 0.9);
  }

  /* Confetti */
  .cash-confetti {
    width: var(--w, 10px);
    height: var(--h, 4px);
    opacity: var(--opacity, 0.9);
    background: var(--color, #ffffff);
    transform: rotate(var(--rot, 0deg));
    animation: confetti-fall var(--duration, 4.8s) ease-out infinite;
    animation-delay: var(--delay, 0s);
    z-index: 0;
  }

  /* Keyframes */
  @keyframes cash-fall {
    0% {
      transform: translate3d(0, -120px, 0) rotate(0deg);
    }
    100% {
      transform: translate3d(var(--drift, 30px), 110vh, 0)
        rotate(var(--spin, 360deg));
    }
  }

  @keyframes cash-fall-spin {
    0% {
      transform: translate3d(0, -120px, 0) rotateY(0deg) rotate(0deg);
    }
    100% {
      transform: translate3d(var(--drift, 12px), 110vh, 0) rotateY(720deg)
        rotate(var(--spin, 300deg));
    }
  }

  @keyframes confetti-fall {
    0% {
      transform: translate3d(0, -100px, 0) rotate(var(--rot, 0deg));
    }
    100% {
      transform: translate3d(var(--drift, 45px), 110vh, 0)
        rotate(calc(var(--rot, 0deg) + 360deg));
    }
  }

  /* Reduce density on mobile */
  @media (max-width: 767px) {
    .cash-light-beam {
      opacity: 0.28;
      width: 46vw;
    }

    .cash-light-orb-1 {
      width: 88px;
      height: 88px;
    }

    .cash-light-orb-2 {
      width: 120px;
      height: 120px;
    }

    .cash-light-orb-3 {
      width: 150px;
      height: 150px;
    }

    .cash-dollar {
      opacity: 0.45;
    }
    .cash-confetti {
      opacity: 0.45;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cash-hero::before,
    .cash-light-beam,
    .cash-light-orb,
    .cash-glitter-field,
    .cash-price-banner::before,
    .cash-dollar,
    .cash-coin,
    .cash-confetti {
      animation: none !important;
    }
  }

  @keyframes cashHeroGlowShift {
    0% {
      transform: translate3d(-2%, 0, 0) scale(1);
      opacity: 0.84;
    }
    50% {
      transform: translate3d(1.6%, 3%, 0) scale(1.04);
      opacity: 1;
    }
    100% {
      transform: translate3d(3%, -2%, 0) scale(1.02);
      opacity: 0.9;
    }
  }

  @keyframes cashBeamSweep {
    0%,
    100% {
      opacity: 0.22;
      transform: translateY(-2%) rotate(var(--beam-rot, 0deg)) scaleY(1);
    }
    50% {
      opacity: 0.52;
      transform: translateY(2%) rotate(calc(var(--beam-rot, 0deg) + 2deg))
        scaleY(1.05);
    }
  }

  @keyframes cashOrbFloat {
    0%,
    100% {
      transform: translate3d(var(--orb-base-x), 0, 0) scale(1);
      opacity: 0.88;
    }
    50% {
      transform: translate3d(var(--orb-base-x), -12px, 0) scale(1.06);
      opacity: 1;
    }
  }

  @keyframes cashGlitterPulse {
    0%,
    100% {
      opacity: 0.52;
      transform: translateX(-50%) scale(1);
    }
    50% {
      opacity: 0.88;
      transform: translateX(-50%) scale(1.04);
    }
  }

  @keyframes cashBannerSweep {
    0%,
    18% {
      transform: skewX(-16deg) translateX(-180%);
      opacity: 0;
    }
    28% {
      opacity: 1;
    }
    52% {
      transform: skewX(-16deg) translateX(280%);
      opacity: 0;
    }
    100% {
      transform: skewX(-16deg) translateX(280%);
      opacity: 0;
    }
  }
</style>

<script>
  (function () {
    var layer = document.getElementById("cashRainLayer");
    if (!layer) return;

    var dollarNum = 26; // original was 50, reduced for smoother CF performance
    var coinNum = 14; // original was 30
    var confettiNum = 90; // original was 400

    var confettiColors = [
      "#00ff27",
      "#16a34a",
      "#22c55e",
      "#86efac",
      "#facc15",
      "#ffffff",
    ];

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function makeParticle(type) {
      var el = document.createElement("div");
      el.className = "cash-particle " + type;

      el.style.left = rand(0, 100) + "%";
      el.style.setProperty("--delay", rand(0, 6).toFixed(2) + "s");
      el.style.setProperty("--drift", rand(-60, 60).toFixed(0) + "px");
      el.style.setProperty("--spin", rand(180, 720).toFixed(0) + "deg");
      el.style.setProperty("--opacity", rand(0.35, 0.9).toFixed(2));

      if (type === "cash-dollar") {
        el.style.setProperty("--size", rand(42, 74).toFixed(0) + "px");
        el.style.setProperty("--duration", rand(5.5, 9).toFixed(2) + "s");
      }

      if (type === "cash-coin") {
        el.style.setProperty("--size", rand(18, 34).toFixed(0) + "px");
        el.style.setProperty("--duration", rand(3.5, 6).toFixed(2) + "s");
      }

      if (type === "cash-confetti") {
        el.style.setProperty("--w", rand(6, 14).toFixed(0) + "px");
        el.style.setProperty("--h", rand(3, 6).toFixed(0) + "px");
        el.style.setProperty("--rot", rand(0, 360).toFixed(0) + "deg");
        el.style.setProperty("--duration", rand(3.8, 6.2).toFixed(2) + "s");
        el.style.setProperty(
          "--color",
          confettiColors[Math.floor(Math.random() * confettiColors.length)],
        );
      }

      return el;
    }

    for (var i = 0; i < dollarNum; i++) {
      layer.appendChild(makeParticle("cash-dollar"));
    }

    for (var j = 0; j < coinNum; j++) {
      layer.appendChild(makeParticle("cash-coin"));
    }

    // for (var k = 0; k < confettiNum; k++) {
    //   layer.appendChild(makeParticle("cash-confetti"));
    // }
  })();
</script>
