<!-- CD BENTO Silverado -->
<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap");
  .cdBentoLmctSection {
    font-family: "Inter", system-ui, sans-serif;
    padding: 0;
    box-sizing: border-box;
  }
  .cdBentoLmctSection *,
  .cdBentoLmctSection *::before,
  .cdBentoLmctSection *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  .cdBentoLmctGrid {
    max-width: 1170px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .cdBentoLmctCard {
    --cdBentoLmctY: 24px;
    --cdBentoLmctScale: 1;
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 30vh;
    box-shadow:
      0 4px 20px rgba(0, 0, 0, 0.12),
      0 1px 4px rgba(0, 0, 0, 0.08);
    transform: translate3d(0, var(--cdBentoLmctY), 0)
      scale(var(--cdBentoLmctScale));
    opacity: 0;
    transition:
      transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
      opacity 0.45s ease,
      box-shadow 0.25s ease;
    will-change: transform, opacity;
    backface-visibility: hidden;
  }
  .cdBentoLmctCard.cdBentoLmctRevealed {
    --cdBentoLmctY: 0px;
    opacity: 1;
  }
  .cdBentoLmctCard::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(0, 0, 0, 0.78) 0%,
      rgba(0, 0, 0, 0.3) 40%,
      transparent 70%
    );
    border-radius: 10px;
    pointer-events: none;
    z-index: 1;
  }
  .cdBentoLmctContent {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 18px;
    z-index: 2;
  }
  .cdBentoLmctTitle {
    font-size: clamp(16px, 2.5vw, 22px);
    font-weight: 800;
    color: #fff;
    line-height: 1.25;
    margin-bottom: 4px;
  }
  .cdBentoLmctSub {
    font-size: clamp(12px, 1.8vw, 15px);
    font-weight: 500;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.4;
  }
  /* Replace these with hosted image URLs */
  .cdBentoLmctC1 {
    background-image: url("https://images.clickfunnels.com/de/3c522475114c1a933b17b426e79487/Tire.jpg");
  }
  .cdBentoLmctC2 {
    background-image: url("https://images.clickfunnels.com/27/76e2d5ef1f47c6b5d84415aa6452cb/Petrol-Engin.jpg");
  }
  .cdBentoLmctC3 {
    background-image: url("https://images.clickfunnels.com/db/c913e4e28947c299a4625fd013765b/TwinDiff.jpg");
  }
  .cdBentoLmctC4 {
    background-image: url("https://images.clickfunnels.com/30/77256958a5443cad95ae99ba5aff54/TOW.jpg");
  }
  .cdBentoLmctC5 {
    background-image: url("https://images.clickfunnels.com/60/b42095498d48d2b009c1539912ab60/FOX.jpg");
  }
  .cdBentoLmctC6 {
    background-image: url("https://images.clickfunnels.com/23/d2b4bde4a842ee80fedb6dca0cd93c/Shutter.jpg");
  }
  @media (min-width: 900px) {
    .cdBentoLmctGrid {
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(3, clamp(150px, 30vw, 220px));
      gap: 18px;
    }
    .cdBentoLmctCard {
      min-height: 0;
    }
    .cdBentoLmctCard:hover {
      --cdBentoLmctScale: 1.02;
      box-shadow:
        0 12px 36px rgba(0, 0, 0, 0.2),
        0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .cdBentoLmctC1 {
      grid-column: 1/4;
      grid-row: 1/3;
    }
    .cdBentoLmctC2 {
      grid-column: 4/8;
      grid-row: 1/2;
    }
    .cdBentoLmctC3 {
      grid-column: 4/6;
      grid-row: 2/3;
    }
    .cdBentoLmctC4 {
      grid-column: 6/8;
      grid-row: 2/3;
    }
    .cdBentoLmctC5 {
      grid-column: 1/4;
      grid-row: 3/4;
    }
    .cdBentoLmctC6 {
      grid-column: 4/8;
      grid-row: 3/4;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cdBentoLmctCard {
      transition: box-shadow 0.3s ease;
      transform: none;
      opacity: 1;
    }
  }
</style>
<section
  class="cdBentoLmctSection"
  id="cdBentoLmctRoot"
  aria-label="HSV GTS Sedan"
>
  <div class="cdBentoLmctGrid">
    <div class="cdBentoLmctCard cdBentoLmctC1">
      <div class="cdBentoLmctContent">
        <h3 class="cdBentoLmctTitle">Black Rhino Wheels</h3>
        <p class="cdBentoLmctSub">37" Maxxis Razr Tyres</p>
      </div>
    </div>
    <div class="cdBentoLmctCard cdBentoLmctC2">
      <div class="cdBentoLmctContent">
        <h3 class="cdBentoLmctTitle">6.2L V8 Petrol Engine</h3>
        <p class="cdBentoLmctSub">313kW Power & 624Nm Torque</p>
      </div>
    </div>
    <div class="cdBentoLmctCard cdBentoLmctC3">
      <div class="cdBentoLmctContent">
        <h3 class="cdBentoLmctTitle">Twin Diff Locked</h3>
        <p class="cdBentoLmctSub">For those hard-to-get places</p>
      </div>
    </div>
    <div class="cdBentoLmctCard cdBentoLmctC4">
      <div class="cdBentoLmctContent">
        <h3 class="cdBentoLmctTitle">4.2T Tow Capacity</h3>
        <p class="cdBentoLmctSub">Tow anything you want</p>
      </div>
    </div>
    <div class="cdBentoLmctCard cdBentoLmctC5">
      <div class="cdBentoLmctContent">
        <h3 class="cdBentoLmctTitle">6-Inch BDS Suspension w/</h3>
        <p class="cdBentoLmctSub">Fox 2.5 Elite Shocks</p>
      </div>
    </div>
    <div class="cdBentoLmctCard cdBentoLmctC6">
      <div class="cdBentoLmctContent">
        <h3 class="cdBentoLmctTitle">Vikor Roller Shutter</h3>
        <p class="cdBentoLmctSub">Vikor Electric Steps</p>
      </div>
    </div>
  </div>
</section>
<script>
  window.addEventListener("load", function () {
    var cdBentoLmctSection = document.getElementById("cdBentoLmctRoot");
    if (!cdBentoLmctSection) return;
    var cdBentoLmctCards =
      cdBentoLmctSection.querySelectorAll(".cdBentoLmctCard");
    if (!cdBentoLmctCards.length) return;
    var cdBentoLmctReduced =
      window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (cdBentoLmctReduced) {
      for (var r = 0; r < cdBentoLmctCards.length; r++) {
        cdBentoLmctCards[r].classList.add("cdBentoLmctRevealed");
      }
      return;
    }
    for (var i = 0; i < cdBentoLmctCards.length; i++) {
      cdBentoLmctCards[i].style.transitionDelay = Math.min(i * 45, 180) + "ms";
    }
    if (!("IntersectionObserver" in window)) {
      requestAnimationFrame(function () {
        for (var j = 0; j < cdBentoLmctCards.length; j++) {
          cdBentoLmctCards[j].classList.add("cdBentoLmctRevealed");
        }
      });
      return;
    }
    var cdBentoLmctObs = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.classList.add("cdBentoLmctRevealed");
          cdBentoLmctObs.unobserve(e.target);
        });
      },
      { threshold: 0.18, rootMargin: "0px 0px -8% 0px" },
    );
    for (var k = 0; k < cdBentoLmctCards.length; k++) {
      cdBentoLmctObs.observe(cdBentoLmctCards[k]);
    }
  });
</script>
