<script>
  (function () {
    var sections = document.querySelectorAll(".lmctReadyUpgrade");
    if (!sections.length) return;

    var confettiColors = [
      "#d7f5ff",
      "#bfffd4",
      "#fff4a8",
      "#ffffff",
      "#86efac",
      "#facc15",
    ];

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function makeParticle(type) {
      var el = document.createElement("span");
      el.className = "lmctReadyCashParticle " + type;

      el.style.left = rand(0, 100) + "%";
      el.style.setProperty("--delay", rand(0, 6).toFixed(2) + "s");
      el.style.setProperty("--drift", rand(-58, 58).toFixed(0) + "px");
      el.style.setProperty("--spin", rand(180, 720).toFixed(0) + "deg");
      el.style.setProperty("--opacity", rand(0.28, 0.68).toFixed(2));

      if (type === "lmctReadyCashDollar") {
        el.style.setProperty("--size", rand(38, 66).toFixed(0) + "px");
        el.style.setProperty("--duration", rand(5.8, 9).toFixed(2) + "s");
      }

      if (type === "lmctReadyCashCoin") {
        el.style.setProperty("--size", rand(17, 30).toFixed(0) + "px");
        el.style.setProperty("--duration", rand(3.8, 6.2).toFixed(2) + "s");
      }

      if (type === "lmctReadyCashConfetti") {
        el.style.setProperty("--w", rand(6, 13).toFixed(0) + "px");
        el.style.setProperty("--h", rand(3, 6).toFixed(0) + "px");
        el.style.setProperty("--rot", rand(0, 360).toFixed(0) + "deg");
        el.style.setProperty("--duration", rand(3.9, 6.4).toFixed(2) + "s");
        el.style.setProperty(
          "--color",
          confettiColors[Math.floor(Math.random() * confettiColors.length)],
        );
      }

      return el;
    }

    function populate(section) {
      var layer = section.querySelector(".lmctReadyCashRainLayer");
      if (!layer || layer.getAttribute("data-lmct-ready-cash") === "true") {
        return;
      }

      layer.setAttribute("data-lmct-ready-cash", "true");

      for (var i = 0; i < 18; i++) {
        layer.appendChild(makeParticle("lmctReadyCashDollar"));
      }

      for (var j = 0; j < 9; j++) {
        layer.appendChild(makeParticle("lmctReadyCashCoin"));
      }

      for (var k = 0; k < 42; k++) {
        layer.appendChild(makeParticle("lmctReadyCashConfetti"));
      }
    }

    for (var s = 0; s < sections.length; s++) {
      populate(sections[s]);
    }
  })();
</script>
