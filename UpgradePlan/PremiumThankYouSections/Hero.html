<style>
  .lmctThankHero,
  .lmctThankHero *,
  .lmctThankHero *::before,
  .lmctThankHero *::after {
    box-sizing: border-box;
  }

  .lmctThankHero {
    --lmctThankHeroBlue: #087ff5;
    --lmctThankHeroBlueDark: #075fd4;
    --lmctThankHeroBlueDeep: #064bb5;
    --lmctThankHeroNavy: #071a36;
    --lmctThankHeroGreen: #24a447;
    --lmctThankHeroGreenSoft: #effbf2;
    --lmctThankHeroWhite: #ffffff;
    --lmctThankHeroLightBlue: #eaf4ff;
    --lmctThankHeroBorder: #dbe8f5;
    --lmctThankHeroMuted: #58697d;
    --lmctThankHeroGold: #e9aa25;
    --lmctThankHeroRed: #f04b3f;
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 34px 24px 70px;
    overflow: hidden;
    border-radius: 28px;
    background:
      radial-gradient(
        circle at 50% 6%,
        rgba(8, 127, 245, 0.11) 0,
        rgba(8, 127, 245, 0) 36%
      ),
      linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    color: var(--lmctThankHeroNavy);
    font-family: Inter, Arial, sans-serif;
    isolation: isolate;
  }

  .lmctThankHero .lmctThankHeroInner {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    text-align: center;
  }

  .lmctThankHero .lmctThankHeroLogo {
    display: block;
    width: clamp(220px, 23vw, 270px);
    height: auto;
    margin: 0 auto 26px;
    opacity: 0;
    transform: translateY(10px);
    animation: lmctThankHeroIntroIn 0.58s ease-out 0.05s forwards;
  }

  .lmctThankHero .lmctThankHeroMain {
    display: block;
  }

  .lmctThankHero .lmctThankHeroContent {
    min-width: 0;
    max-width: 860px;
    margin: 0 auto;
    text-align: center;
  }

  .lmctThankHero .lmctThankHeroSuccessBadge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 16px;
    padding: 11px 17px;
    border: 1px solid rgba(36, 164, 71, 0.3);
    border-radius: 999px;
    background: var(--lmctThankHeroGreenSoft);
    color: var(--lmctThankHeroGreen);
    font-size: 16px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    box-shadow: 0 10px 22px rgba(36, 164, 71, 0.08);
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    animation: lmctThankHeroIntroIn 0.58s ease-out 0.16s forwards;
  }

  .lmctThankHero .lmctThankHeroBadgeIcon {
    display: inline-flex;
    width: 24px;
    height: 24px;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    background: var(--lmctThankHeroWhite);
    flex: 0 0 24px;
  }

  .lmctThankHero .lmctThankHeroIcon {
    display: block;
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2.2;
  }

  .lmctThankHero .lmctThankHeroTitle {
    margin: 0;
    font-family: Impact, "Arial Narrow", Arial, sans-serif;
    font-weight: 900;
    line-height: 0.88;
    letter-spacing: 0;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(12px) scale(0.985);
    animation: lmctThankHeroIntroIn 0.62s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.26s
      forwards;
  }

  .lmctThankHero .lmctThankHeroTitleTop {
    display: block;
    color: var(--lmctThankHeroNavy);
    font-size: clamp(70px, 8vw, 90px);
  }

  .lmctThankHero .lmctThankHeroTitlePremium {
    display: block;
    margin-top: 7px;
    background: linear-gradient(
      180deg,
      var(--lmctThankHeroBlue) 0%,
      var(--lmctThankHeroBlueDark) 52%,
      var(--lmctThankHeroBlueDeep) 100%
    );
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    font-size: clamp(90px, 10.3vw, 118px);
  }

  .lmctThankHero .lmctThankHeroMemberBadge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-top: 20px;
    padding: 11px 18px;
    border-radius: 999px;
    background: linear-gradient(
      135deg,
      var(--lmctThankHeroBlueDark) 0%,
      var(--lmctThankHeroBlue) 55%,
      #0666df 100%
    );
    color: var(--lmctThankHeroWhite);
    font-size: 16px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    box-shadow: 0 14px 28px rgba(8, 127, 245, 0.22);
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    animation: lmctThankHeroIntroIn 0.58s ease-out 0.4s forwards;
  }

  .lmctThankHero .lmctThankHeroMemberIcon {
    display: block;
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .lmctThankHero .lmctThankHeroCards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    margin-top: 38px;
  }

  .lmctThankHero .lmctThankHeroCard {
    position: relative;
    display: flex;
    min-width: 0;
    min-height: 246px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px 28px;
    border: 1px solid rgba(8, 127, 245, 0.2);
    border-radius: 18px;
    background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
    box-shadow:
      0 18px 44px rgba(8, 127, 245, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.92);
    opacity: 0;
    text-align: center;
    transform: translateY(18px);
    animation: lmctThankHeroCardIn 0.62s cubic-bezier(0.2, 0.9, 0.3, 1.18)
      forwards;
    transition:
      transform 180ms ease,
      box-shadow 180ms ease,
      border-color 180ms ease;
  }

  .lmctThankHero .lmctThankHeroCard:nth-child(1) {
    animation-delay: 0.52s;
  }

  .lmctThankHero .lmctThankHeroCard:nth-child(2) {
    animation-delay: 0.64s;
  }

  .lmctThankHero .lmctThankHeroCard:nth-child(3) {
    animation-delay: 0.76s;
  }

  .lmctThankHero .lmctThankHeroCardIconBox {
    position: relative;
    display: inline-flex;
    width: 78px;
    height: 78px;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
    border-radius: 999px;
    background: var(--lmctThankHeroLightBlue);
    color: var(--lmctThankHeroBlueDark);
    flex: 0 0 78px;
  }

  .lmctThankHero .lmctThankHeroCardIconBox::after {
    content: "";
    position: absolute;
    inset: -3px;
    border: 2px solid rgba(8, 127, 245, 0.14);
    border-radius: 999px;
    animation: lmctThankHeroIconRing 2.8s ease-out infinite;
  }

  .lmctThankHero
    .lmctThankHeroCard:nth-child(2)
    .lmctThankHeroCardIconBox::after {
    animation-delay: 0.55s;
  }

  .lmctThankHero
    .lmctThankHeroCard:nth-child(3)
    .lmctThankHeroCardIconBox::after {
    animation-delay: 1.1s;
  }

  .lmctThankHero .lmctThankHeroCardIcon {
    display: block;
    width: 36px;
    height: 36px;
    fill: none;
    /* stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.9; */
  }

  .lmctThankHero .lmctThankHeroCardValue {
    display: block;
    color: var(--lmctThankHeroBlueDark);
    font-size: 52px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0;
  }

  .lmctThankHero .lmctThankHeroCardLabel {
    display: block;
    margin-top: 9px;
    color: var(--lmctThankHeroNavy);
    font-size: 21px;
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .lmctThankHero .lmctThankHeroCardConfirm .lmctThankHeroCardLabel {
    margin-top: 0;
    margin-bottom: 5px;
    font-size: 22px;
  }

  .lmctThankHero .lmctThankHeroCardConfirm .lmctThankHeroCardValue {
    font-size: 50px;
  }

  .lmctThankHero .lmctThankHeroNote {
    margin: 22px auto 0;
    color: var(--lmctThankHeroMuted);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.4;
    text-align: center;
  }

  .lmctThankHero .lmctThankHeroCta {
    position: relative;
    display: flex;
    width: 100%;
    min-height: 72px;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 24px auto 0;
    padding: 19px 26px;
    overflow: hidden;
    border-radius: 13px;
    background: linear-gradient(
      135deg,
      var(--lmctThankHeroBlueDark) 0%,
      var(--lmctThankHeroBlue) 52%,
      #0666df 100%
    );
    color: var(--lmctThankHeroWhite);
    font-size: 22px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: 0;
    text-align: center;
    text-decoration: none;
    text-transform: uppercase;
    box-shadow: 0 18px 34px rgba(7, 95, 212, 0.25);
    transition:
      transform 180ms ease,
      box-shadow 180ms ease,
      filter 180ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .lmctThankHero .lmctThankHeroCtaText {
    min-width: 0;
  }

  .lmctThankHero .lmctThankHeroCtaIcon {
    display: block;
    width: 24px;
    height: 24px;
    flex: 0 0 24px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2.5;
  }

  .lmctThankHero .lmctThankHeroCta:focus-visible {
    outline: 3px solid rgba(8, 127, 245, 0.32);
    outline-offset: 5px;
  }

  @keyframes lmctThankHeroIntroIn {
    0% {
      opacity: 0;
      transform: translateY(12px) scale(0.985);
    }

    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @keyframes lmctThankHeroCardIn {
    0% {
      opacity: 0;
      transform: translateY(18px);
    }

    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes lmctThankHeroIconRing {
    0% {
      opacity: 0.55;
      transform: scale(1);
    }

    100% {
      opacity: 0;
      transform: scale(1.42);
    }
  }

  @media (hover: hover) and (pointer: fine) {
    .lmctThankHero .lmctThankHeroCard:hover {
      transform: translateY(-2px);
      border-color: rgba(8, 127, 245, 0.38);
      box-shadow:
        0 22px 50px rgba(8, 127, 245, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.96);
    }

    .lmctThankHero .lmctThankHeroCta:hover {
      color: var(--lmctThankHeroWhite);
      text-decoration: none;
      transform: translateY(-2px);
      filter: brightness(1.03);
      box-shadow: 0 22px 40px rgba(7, 95, 212, 0.3);
    }
  }

  .lmctThankHero .lmctThankHeroCta:active {
    transform: translateY(1px);
    box-shadow: 0 12px 26px rgba(7, 95, 212, 0.24);
  }

  @media (max-width: 900px) {
    .lmctThankHero {
      padding: 32px 20px 58px;
    }

    .lmctThankHero .lmctThankHeroCards {
      gap: 14px;
    }

    .lmctThankHero .lmctThankHeroCard {
      min-height: 218px;
      padding: 24px 12px 22px;
    }

    .lmctThankHero .lmctThankHeroCardIconBox {
      width: 66px;
      height: 66px;
      flex-basis: 66px;
    }

    .lmctThankHero .lmctThankHeroCardValue {
      font-size: 42px;
    }

    .lmctThankHero .lmctThankHeroCardLabel {
      font-size: 18px;
    }

    .lmctThankHero .lmctThankHeroCardConfirm .lmctThankHeroCardLabel {
      font-size: 19px;
    }
  }

  @media (max-width: 600px) {
    .lmctThankHero {
      max-width: none;
      padding: 30px 16px 46px;
      border-radius: 22px;
    }

    .lmctThankHero .lmctThankHeroLogo {
      width: clamp(170px, 52vw, 210px);
      margin-bottom: 22px;
    }

    .lmctThankHero .lmctThankHeroSuccessBadge {
      padding: 10px 13px;
      font-size: 13px;
      letter-spacing: 0.4px;
    }

    .lmctThankHero .lmctThankHeroTitleTop {
      font-size: clamp(42px, 13vw, 52px);
    }

    .lmctThankHero .lmctThankHeroTitlePremium {
      font-size: clamp(56px, 17vw, 70px);
    }

    .lmctThankHero .lmctThankHeroMemberBadge {
      margin-top: 16px;
      font-size: 14px;
    }

    .lmctThankHero .lmctThankHeroCards {
      grid-template-columns: minmax(0, 1fr);
      margin-top: 28px;
    }

    .lmctThankHero .lmctThankHeroCard {
      min-height: 168px;
      padding: 20px 16px;
    }

    .lmctThankHero .lmctThankHeroCardIconBox {
      width: 58px;
      height: 58px;
      margin-bottom: 12px;
      flex-basis: 58px;
    }

    .lmctThankHero .lmctThankHeroCardIcon {
      width: 29px;
      height: 29px;
    }

    .lmctThankHero .lmctThankHeroCardValue {
      font-size: 38px;
    }

    .lmctThankHero .lmctThankHeroCardLabel {
      font-size: 17px;
    }

    .lmctThankHero .lmctThankHeroCardConfirm .lmctThankHeroCardLabel {
      font-size: 17px;
    }

    .lmctThankHero .lmctThankHeroNote {
      margin-top: 18px;
      font-size: 15px;
    }

    .lmctThankHero .lmctThankHeroCta {
      min-height: 60px;
      gap: 10px;
      padding: 16px 16px;
      border-radius: 12px;
      font-size: 18px;
    }

    .lmctThankHero .lmctThankHeroCtaIcon {
      width: 21px;
      height: 21px;
      flex-basis: 21px;
    }
  }

  @media (max-width: 360px) {
    .lmctThankHero {
      padding: 28px 16px 42px;
    }

    .lmctThankHero .lmctThankHeroSuccessBadge {
      gap: 7px;
      padding: 9px 11px;
      font-size: 12px;
    }

    .lmctThankHero .lmctThankHeroTitleTop {
      font-size: 41px;
    }

    .lmctThankHero .lmctThankHeroTitlePremium {
      font-size: 54px;
    }

    .lmctThankHero .lmctThankHeroCta {
      padding: 15px 12px;
      font-size: 16px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lmctThankHero .lmctThankHeroLogo,
    .lmctThankHero .lmctThankHeroSuccessBadge,
    .lmctThankHero .lmctThankHeroTitle,
    .lmctThankHero .lmctThankHeroMemberBadge,
    .lmctThankHero .lmctThankHeroCard,
    .lmctThankHero .lmctThankHeroCardIconBox::after {
      animation: none;
      opacity: 1;
      transform: none;
    }

    .lmctThankHero .lmctThankHeroCard,
    .lmctThankHero .lmctThankHeroCta {
      transition: none;
    }
  }
</style>
