<style>
  .lmctAccessBenefits,
  .lmctAccessBenefits *,
  .lmctAccessBenefits *::before,
  .lmctAccessBenefits *::after {
    box-sizing: border-box;
  }

  .lmctAccessBenefits {
    --lmctAccessBlue: #087ff5;
    --lmctAccessBlueDark: #075fd4;
    --lmctAccessBlueDeep: #064bb5;
    --lmctAccessNavy: #071a36;
    --lmctAccessText: #263a52;
    --lmctAccessMuted: #5b6c80;
    --lmctAccessBorder: #d6e7f8;
    --lmctAccessLightBlue: #f4f9ff;
    --lmctAccessWhite: #ffffff;
    --lmctAccessStore: #080808;
    --lmctAccessStoreBorder: #252b33;
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 64px 20px 0px;
    color: var(--lmctAccessNavy);
    font-family: Inter, Arial, Helvetica, sans-serif;
    isolation: isolate;
  }

  .lmctAccessBenefits .lmctAccessInner {
    width: 100%;
    max-width: 960px;
    margin: 0 auto;
  }

  .lmctAccessBenefits .lmctAccessCard {
    position: relative;
    overflow: hidden;
    width: 100%;
    padding: 50px 48px 48px;
    /* border: 1px solid var(--lmctAccessBorder); */
    /* border-radius: 24px; */
    /* background: radial-gradient(circle at 50% 0%, rgba(8, 127, 245, 0.13), transparent 34%), linear-gradient(180deg, #ffffff 0%, #f7fbff 100%); */
    /* box-shadow: 0 20px 48px rgba(5, 71, 150, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.92); */
    text-align: center;
  }

  .lmctAccessBenefits .lmctAccessCard::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    width: min(240px, 46%);
    height: 4px;
    border-radius: 0 0 999px 999px;
    background: linear-gradient(
      90deg,
      rgba(8, 127, 245, 0) 0%,
      rgba(8, 127, 245, 0.78) 50%,
      rgba(8, 127, 245, 0) 100%
    );
    transform: translateX(-50%);
  }

  /* .lmctAccessBenefits .lmctAccessCard::after {
    content: "";
    position: absolute;
    top: 32px;
    right: 34px;
    width: 72px;
    height: 72px;
    border: 1px solid rgba(8, 127, 245, 0.14);
    border-radius: 999px;
    background:
      linear-gradient(var(--lmctAccessWhite), var(--lmctAccessWhite))
        padding-box,
      radial-gradient(circle, rgba(8, 127, 245, 0.2), rgba(8, 127, 245, 0))
        border-box;
    opacity: 0.7;
    pointer-events: none;
  } */

  .lmctAccessBenefits .lmctAccessHeader,
  .lmctAccessBenefits .lmctAccessDashboardCta,
  .lmctAccessBenefits .lmctAccessNote,
  .lmctAccessBenefits .lmctAccessStores {
    position: relative;
    z-index: 1;
  }

  .lmctAccessBenefits .lmctAccessTitle {
    max-width: 840px;
    margin: 0 auto;
    color: var(--lmctAccessNavy);
    font-size: clamp(34px, 4.6vw, 44px);
    font-weight: 900;
    line-height: 1.04;
    letter-spacing: 0;
    text-align: center;
    text-transform: uppercase;
  }

  .lmctAccessBenefits .lmctAccessTitleLevel {
    color: var(--lmctAccessBlueDark);
  }

  .lmctAccessBenefits .lmctAccessDescription {
    max-width: 660px;
    margin: 15px auto 0;
    color: var(--lmctAccessMuted);
    font-size: 18px;
    font-weight: 500;
    line-height: 1.5;
    text-align: center;
  }

  .lmctAccessBenefits .lmctAccessDashboardCta {
    display: inline-flex;
    width: min(100%, 640px);
    min-height: 70px;
    align-items: center;
    justify-content: center;
    gap: 13px;
    margin: 32px auto 0;
    padding: 18px 24px;
    border-radius: 13px;
    background: linear-gradient(
      135deg,
      var(--lmctAccessBlueDark) 0%,
      var(--lmctAccessBlue) 52%,
      #0666df 100%
    );
    color: var(--lmctAccessWhite);
    font-size: 21px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: 0;
    text-align: center;
    text-decoration: none;
    text-transform: uppercase;
    box-shadow: 0 13px 28px rgba(7, 95, 212, 0.24);
    transition:
      transform 180ms ease,
      box-shadow 180ms ease,
      filter 180ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .lmctAccessBenefits .lmctAccessDashboardText {
    min-width: 0;
  }

  .lmctAccessBenefits .lmctAccessDashboardIcon {
    display: block;
    width: 24px;
    height: 24px;
    flex: 0 0 24px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2.4;
  }

  .lmctAccessBenefits .lmctAccessDashboardCta:focus-visible,
  .lmctAccessBenefits .lmctAccessStoreButton:focus-visible {
    outline: 3px solid rgba(8, 127, 245, 0.36);
    outline-offset: 5px;
  }

  .lmctAccessBenefits .lmctAccessDashboardCta:active,
  .lmctAccessBenefits .lmctAccessStoreButton:active {
    transform: translateY(1px);
  }

  .lmctAccessBenefits .lmctAccessNote {
    max-width: 620px;
    margin: 16px auto 0;
    color: var(--lmctAccessMuted);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    text-align: center;
  }

  .lmctAccessBenefits .lmctAccessStores {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    margin-top: 28px;
  }

  .lmctAccessBenefits .lmctAccessStoreButton {
    display: flex;
    width: 214px;
    min-height: 66px;
    align-items: center;
    justify-content: flex-start;
    gap: 13px;
    padding: 12px 16px;
    border: 1px solid var(--lmctAccessStoreBorder);
    border-radius: 11px;
    background:
      linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.07) 0%,
        rgba(255, 255, 255, 0) 58%
      ),
      var(--lmctAccessStore);
    color: var(--lmctAccessWhite);
    text-decoration: none;
    box-shadow: 0 10px 22px rgba(5, 11, 20, 0.18);
    transition:
      transform 180ms ease,
      box-shadow 180ms ease,
      border-color 180ms ease,
      background-color 180ms ease;
    -webkit-tap-highlight-color: transparent;
  }

  .lmctAccessBenefits .lmctAccessStoreIcon {
    display: block;
    width: 32px;
    height: 32px;
    flex: 0 0 32px;
  }

  .lmctAccessBenefits .lmctAccessStoreCopy {
    display: grid;
    gap: 4px;
    min-width: 0;
    color: var(--lmctAccessWhite);
    text-align: left;
  }

  .lmctAccessBenefits .lmctAccessStoreSmall {
    display: block;
    color: rgba(255, 255, 255, 0.72);
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.2px;
  }

  .lmctAccessBenefits .lmctAccessStoreBig {
    display: block;
    color: var(--lmctAccessWhite);
    font-size: 20px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0;
  }

  @media (hover: hover) and (pointer: fine) {
    .lmctAccessBenefits .lmctAccessDashboardCta:hover {
      color: var(--lmctAccessWhite);
      text-decoration: none;
      filter: brightness(1.03);
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(7, 95, 212, 0.3);
    }

    .lmctAccessBenefits .lmctAccessStoreButton:hover {
      border-color: rgba(255, 255, 255, 0.22);
      background-color: #0f1116;
      color: var(--lmctAccessWhite);
      text-decoration: none;
      transform: translateY(-2px);
      box-shadow: 0 15px 28px rgba(5, 11, 20, 0.24);
    }
  }

  @media (max-width: 800px) {
    .lmctAccessBenefits {
      padding: 56px 18px 0px;
    }

    .lmctAccessBenefits .lmctAccessCard {
      padding: 42px 32px 40px;
    }

    .lmctAccessBenefits .lmctAccessTitle {
      font-size: clamp(32px, 5.4vw, 38px);
    }

    .lmctAccessBenefits .lmctAccessDashboardCta {
      width: 100%;
    }

    .lmctAccessBenefits .lmctAccessStores {
      gap: 16px;
    }

    .lmctAccessBenefits .lmctAccessStoreButton {
      width: min(50%, 214px);
    }
  }

  @media (max-width: 600px) {
    .lmctAccessBenefits {
      padding: 46px 16px 50px;
    }

    .lmctAccessBenefits .lmctAccessCard {
      padding: 32px 18px 30px;
      border-radius: 20px;
    }

    .lmctAccessBenefits .lmctAccessCard::after {
      top: 20px;
      right: 18px;
      width: 54px;
      height: 54px;
      opacity: 0.48;
    }

    .lmctAccessBenefits .lmctAccessTitle {
      font-size: clamp(28px, 8vw, 32px);
      line-height: 1.08;
    }

    .lmctAccessBenefits .lmctAccessDescription {
      margin-top: 13px;
      font-size: 16px;
      line-height: 1.52;
    }

    .lmctAccessBenefits .lmctAccessDashboardCta {
      min-height: 62px;
      gap: 10px;
      margin-top: 28px;
      padding: 16px 14px;
      font-size: 17px;
      border-radius: 12px;
    }

    .lmctAccessBenefits .lmctAccessDashboardIcon {
      width: 21px;
      height: 21px;
      flex-basis: 21px;
    }

    .lmctAccessBenefits .lmctAccessNote {
      margin-top: 15px;
      font-size: 13.5px;
    }

    .lmctAccessBenefits .lmctAccessStores {
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .lmctAccessBenefits .lmctAccessStoreButton {
      width: 100%;
      max-width: 260px;
      min-height: 64px;
      justify-content: flex-start;
    }
  }

  @media (max-width: 360px) {
    .lmctAccessBenefits .lmctAccessCard {
      padding: 30px 14px 28px;
      border-radius: 18px;
    }

    .lmctAccessBenefits .lmctAccessTitle {
      font-size: 27px;
    }

    .lmctAccessBenefits .lmctAccessDescription {
      font-size: 15px;
    }

    .lmctAccessBenefits .lmctAccessDashboardCta {
      min-height: 60px;
      padding: 15px 12px;
      font-size: 16px;
    }

    .lmctAccessBenefits .lmctAccessStoreButton {
      gap: 11px;
      padding: 12px 14px;
    }

    .lmctAccessBenefits .lmctAccessStoreIcon {
      width: 29px;
      height: 29px;
      flex-basis: 29px;
    }

    .lmctAccessBenefits .lmctAccessStoreBig {
      font-size: 18px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lmctAccessBenefits .lmctAccessDashboardCta,
    .lmctAccessBenefits .lmctAccessStoreButton {
      transition: none;
    }
  }
</style>
