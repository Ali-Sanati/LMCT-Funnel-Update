<!--
LMCT+ BLACK FRIDAY SECTION SEPARATOR
Replaces the torn-edge image between two sections.
HOW TO USE
1. Add a new row between the two sections. Set the row's padding and margins to 0 and its width to 100%.
2. Drop a Custom JS / HTML element in it and paste this whole file.
3. Delete (or hide) the torn-edge image.
Colours, tilt, speed and size are the variables at the top of the CSS.
-->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet" />

<style id="bfSepStyle">
  .bfSep {
    --bf-above: #0a0a0a !important; /* colour of the section ABOVE */
    --bf-below: #0a8de6 !important; /* colour of the section BELOW */
    --bf-accent: #ffd400 !important; /* yellow edge lines on the black tape */
    --tilt: -4deg !important; /* tape angle (use 4deg to tilt the other way) */
    --size: clamp(30px, 5.2vw, 66px) !important; /* text size, tape height follows it */
    --speed: 26s !important; /* lower = faster */

    position: relative !important;
    display: block !important;
    width: 100vw !important;
    max-width: 100vw !important;
    margin-left: calc(50% - 50vw) !important;
    height: clamp(170px, 24vw, 270px) !important;
    overflow: hidden !important;
    z-index: 5 !important;
    /* background: linear-gradient(to bottom, var(--bf-above) 0 50%, var(--bf-below) 50% 100%) !important; */
    font-family: "Montserrat", Arial, sans-serif !important;
  }
  .bfSep * {
    box-sizing: border-box !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .bfSep__tapes {
    position: absolute !important;
    left: -10% !important;
    width: 120% !important;
    top: 50% !important;
    transform: translateY(-50%) rotate(var(--tilt)) !important;
    display: flex !important;
    flex-direction: column !important;
    filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.45)) !important;
  }
  .bfSep__tape {
    position: relative !important;
    height: calc(var(--size) * 1.55) !important;
    overflow: hidden !important;
    display: flex !important;
    align-items: center !important;
  }
  .bfSep__tape--black {
    background: #000 !important;
    color: #fff !important;
    border-top: 3px solid var(--bf-accent) !important;
    border-bottom: 3px solid var(--bf-accent) !important;
  }
  .bfSep__tape--white {
    background: #fff !important;
    color: #000 !important;
  }

  .bfSep__track {
    display: flex !important;
    width: max-content !important;
    will-change: transform !important;
  }
  .bfSep__tape--black .bfSep__track {
    animation: bfSepLeft var(--speed) linear infinite !important;
  }
  .bfSep__tape--white .bfSep__track {
    animation: bfSepRight var(--speed) linear infinite !important;
  }

  .bfSep__group {
    display: flex !important;
    flex-shrink: 0 !important;
  }
  .bfSep__word {
    flex-shrink: 0 !important;
    padding-right: 0.38em !important;
    font-weight: 800 !important;
    font-size: var(--size) !important;
    line-height: 1 !important;
    letter-spacing: -0.01em !important;
    text-transform: uppercase !important;
    white-space: nowrap !important;
  }

  @media (max-width: 767px) {
    .bfSep {
      --tilt: -5deg !important;
      --speed: 20s !important;
    }
  }
</style>

<!-- keyframes kept separate (declarations inside @keyframes must not use !important) -->
<style>
  @keyframes bfSepLeft {
    0% {
      transform: translateX(0);
    }
    100% {
      transform: translateX(-50%);
    }
  }
  @keyframes bfSepRight {
    0% {
      transform: translateX(-50%);
    }
    100% {
      transform: translateX(0);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .bfSep__track {
      animation: none !important;
    }
  }
</style>

<section class="bfSep" aria-hidden="true">
  <div class="bfSep__tapes">
    <!-- Black tape: BLACK (moves left) -->
    <div class="bfSep__tape bfSep__tape--black">
      <div class="bfSep__track">
        <div class="bfSep__group">
          <span class="bfSep__word">Black</span><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span
          ><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span
          ><span class="bfSep__word">Black</span>
        </div>
        <div class="bfSep__group">
          <span class="bfSep__word">Black</span><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span
          ><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span><span class="bfSep__word">Black</span
          ><span class="bfSep__word">Black</span>
        </div>
      </div>
    </div>

    <!-- White tape: FRIDAY (moves right) -->
    <div class="bfSep__tape bfSep__tape--white">
      <div class="bfSep__track">
        <div class="bfSep__group">
          <span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span
          ><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span
          ><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span>
        </div>
        <div class="bfSep__group">
          <span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span
          ><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span
          ><span class="bfSep__word">Friday</span><span class="bfSep__word">Friday</span>
        </div>
      </div>
    </div>
  </div>
</section>
