<!-- ============================================

     Uses CashGiveaways/testimonial.html content
     and follows susTier tab visibility.
     ============================================ -->
<style>
  .fuel-testimonials-shell,
  .fuel-testimonials-shell *,
  .fuel-testimonials-shell *::before,
  .fuel-testimonials-shell *::after {
    box-sizing: border-box;
  }

  .fuel-testimonials-shell {
    width: 100%;
    padding: 24px 0 44px;
    margin: 0 auto;
    font-family: "Montserrat", sans-serif;
  }

  .fuel-testimonials-shell[data-tier="fuel"] {
    display: none;
  }

  .fuel-testimonials-shell[data-tier="full"] {
    display: flex;
    flex-direction: column;
  }

  .win-shell {
    width: 100vw !important;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    --win-gap: clamp(14px, 2vw, 22px);
    --win-card-width: clamp(280px, 25vw, 330px);
    width: 100%;
    font-family: "Montserrat", sans-serif;
  }

  .win-helper {
    display: none;
    margin: 0 0 10px;
    padding-inline: 12px;
    color: #475569;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .win-body {
    position: relative;
    width: 100%;
    padding-block: 10px 14px;
    overflow: hidden;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }

  .win-body::before,
  .win-body::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 3;
    width: clamp(44px, 7vw, 88px);
    pointer-events: none;
  }

  .win-track,
  .win-seq {
    display: flex;
    align-items: stretch;
    gap: var(--win-gap);
  }

  .win-track {
    width: max-content;
    padding: 4px 0 10px;
    transform: translateX(0);
    will-change: transform;
  }

  .win-card {
    position: relative;
    display: flex;
    flex: 0 0 var(--win-card-width);
    flex-direction: column;
    width: var(--win-card-width);
    min-height: 430px;
    overflow: hidden;
    border-radius: 22px;
    transition:
      transform 0.25s ease,
      box-shadow 0.25s ease;
  }

  .win-body[data-mode="desktop"] .win-card:hover {
    transform: translateY(-4px);
  }

  .win-card::after {
    content: "";
    position: absolute;
    inset: 0 auto 0 -120%;
    z-index: 2;
    width: 58%;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.12),
      transparent
    );
    animation: fuel-testimonial-shine 5.4s ease-in-out infinite;
    pointer-events: none;
  }

  .win-card:nth-child(3n + 2)::after {
    animation-delay: 1.5s;
  }

  .win-card:nth-child(3n)::after {
    animation-delay: 3s;
  }

  @keyframes fuel-testimonial-shine {
    0% {
      left: -120%;
    }
    42%,
    100% {
      left: 145%;
    }
  }

  .win-card.blue {
    background: linear-gradient(165deg, #0c70fd, #206ff5, #1a5de0);
  }

  .win-card.green {
    background: linear-gradient(
      165deg,
      rgb(0, 255, 21),
      #00a724,
      rgb(57, 245, 88)
    );
  }

  .win-card.silver {
    background: linear-gradient(165deg, #c8cdd4, #98a0aa, #787f89);
  }

  .win-card.purple {
    background: linear-gradient(165deg, #c98aef, #9955cc, #7733aa);
  }

  .win-img {
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
    background: transparent;
  }

  .win-img img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .win-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 10px;
    padding: 18px 18px 20px;
    text-align: left;
  }

  .win-prize {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    justify-content: center;
    min-height: 28px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    color: rgba(255, 255, 255, 0.96);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .win-title {
    margin: 0;
    color: #ffffff;
    font-size: 24px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.16);
  }

  .win-quote {
    flex: 1;
    margin: 0;
    color: rgba(255, 255, 255, 0.9);
    font-size: 13px;
    font-weight: 500;
    line-height: 1.65;
    font-style: italic;
    text-wrap: pretty;
  }

  .win-name {
    margin: 0;
    padding-top: 4px;
    color: #ffffff;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  .win-body:focus-visible {
    border-radius: 20px;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.22);
  }

  .sus-member-marquee-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 10px;
    margin: 0 auto 22px;
    border-radius: 999px;
    background: #ffffff;
    color: #0a1d3a;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.14em;
    line-height: 1;
    text-transform: uppercase;
    box-shadow: 0 4px 14px rgba(5, 22, 42, 0.15);
  }

  .sus-member-marquee-pill-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #0c9ffd 0%, #0c63fd 100%);
  }

  .sus-member-marquee-pill-icon svg {
    width: 10px;
    height: 10px;
  }

  .sus-member-marquee {
    width: 100vw;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    padding: 8px 0;
    overflow: hidden;
    background: transparent;
    -webkit-mask-image: linear-gradient(
      90deg,
      transparent 0%,
      #000 8%,
      #000 92%,
      transparent 100%
    );
    mask-image: linear-gradient(
      90deg,
      transparent 0%,
      #000 8%,
      #000 92%,
      transparent 100%
    );
  }

  @media (max-width: 768px) {
    .win-helper {
      display: block;
    }

    .win-body {
      overflow: hidden;
      padding: 6px 12px 14px;
    }

    .win-body::before,
    .win-body::after {
      width: 34px;
    }

    .win-track {
      padding: 4px 0 8px;
    }

    .win-card {
      --win-card-width: min(84vw, 330px);
      min-height: 400px;
      border-radius: 20px;
    }

    .win-card::after {
      animation: none;
    }

    .win-title {
      font-size: 21px;
    }

    .win-quote {
      font-size: 13px;
      line-height: 1.6;
    }

    .win-body::before {
      left: 0;
      background: transparent;
    }

    .win-body::after {
      right: 0;
      background: transparent;
    }

    .sus-member-marquee-pill {
      margin-bottom: 26px;
      padding: 8px 16px 8px 12px;
      font-size: 12px;
    }

    .sus-member-marquee-pill-icon {
      width: 20px;
      height: 20px;
    }

    .sus-member-marquee-pill-icon svg {
      width: 11px;
      height: 11px;
    }
  }

  .sus-member-marquee-line {
    max-width: 540px;
    margin: 22px auto 0;
    color: rgba(255, 255, 255, 0.85);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.01em;
    text-align: center;
  }

  .sus-member-marquee-line strong {
    color: #ffffff;
    font-weight: 800;
  }

  @media (max-width: 480px) {
    .win-helper {
      padding-inline: 10px;
    }

    .win-body {
      padding-inline: 10px;
    }

    .win-track,
    .win-seq {
      gap: 12px;
    }

    .win-card {
      --win-card-width: 88vw;
      min-height: 390px;
    }

    .win-content {
      padding: 16px;
    }

    .win-title {
      font-size: 19px;
    }

    .win-prize {
      font-size: 10px;
    }
  }
</style>

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function buildCard(winner) {
      return (
        '<article class="win-card ' +
        escapeHtml(winner.color) +
        '" aria-label="Winner story from ' +
        escapeHtml(winner.name) +
        '">' +
        '<div class="win-img">' +
        '<img src="' +
        escapeHtml(winner.img) +
        '" alt="' +
        escapeHtml(winner.name + " winner photo") +
        '" loading="lazy" decoding="async">' +
        "</div>" +
        '<div class="win-content">' +
        '<span class="win-prize">' +
        escapeHtml(winner.prize) +
        "</span>" +
        '<h3 class="win-title">' +
        escapeHtml(winner.title) +
        "</h3>" +
        '<p class="win-quote">"' +
        escapeHtml(winner.quote) +
        '"</p>' +
        '<p class="win-name">- ' +
        escapeHtml(winner.name) +
        "</p>" +
        "</div>" +
        "</article>"
      );
    }

    function normalizeTier(tier) {
      return VALID_TIERS[tier] ? tier : "fuel";
    }

    function readTierFromPage() {
      var tierSection = document.getElementById("susTier");
      var params;
      var urlTier;
      var savedTier;

      if (tierSection) {
        return normalizeTier(tierSection.getAttribute("data-tier"));
      }

      try {
        params = new URLSearchParams(window.location.search);
        urlTier = params.get("tier");
        if (VALID_TIERS[urlTier]) return urlTier;
      } catch (e) {}

      try {
        savedTier = sessionStorage.getItem("sus-tier");
        if (VALID_TIERS[savedTier]) return savedTier;
      } catch (e) {}

      return "fuel";
    }

    function initMarquee(container) {
      if (!container || container.dataset.winInit === "true") return null;

      container.dataset.winInit = "true";

      var track = container.querySelector(".win-track");
      var baseSeq = container.querySelector(".win-seq");
      var speed = Number(container.getAttribute("data-speed")) || SPEED_DEFAULT;
      var reducedMotion = window.matchMedia
        ? window.matchMedia("(prefers-reduced-motion: reduce)")
        : null;
      var offset = 0;
      var cycleWidth = 0;
      var lastTs = null;
      var raf = 0;
      var paused = false;
      var resizeTimer = 0;

      if (!track || !baseSeq) return null;

      baseSeq.innerHTML = winners.map(buildCard).join("");

      function gapPx() {
        var gap = getComputedStyle(track).gap || "0";
        return parseFloat(gap) || 0;
      }

      function cleanupClones() {
        while (track.children.length > 1) {
          track.removeChild(track.lastChild);
        }
      }

      function rebuildTrack() {
        var baseWidth;
        var repeatCount = 0;
        var copiesNeeded = 0;

        cleanupClones();

        baseWidth = baseSeq.getBoundingClientRect().width;
        if (baseWidth < 1) return false;

        cycleWidth = baseWidth + gapPx();
        copiesNeeded = Math.max(
          2,
          Math.ceil(container.clientWidth / cycleWidth) + 2,
        );

        for (repeatCount = 1; repeatCount < copiesNeeded; repeatCount += 1) {
          track.appendChild(baseSeq.cloneNode(true));
        }

        return true;
      }

      function stop() {
        if (raf) {
          cancelAnimationFrame(raf);
          raf = 0;
        }
        lastTs = null;
      }

      function enableStaticMode() {
        stop();
        cleanupClones();
        offset = 0;
        paused = false;
        container.dataset.mode = "static";
        container.scrollLeft = 0;
        track.style.transform = "translateX(0px)";
      }

      function tick(ts) {
        var dt;
        var currentSpeed;

        if (paused) {
          lastTs = ts;
          raf = requestAnimationFrame(tick);
          return;
        }

        if (lastTs == null) lastTs = ts;

        dt = (ts - lastTs) / 1000;
        currentSpeed =
          window.innerWidth <= 768 ? speed * MOBILE_SPEED_FACTOR : speed;

        lastTs = ts;
        offset -= currentSpeed * dt;

        while (cycleWidth > 1 && -offset >= cycleWidth) {
          offset += cycleWidth;
        }

        track.style.transform = "translateX(" + offset + "px)";
        raf = requestAnimationFrame(tick);
      }

      function startMarquee() {
        if (container.clientWidth < 1) {
          window.setTimeout(restart, 100);
          return;
        }

        stop();
        if (!rebuildTrack()) {
          window.setTimeout(restart, 100);
          return;
        }

        offset = 0;
        paused = false;
        container.dataset.mode = "desktop";
        container.scrollLeft = 0;
        track.style.transform = "translateX(0px)";
        raf = requestAnimationFrame(tick);
      }

      function restart() {
        if (reducedMotion && reducedMotion.matches) {
          enableStaticMode();
          return;
        }

        startMarquee();
      }

      container.addEventListener("mouseenter", function () {
        paused = true;
      });

      container.addEventListener("mouseleave", function () {
        paused = false;
      });

      container.addEventListener("focusin", function () {
        paused = true;
      });

      container.addEventListener("focusout", function () {
        paused = false;
      });

      container.addEventListener("touchstart", function () {
        paused = true;
      });

      container.addEventListener("touchend", function () {
        paused = false;
      });

      container.addEventListener("touchcancel", function () {
        paused = false;
      });

      window.addEventListener("resize", function () {
        clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(restart, 140);
      });

      if (reducedMotion) {
        if (reducedMotion.addEventListener) {
          reducedMotion.addEventListener("change", restart);
        } else if (reducedMotion.addListener) {
          reducedMotion.addListener(restart);
        }
      }

      restart();

      return {
        setPaused: function (nextPaused) {
          paused = !!nextPaused;
          if (!paused) {
            lastTs = null;
          }
        },
        restart: restart,
      };
    }

    var testimonialsSection = document.getElementById(
      "fuelTestimonialsSection",
    );
    var marqueeEl = document.getElementById("winBody");
    var marqueeControls = null;
    var tierSection = null;
    var boundTierSection = null;

    function syncTestimonialsTier(tier) {
      var nextTier = normalizeTier(tier || readTierFromPage());

      if (!testimonialsSection) return;

      testimonialsSection.setAttribute("data-tier", nextTier);

      if (nextTier === "full") {
        if (!marqueeControls && marqueeEl) {
          marqueeControls = initMarquee(marqueeEl);
        }
        if (marqueeControls) {
          marqueeControls.setPaused(false);
          marqueeControls.restart();
        }
      } else if (marqueeControls) {
        marqueeControls.setPaused(true);
      }
    }

    function bindTierSection() {
      var nextTierSection = document.getElementById("susTier");

      if (!nextTierSection || nextTierSection === boundTierSection) return;

      tierSection = nextTierSection;
      boundTierSection = nextTierSection;

      tierSection.addEventListener("tierchange", function (event) {
        syncTestimonialsTier(event.detail && event.detail.tier);
      });

      if ("MutationObserver" in window) {
        new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            if (mutation.attributeName === "data-tier") {
              syncTestimonialsTier(tierSection.getAttribute("data-tier"));
            }
          });
        }).observe(tierSection, {
          attributes: true,
          attributeFilter: ["data-tier"],
        });
      }

      syncTestimonialsTier(tierSection.getAttribute("data-tier"));
    }

    bindTierSection();

    if (!boundTierSection && "MutationObserver" in window) {
      new MutationObserver(function () {
        bindTierSection();
      }).observe(document.documentElement, {
        childList: true,
        subtree: true,
      });
    }
