<!-- ============================================================
     LMCT+ DISCLAIMER BLOCK
     Paste-ready ClickFunnels 1.0 Custom HTML/Code block.
     Drop near the bottom of the funnel (above the footer).
     Designed to match the funnel's typography and tokens.
     Namespaced .lmdis-* to avoid collisions.
     ============================================================ -->
<style>
  .lmdis *,
  .lmdis *::before,
  .lmdis *::after {
    box-sizing: border-box;
  }
  .lmdis {
    width: 100%;
    max-width: 760px;
    margin: 24px auto 28px auto;
    padding: 0 16px;
    font-family:
      "Montserrat",
      system-ui,
      -apple-system,
      sans-serif;
    text-align: center;
  }
  .lmdis-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    padding: 14px 18px 16px 18px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 11px;
    font-weight: 500;
    line-height: 1.55;
    letter-spacing: 0.01em;
  }
  .lmdis-label {
    display: inline-block;
    color: rgba(255, 255, 255, 0.5);
    font-weight: 800;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .lmdis-card strong {
    color: rgba(255, 255, 255, 0.92);
    font-weight: 700;
  }
  /* Light-background variant — if your section sits on a white/light row,
     swap the .lmdis-card class on the markup below for .lmdis-card-light. */
  .lmdis-card-light {
    background: #f5f8fb;
    border: 1px solid rgba(10, 29, 58, 0.08);
    border-radius: 12px;
    padding: 14px 18px 16px 18px;
    color: rgba(10, 29, 58, 0.65);
    font-size: 11px;
    font-weight: 500;
    line-height: 1.55;
    letter-spacing: 0.01em;
  }
  .lmdis-card-light .lmdis-label {
    color: rgba(10, 29, 58, 0.5);
  }
  .lmdis-card-light strong {
    color: #0a1d3a;
    font-weight: 700;
  }
</style>
<section class="lmdis" id="lmdis" aria-label="Savings disclaimer">
  <div class="lmdis-card">
    <span class="lmdis-label">Disclaimer</span>
    <div>
      All savings figures are <strong>estimates only</strong>, calculated from
      the prices you enter at the time of use. Real-world fuel prices fluctuate
      daily — actual savings will vary. This calculator is provided as a guide
      and does not constitute a guarantee of savings.
    </div>
  </div>
</section>
