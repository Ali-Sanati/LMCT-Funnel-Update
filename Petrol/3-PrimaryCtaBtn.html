<!-- ============================================================
     LMCT+ PRIMARY CTA BUTTON
     Paste-ready ClickFunnels 1.0 Custom HTML/Code block.
     Drop this BETWEEN the pricing headline ($99/year block) and
     the servo photo. Its only job: make the buy action obvious and
     jump people straight to the checkout form so the calculator
     doesn't look like the main CTA.
     On click it smooth-scrolls to #row--30567 (the 2-step form row).
     Namespaced .lmcta-*.
     ============================================================ -->
<style>
  .lmcta *,
  .lmcta *::before,
  .lmcta *::after {
    box-sizing: border-box;
  }
  .lmcta {
    width: 100%;
    max-width: 760px;
    margin: 8px auto 18px auto;
    padding: 0 16px;
    font-family:
      "Montserrat",
      system-ui,
      -apple-system,
      sans-serif;
    text-align: center;
  }
  .lmcta-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 20px 28px;
    background: linear-gradient(135deg, #16c93a 0%, #0fa10b 100%);
    color: #ffffff;
    font-family: inherit;
    font-weight: 900;
    font-size: 18px;
    letter-spacing: 0.02em;
    line-height: 1.1;
    border: 0;
    border-radius: 14px;
    text-decoration: none;
    cursor: pointer;
    box-shadow:
      0 12px 30px rgba(15, 161, 11, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.25);
    transition:
      transform 0.18s ease,
      box-shadow 0.18s ease,
      filter 0.18s ease;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .lmcta-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      0 18px 40px rgba(15, 161, 11, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    filter: brightness(1.05);
    color: #ffffff;
    text-decoration: none;
  }
  .lmcta-btn:active {
    transform: translateY(0);
  }
  /* Pulsing ring to draw the eye */
  .lmcta-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: 0 0 0 0 rgba(22, 201, 58, 0.6);
    animation: lmcta-pulse 2.4s ease-out infinite;
    pointer-events: none;
  }
  @keyframes lmcta-pulse {
    0% {
      box-shadow: 0 0 0 0 rgba(22, 201, 58, 0.5);
    }
    60% {
      box-shadow: 0 0 0 16px rgba(22, 201, 58, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(22, 201, 58, 0);
    }
  }
  /* Sheen sweep */
  .lmcta-btn .lmcta-sheen {
    position: absolute;
    top: 0;
    left: -120%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      100deg,
      transparent 0%,
      rgba(255, 255, 255, 0.35) 50%,
      transparent 100%
    );
    transform: skewX(-18deg);
    animation: lmcta-sheen 3.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes lmcta-sheen {
    0% {
      left: -120%;
    }
    55% {
      left: 130%;
    }
    100% {
      left: 130%;
    }
  }
  .lmcta-btn-arrow {
    display: inline-flex;
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    transition: transform 0.2s ease;
  }
  .lmcta-btn-arrow svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    fill: none;
    stroke-width: 3;
  }
  .lmcta-btn:hover .lmcta-btn-arrow {
    transform: translateX(3px);
  }
  .lmcta-sub {
    margin: 12px auto 0 auto;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .lmcta-sub .lmcta-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
  }
  @media (min-width: 640px) {
    .lmcta-btn {
      font-size: 19px;
      padding: 22px 32px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .lmcta-btn::after,
    .lmcta-btn .lmcta-sheen {
      animation: none !important;
    }
  }
</style>
<section class="lmcta" id="lmcta">
  <a
    href="#row--30567"
    class="lmcta-btn"
    id="lmctaBtn"
    role="button"
    aria-label="Become a member — jump to signup"
  >
    <span class="lmcta-sheen" aria-hidden="true"></span>
    <span>Become a Member — $99/yr</span>
    <span class="lmcta-btn-arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12" />
        <polyline points="12 5 19 12 12 19" />
      </svg>
    </span>
  </a>
  <p class="lmcta-sub">
    <span>Lock in wholesale pricing</span>
    <span class="lmcta-dot"></span>
    <span>Cancel anytime</span>
    <span class="lmcta-dot"></span>
    <span>60-second signup</span>
  </p>
</section>
<script>
  (function () {
    const SCROLL_TARGET = "#row--30567";
    const btn = document.getElementById("lmctaBtn");
    if (!btn) return;
    btn.addEventListener("click", function (e) {
      const target = document.querySelector(SCROLL_TARGET);
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: "smooth", block: "start" });
        // Nudge focus to the first input for keyboard/AT users
        setTimeout(() => {
          const firstInput = target.querySelector(
            'input[name="name"], input[type="text"], input',
          );
          if (firstInput) firstInput.focus({ preventScroll: true });
        }, 600);
      }
      // If target not found, the href="#row--30567" anchor still jumps
    });
  })();
</script>
