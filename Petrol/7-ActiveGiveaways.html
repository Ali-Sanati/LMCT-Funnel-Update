<!-- ============================================
     BLOCK B — Active Giveaways (API-driven) + Inclusions
     Width: 1170px
     Source: https://api.lmctplus.com/api/v1/giveaways?limit=9&offset=0&status=active
     Image: full-width, whole banner (no crop). Badges overlaid to save height.
     Layout: 2-up cards on desktop, single column on mobile
     ============================================ -->
<style>
  .sus-proof *,
  .sus-proof *::before,
  .sus-proof *::after {
    box-sizing: border-box;
  }
  .sus-proof {
    position: relative;
    width: 100%;
    font-family:
      "Montserrat",
      system-ui,
      -apple-system,
      sans-serif;
    color: #ffffff;
    text-align: center;
  }
  .sus-proof-inner {
    max-width: 1170px;
    margin: 0 auto;
  }
  .sus-proof[data-tier="fuel"] {
    display: none;
  }
  .sus-proof[data-tier="full"] {
    display: block;
    animation: sus-proof-fade 0.5s ease-out both;
  }
  @keyframes sus-proof-fade {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  @keyframes sus-prize-pulse {
    0%,
    100% {
      opacity: 1;
      transform: scale(1);
    }
    50% {
      opacity: 0.5;
      transform: scale(1.3);
    }
  }
  /* ===== PILL-STYLE SECTION EYEBROW ===== */
  .sus-eyebrow-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 10px;
    background: #ffffff;
    border-radius: 999px;
    color: #0a1d3a;
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1;
    margin: 0 auto 22px auto;
    box-shadow: 0 4px 14px rgba(5, 22, 42, 0.15);
  }
  .sus-eyebrow-pill-icon {
    width: 18px;
    height: 18px;
    background: linear-gradient(135deg, #0c9ffd 0%, #0c63fd 100%);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .sus-eyebrow-pill-icon svg {
    width: 10px;
    height: 10px;
  }
  /* ===== GIVEAWAY GRID — 2-up ===== */
  .sus-prize-list {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: stretch;
    gap: 16px;
    max-width: 940px;
    margin: 0 auto 30px auto;
  }
  .sus-prize-loading,
  .sus-prize-empty {
    flex: 1 1 100%;
    text-align: center;
    color: rgba(255, 255, 255, 0.85);
    font-weight: 600;
    font-size: 15px;
    line-height: 1.4;
    padding: 24px 16px;
    margin: 0;
  }
  /* ===== GIVEAWAY CARD ===== */
  .sus-prize {
    display: flex;
    flex-direction: column;
    flex: 1 1 360px;
    min-width: 320px;
    max-width: 460px;
    background: #ffffff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(5, 22, 42, 0.28);
    border: 1px solid rgba(10, 29, 58, 0.08);
    text-align: left;
    text-decoration: none !important;
    transition:
      transform 0.2s ease,
      box-shadow 0.2s ease;
  }
  .sus-prize:hover,
  .sus-prize:focus,
  .sus-prize:active,
  .sus-prize:visited {
    transform: translateY(-3px);
    box-shadow: 0 16px 36px rgba(5, 22, 42, 0.4);
    text-decoration: none !important;
    color: inherit;
  }
  .sus-prize *,
  .sus-prize:hover *,
  .sus-prize:focus *,
  .sus-prize:active *,
  .sus-prize:visited * {
    text-decoration: none !important;
  }
  /* ===== IMAGE — full width, whole banner, no crop ===== */
  .sus-prize-imgwrap {
    position: relative;
    width: 100%;
    background: #0a1d3a;
    line-height: 0;
    flex-shrink: 0;
  }
  .sus-prize-img {
    display: block;
    width: 100%;
    height: auto;
  }
  /* ===== OVERLAY BADGES — sit on image, zero extra height ===== */
  .sus-prize-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 26px 12px 10px 12px;
    background: linear-gradient(
      to top,
      rgba(5, 12, 28, 0.82) 0%,
      rgba(5, 12, 28, 0) 100%
    );
    pointer-events: none;
    z-index: 1;
  }
  /* ===== BODY — slim text strip ===== */
  .sus-prize-body {
    padding: 12px 15px 14px 15px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .sus-prize-title {
    color: #0a1d3a;
    font-weight: 900;
    font-size: 18px;
    line-height: 1.15;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .sus-prize-cash {
    color: #0c63fd;
    font-weight: 800;
    font-size: 15px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin: 3px 0 0 0;
  }
  .sus-prize-cash::before {
    content: "or ";
    color: rgba(10, 29, 58, 0.45);
    font-weight: 700;
  }
  /* ===== CHIPS ===== */
  .sus-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.92);
    color: #0a1d3a;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(5, 12, 28, 0.25);
  }
  .sus-tag-live {
    background: #ff3b3b;
    color: #ffffff;
  }
  .sus-tag-live i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffffff;
    display: inline-block;
    animation: sus-prize-pulse 1.6s ease-in-out infinite;
  }
  .sus-tag-reward {
    background: linear-gradient(135deg, #0c9ffd 0%, #0c63fd 100%);
    color: #ffffff;
  }
  /* ===== INCLUSIONS — WHITE CARDS ===== */
  .sus-includes {
    margin: 0 auto 36px auto;
    max-width: 760px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    text-align: left;
  }
  .sus-include {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: #ffffff;
    border: 1px solid rgba(10, 29, 58, 0.08);
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(5, 22, 42, 0.12);
  }
  .sus-include-icon {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #0c9ffd 0%, #0c63fd 100%);
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(12, 99, 253, 0.3);
  }
  .sus-include-icon svg {
    width: 16px;
    height: 16px;
    stroke: #ffffff;
  }
  .sus-include-text {
    color: #0a1d3a;
    font-weight: 600;
    font-size: 14px;
    line-height: 1.4;
    letter-spacing: 0.01em;
  }
  .sus-include-text strong {
    font-weight: 800;
    color: #0a1d3a;
  }
  @media (min-width: 600px) {
    .sus-includes {
      grid-template-columns: 1fr 1fr;
    }
  }
  @media (min-width: 768px) {
    .sus-eyebrow-pill {
      font-size: 12px;
      padding: 8px 16px 8px 12px;
      margin-bottom: 26px;
    }
    .sus-eyebrow-pill-icon {
      width: 20px;
      height: 20px;
    }
    .sus-eyebrow-pill-icon svg {
      width: 11px;
      height: 11px;
    }
    .sus-prize-title {
      font-size: 19px;
    }
    .sus-prize-cash {
      font-size: 16px;
    }
    .sus-include {
      padding: 16px 18px;
    }
    .sus-include-text {
      font-size: 15px;
    }
  }
  /* ===== MOBILE — single column ===== */
  @media (max-width: 640px) {
    .sus-prize-list {
      max-width: 480px;
      gap: 12px;
    }
    .sus-prize {
      flex: 1 1 100%;
      min-width: 0;
      max-width: 100%;
    }
    .sus-prize-title {
      font-size: 16px;
    }
    .sus-prize-cash {
      font-size: 14px;
    }
    .sus-prize-overlay {
      padding: 24px 11px 9px 11px;
    }
    .sus-prize-body {
      padding: 11px 13px 12px 13px;
    }
    .sus-tag {
      font-size: 9px;
      padding: 3px 7px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .sus-proof,
    .sus-prize {
      animation: none !important;
      transition: none !important;
    }
    .sus-tag-live i {
      animation: none !important;
    }
  }
</style>
<section
  class="sus-proof"
  id="susProof"
  data-tier="fuel"
  role="region"
  aria-label="Members-only giveaways and proof"
>
  <div class="sus-proof-inner">
    <!-- MyRenoRules section title — pill style -->
    <span class="sus-eyebrow-pill">
      <span class="sus-eyebrow-pill-icon">
        <svg
          viewBox="0 0 24 24"
          fill="#ffffff"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M12 2l2.39 7.36H22l-6.18 4.49L18.21 22 12 17.27 5.79 22l2.39-8.15L2 9.36h7.61z"
          />
        </svg>
      </span>

    </span>
    <div class="sus-prize-list" id="susPrizeList">
      <p class="sus-prize-loading">Loading live giveaways&hellip;</p>

    <div class="sus-includes">
      <div class="sus-include">

      <div class="sus-include">

          <svg

<script>
  window.addEventListener("load", function () {
    var API =
      "https://api.lmctplus.com/api/v1/giveaways?limit=9&offset=0&status=active";
    var list = document.getElementById("susPrizeList");
    if (!list) return;
    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s == null ? "" : String(s);
      return d.innerHTML;
    }
    function validLink(u) {
      return u && u !== "tbd" && /^https?:\/\//i.test(u);
    }
    function pickLink(g) {
      if (validLink(g.publicPromotionLink)) return g.publicPromotionLink;
      if (validLink(g.promotionLink)) return g.promotionLink;
      return "https://lmctgiveaway.com";
    }
    function fmtDate(s) {
      if (!s) return "";
      var d = new Date(s);
      if (isNaN(d.getTime())) return "";
      var months = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];
      return d.getDate() + " " + months[d.getMonth()];
    }
    function splitPrize(text) {
      var t = (text || "").trim();
      var parts = t.split(/\s+or\s+/i);
      if (parts.length >= 2) {
        return {
          prize: parts
            .slice(0, parts.length - 1)
            .join(" or ")
            .trim(),
          cash: parts[parts.length - 1].trim(),
          showOr: true,
        };
      }
      return { prize: t, cash: "", showOr: false };
    }
    function cardHTML(g) {
      var prizeText =
        g.prizes && g.prizes[0] && g.prizes[0].title
          ? g.prizes[0].title
          : g.title;
      var parsed = splitPrize(prizeText);
      var link = pickLink(g);
      var img = g.image || "";
      var reward = g.reward || "";
      var drawDate = fmtDate(g.declareDate || g.endDate);
      var cashLine = parsed.showOr
        ? '<p class="sus-prize-cash">' + esc(parsed.cash) + "</p>"
        : "";
      var tags = '<span class="sus-tag sus-tag-live"><i></i>Live</span>';
      if (reward) {
        tags +=
          '<span class="sus-tag sus-tag-reward">' + esc(reward) + "</span>";
      }
      if (drawDate) {
        tags += '<span class="sus-tag">Drawn ' + esc(drawDate) + "</span>";
      }
      return (
        '<a class="sus-prize" href="' +
        esc(link) +
        '" target="_blank" rel="noopener" aria-label="' +
        esc(g.title) +
        '">' +
        '<span class="sus-prize-imgwrap">' +
        '<img class="sus-prize-img" src="' +
        esc(img) +
        '" alt="' +
        esc(g.title) +
        '" loading="lazy" />' +
        '<span class="sus-prize-overlay">' +
        tags +
        "</span>" +
        "</span>" +
        '<div class="sus-prize-body">' +
        '<h3 class="sus-prize-title">' +
        esc(parsed.prize) +
        "</h3>" +
        cashLine +
        "</div>" +
        "</a>"
      );
    }
    function render(items) {
      if (!items || !items.length) {
        list.innerHTML =
          '<p class="sus-prize-empty">No live giveaways right now — check back soon.</p>';
        return;
      }
      var html = "";
      for (var i = 0; i < items.length; i++) {
        html += cardHTML(items[i]);
      }
      list.innerHTML = html;
    }
    fetch(API, { headers: { Accept: "application/json" } })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (res) {
        render(res && res.data ? res.data : []);
      })
      .catch(function () {
        list.innerHTML =
          '<p class="sus-prize-empty">Giveaways are taking a moment to load — please refresh.</p>';
      });
  });
</script>
