<!-- THANK YOU HERO — MEMBER WELCOME              -->

<style>
  .lmctTY__wrap{
    position:relative;
    background:transparent;
    padding:32px 16px 40px;
    font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;
  }
  .lmctTY__card{
    position:relative;
    max-width:1080px;margin:0 auto;
    background:transparent;
    text-align:center;
    opacity:0;transform:translateY(14px);
    animation:lmctTY__cardIn .7s ease-out .05s forwards;
  }
  /* banner */
  .lmctTY__banner{
    position:relative;display:inline-flex;align-items:center;justify-content:center;
    gap:10px;
    background:linear-gradient(90deg,#0476c4 0%,#0C9FFD 50%,#3fb8ff 100%);
    border-radius:999px;padding:11px 24px;color:#fff;
    box-shadow:0 6px 20px rgba(12,159,253,0.32);
    overflow:hidden;white-space:nowrap;margin-bottom:24px;
    opacity:0;transform:translateY(-10px) scale(.96);
    animation:lmctTY__bannerIn .6s cubic-bezier(.2,.9,.3,1.4) .25s forwards;
  }
  .lmctTY__banner::after{
    content:"";position:absolute;top:0;left:-60%;
    width:50%;height:100%;
    background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.3) 50%,transparent 100%);
    transform:skewX(-20deg);
    animation:lmctTY__sheen 3.4s ease-in-out 1.4s infinite;
    pointer-events:none;
  }
  .lmctTY__iconWrap{
    position:relative;z-index:2;flex-shrink:0;
    width:22px;height:22px;border-radius:50%;background:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    animation:lmctTY__pulse 2.4s ease-out 1.4s infinite;
  }
  .lmctTY__iconWrap svg{width:13px;height:13px;color:#0476c4;}
  .lmctTY__pillText{
    position:relative;z-index:2;margin:0;
    font-family:'Montserrat',sans-serif;
    font-size:clamp(12px,2.6vw,15px);
    font-weight:800;letter-spacing:1.4px;
    text-transform:uppercase;line-height:1;
    text-shadow:0 1px 2px rgba(0,0,0,0.12);
  }
  /* heading */
  .lmctTY__heading{
    display:block;
    font-family:'Montserrat',sans-serif;
    font-size:clamp(36px,8vw,78px);
    font-weight:900;line-height:1.05;letter-spacing:-1.8px;
    background:linear-gradient(180deg,#0476c4 0%,#0C9FFD 50%,#3fb8ff 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    text-transform:uppercase;
    opacity:0;transform:translateY(14px) scale(.98);
    animation:lmctTY__headingIn .65s cubic-bezier(.2,.9,.3,1.3) .4s forwards;
  }
  .lmctTY__logo{
    display:inline-block;
    height:0.95em;
    width:auto;
    vertical-align:-0.12em;
    margin:0 0.04em;
    /* image sits outside the gradient-clip, so it shows in full colour as intended */
  }
  .lmctTY__memberLine{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-wrap:nowrap;
    gap:0.18em;
    line-height:1;
  }
  @keyframes lmctTY__cardIn{ to{opacity:1;transform:translateY(0);} }
  @keyframes lmctTY__bannerIn{
    0%{opacity:0;transform:translateY(-10px) scale(.96);}
    60%{opacity:1;transform:translateY(2px) scale(1.01);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }
  @keyframes lmctTY__pulse{
    0%{box-shadow:0 0 0 0 rgba(255,255,255,0.6);}
    70%{box-shadow:0 0 0 12px rgba(255,255,255,0);}
    100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
  }
  @keyframes lmctTY__sheen{ 0%{left:-60%;}60%{left:120%;}100%{left:120%;} }
  @keyframes lmctTY__headingIn{
    0%{opacity:0;transform:translateY(14px) scale(.98);}
    60%{opacity:1;transform:translateY(-2px) scale(1.01);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }
  @media (prefers-reduced-motion:reduce){
    .lmctTY__card,.lmctTY__banner,.lmctTY__banner::after,.lmctTY__iconWrap,
    .lmctTY__heading{
      animation:none !important;opacity:1 !important;transform:none !important;
    }
  }
  @media (max-width:520px){
    .lmctTY__wrap{padding:24px 14px 28px;}
    .lmctTY__banner{padding:10px 18px;gap:8px;margin-bottom:20px;}
    .lmctTY__iconWrap{width:20px;height:20px;}
    .lmctTY__iconWrap svg{width:12px;height:12px;}
    .lmctTY__pillText{letter-spacing:1px;}
    .lmctTY__heading{letter-spacing:-1px;}
    .lmctTY__memberLine{gap:0.14em;}
  }
</style>
<div class="lmctTY__wrap">
  <div class="lmctTY__card">
    <div class="lmctTY__banner">
      <span class="lmctTY__iconWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12.5L10 17.5L19 7.5"/>
        </svg>
      </span>
      <p class="lmctTY__pillText">Congratulations</p>
    </div>
    <span class="lmctTY__heading">
      You Are Now An<br>
      <span class="lmctTY__memberLine">
        <img class="lmctTY__logo" src="https://images.clickfunnels.com/11/5808e1954343cc90744e7bcca46ae8/logo.3bf7fa51a183b716b171.png" alt="LMCT+" />
        Member!
      </span>
    </span>
  </div>
</div>
