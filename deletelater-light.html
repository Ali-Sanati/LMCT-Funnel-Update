<style>
  /* ============================================
   GIVEAWAY DETAILS - LMCT+ LIGHT LUXE CASH STAGE
   Namespace: gdl-
   ============================================ */
  .gdl-section,
  .gdl-section *,
  .gdl-section *::before,
  .gdl-section *::after {
    box-sizing: border-box;
    font-family:
      "Montserrat",
      "Inter",
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  .gdl-section {
    --gdl-cream: #fffdfa;
    --gdl-gold: #d59a17;
    --gdl-gold-deep: #8e6411;
    --gdl-green: #0cb84a;
    --gdl-green-hot: #18d85a;
    --gdl-ink: #0f2d1d;
    --gdl-panel: rgba(255, 255, 255, 0.76);
    --gdl-panel-soft: rgba(255, 255, 255, 0.48);
    --gdl-border: rgba(175, 130, 30, 0.34);

    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: clamp(40px, 5vw, 70px) clamp(16px, 4vw, 48px)
      clamp(32px, 4vw, 58px);
    position: relative;
    isolation: isolate;
    overflow: hidden;
    color: var(--gdl-ink);
    background: radial-gradient(
        circle at 50% 8%,
        rgba(72, 255, 136, 0.24),
        transparent 28%
      ),
      radial-gradient(
        circle at 16% 24%,
        rgba(255, 213, 83, 0.24),
        transparent 28%
      ),
      radial-gradient(
        circle at 84% 18%,
        rgba(43, 205, 112, 0.16),
        transparent 30%
      ),
      linear-gradient(180deg, #fbfff5 0%, #f3ffeb 46%, #e8f7e5 100%)
      !important;
    border: 1px solid rgba(14, 124, 63, 0.18);
    border-radius: 24px;
    box-shadow:
      0 26px 78px rgba(24, 84, 45, 0.18),
      0 0 0 1px rgba(255, 255, 255, 0.82),
      0 0 42px rgba(67, 255, 119, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.98);
  }

  .gdl-section::before {
    content: "";
    position: absolute;
    inset: -28% -18% auto;
    height: 78%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(
        circle at 50% 18%,
        rgba(255, 244, 168, 0.4),
        transparent 18%
      ),
      radial-gradient(
        circle at 28% 48%,
        rgba(72, 255, 130, 0.26),
        transparent 26%
      ),
      radial-gradient(
        circle at 74% 42%,
        rgba(255, 214, 86, 0.26),
        transparent 27%
      );
    filter: blur(20px);
    opacity: 0.9;
    animation: gdl-aura-drift 12s ease-in-out infinite alternate;
  }

  .gdl-section::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(
        115deg,
        transparent 0%,
        rgba(255, 255, 255, 0.26) 39%,
        rgba(255, 224, 112, 0.18) 48%,
        transparent 58%
      ),
      radial-gradient(
        circle at 50% 112%,
        rgba(18, 107, 55, 0.12),
        transparent 48%
      );
    mix-blend-mode: normal;
    opacity: 0.95;
  }

  .gdl-stage {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .gdl-stage-line {
    position: absolute;
    left: 50%;
    top: 5%;
    width: min(92%, 880px);
    height: 1px;
    transform: translateX(-50%);
    background: linear-gradient(
      90deg,
      transparent,
      rgba(197, 133, 14, 0.54),
      rgba(18, 184, 74, 0.45),
      transparent
    );
    box-shadow:
      0 0 22px rgba(255, 214, 86, 0.24),
      0 0 42px rgba(67, 255, 119, 0.16);
  }

  .gdl-stage-halo {
    position: absolute;
    left: 50%;
    top: 19%;
    width: min(70vw, 700px);
    height: min(70vw, 700px);
    border-radius: 999px;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(circle, rgba(255, 235, 122, 0.22), transparent 36%),
      conic-gradient(
        from 20deg,
        transparent 0deg,
        rgba(255, 198, 60, 0.22) 52deg,
        transparent 98deg,
        rgba(20, 186, 77, 0.22) 164deg,
        transparent 212deg,
        rgba(255, 198, 60, 0.18) 278deg,
        transparent 360deg
      );
    filter: blur(1px);
    opacity: 0.42;
    animation: gdl-halo-turn 18s linear infinite;
  }

  .gdl-stage-beam {
    position: absolute;
    top: -24%;
    width: 24vw;
    min-width: 180px;
    max-width: 340px;
    height: 130%;
    opacity: 0.26;
    filter: blur(5px);
    transform-origin: top center;
    background: linear-gradient(
      180deg,
      transparent 0%,
      rgba(255, 224, 121, 0.18) 18%,
      rgba(93, 255, 127, 0.16) 44%,
      rgba(255, 255, 255, 0.42) 74%,
      transparent 100%
    );
    clip-path: polygon(44% 0, 58% 0, 100% 100%, 0 100%);
    mix-blend-mode: screen;
    animation: gdl-beam-breathe 9s ease-in-out infinite;
  }

  .gdl-stage-beam-1 {
    left: 3%;
    --gdl-beam-rotate: -20deg;
    animation-delay: -1.8s;
  }

  .gdl-stage-beam-2 {
    right: 4%;
    --gdl-beam-rotate: 18deg;
    animation-delay: -5.2s;
  }

  .gdl-stage-floor {
    position: absolute;
    left: 50%;
    bottom: -98px;
    width: min(78%, 760px);
    height: 190px;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 1px solid rgba(197, 133, 14, 0.28);
    background:
      radial-gradient(
        ellipse at 50% 34%,
        rgba(20, 186, 77, 0.18),
        transparent 42%
      ),
      radial-gradient(
        ellipse at 50% 50%,
        rgba(255, 202, 69, 0.2),
        transparent 58%
      ),
      linear-gradient(180deg, rgba(255, 255, 255, 0.48), rgba(255, 255, 255, 0));
    box-shadow:
      0 0 34px rgba(20, 186, 77, 0.1),
      inset 0 0 22px rgba(197, 133, 14, 0.1);
  }

  .gdl-stage-floor::before,
  .gdl-stage-floor::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 22%;
    width: 82%;
    height: 44%;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 1px solid rgba(197, 133, 14, 0.2);
  }

  .gdl-stage-floor::after {
    top: 33%;
    width: 58%;
    height: 30%;
    border-color: rgba(20, 186, 77, 0.16);
  }

  .gdl-cash-rain-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .gdl-wrap {
    position: relative;
    z-index: 2;
  }

  .gdl-title {
    position: relative;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto clamp(28px, 4vw, 42px);
    color: var(--gdl-ink);
    font-size: clamp(36px, 5.6vw, 68px);
    font-weight: 950;
    line-height: 0.92;
    letter-spacing: 0;
    text-align: center;
    text-transform: uppercase;
    text-wrap: balance;
    background: none;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: #123720;
    -webkit-text-stroke: 1px rgba(197, 133, 14, 0.24);
    text-shadow:
      0 2px 0 rgba(255, 255, 255, 0.86),
      0 3px 0 rgba(197, 133, 14, 0.18),
      0 12px 24px rgba(44, 107, 56, 0.16),
      0 0 18px rgba(255, 221, 90, 0.26);
    filter: drop-shadow(0 8px 18px rgba(20, 92, 46, 0.14));
  }

  .gdl-title::before,
  .gdl-title::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .gdl-title::before {
    bottom: -18px;
    width: min(74%, 440px);
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(197, 133, 14, 0.72),
      rgba(20, 186, 77, 0.6),
      transparent
    );
    box-shadow: 0 0 18px rgba(255, 221, 90, 0.32);
  }

  .gdl-title::after {
    bottom: -21px;
    width: 84px;
    height: 7px;
    border-radius: 999px;
    background: linear-gradient(90deg, #f0bd3f, var(--gdl-green));
    box-shadow:
      0 0 18px rgba(255, 221, 90, 0.36),
      0 0 24px rgba(20, 186, 77, 0.2);
  }

  .gdl-winners {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(16px, 2.6vw, 26px);
    margin-bottom: clamp(16px, 2.6vw, 26px);
  }

  .gdl-prize-card,
  .gdl-info-card {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--gdl-border);
    border-radius: 8px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.94), transparent 20%),
      radial-gradient(
        circle at 50% 0%,
        rgba(255, 221, 90, 0.18),
        transparent 44%
      ),
      linear-gradient(180deg, rgba(255, 255, 255, 0.82), rgba(242, 255, 237, 0.76));
    box-shadow:
      0 18px 42px rgba(20, 92, 46, 0.14),
      0 0 28px rgba(67, 255, 119, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(14px);
  }

  .gdl-prize-card::before,
  .gdl-info-card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
      linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.76),
        transparent 24%,
        transparent 70%,
        rgba(20, 186, 77, 0.08)
      ),
      repeating-linear-gradient(
        90deg,
        rgba(15, 45, 29, 0.035) 0 1px,
        transparent 1px 58px
      );
    opacity: 0.82;
    pointer-events: none;
  }

  .gdl-prize-card::after,
  .gdl-info-card::after {
    content: "";
    position: absolute;
    inset: -40% auto -40% -65%;
    z-index: 0;
    width: 46%;
    transform: skewX(-18deg);
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.72),
      transparent
    );
    opacity: 0;
    animation: gdl-card-sheen 7s ease-in-out infinite;
    pointer-events: none;
  }

  .gdl-prize-card:nth-child(2)::after {
    animation-delay: -3.4s;
  }

  .gdl-prize-card {
    min-height: 300px;
    padding: clamp(28px, 4vw, 42px) clamp(20px, 3vw, 34px)
      clamp(26px, 3.5vw, 36px);
    text-align: center;
  }

  .gdl-prize-card > *,
  .gdl-info-card > * {
    position: relative;
    z-index: 1;
  }

  .gdl-prize-badge,
  .gdl-info-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
    margin-bottom: 18px;
    padding: 7px 16px;
    border: 1px solid rgba(15, 123, 57, 0.28);
    border-radius: 999px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.16), transparent),
      linear-gradient(180deg, #155c2c, #0a351c);
    color: #fff7c6;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.8px;
    line-height: 1;
    text-transform: uppercase;
    box-shadow:
      0 8px 18px rgba(10, 53, 28, 0.16),
      inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }

  .gdl-prize-headline {
    margin: 0 0 8px;
    color: var(--gdl-green);
    font-size: clamp(44px, 6vw, 72px);
    font-weight: 950;
    line-height: 0.92;
    letter-spacing: 0;
    white-space: nowrap;
    text-shadow:
      0 0 14px rgba(24, 216, 90, 0.24),
      0 0 34px rgba(67, 255, 119, 0.12),
      0 4px 12px rgba(20, 92, 46, 0.16);
  }

  .gdl-prize-sub {
    margin: 0 0 28px;
    color: rgba(15, 45, 29, 0.74);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.9px;
    line-height: 1.25;
    text-transform: uppercase;
  }

  .gdl-prize-divider {
    position: relative;
    height: 1px;
    margin: 0 0 27px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(197, 133, 14, 0.42),
      rgba(20, 186, 77, 0.28),
      transparent
    );
  }

  .gdl-prize-divider span {
    position: absolute;
    top: 50%;
    left: 50%;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(197, 133, 14, 0.42);
    border-radius: 999px;
    background:
      radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.82), transparent),
      linear-gradient(180deg, #ffffff, #eaf9e6);
    color: #805a00;
    font-size: 12px;
    font-weight: 950;
    letter-spacing: 1.6px;
    box-shadow:
      0 0 18px rgba(255, 218, 85, 0.18),
      0 8px 16px rgba(20, 92, 46, 0.14);
  }

  .gdl-prize-alt {
    color: #133920;
    font-size: clamp(16px, 1.9vw, 20px);
    font-weight: 850;
    line-height: 1.3;
    letter-spacing: 0;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
  }

  .gdl-info-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(14px, 2.3vw, 22px);
  }

  .gdl-info-card {
    min-height: 184px;
    padding: clamp(24px, 3.5vw, 34px) clamp(18px, 3vw, 30px);
    text-align: center;
  }

  .gdl-info-pill {
    min-height: 30px;
    margin-bottom: 17px;
    color: #17331e;
    background:
      linear-gradient(180deg, #ffffff, #ffe68e 42%, #d59a17),
      #ffe68e;
    border-color: rgba(197, 133, 14, 0.42);
    box-shadow:
      0 8px 20px rgba(197, 133, 14, 0.16),
      0 0 20px rgba(255, 218, 85, 0.24);
  }

  .gdl-info-headline {
    margin: 0 0 6px;
    color: #17331e;
    font-size: clamp(30px, 4vw, 44px);
    font-weight: 950;
    line-height: 1;
    letter-spacing: 0;
    text-shadow:
      0 1px 0 rgba(255, 255, 255, 0.82),
      0 3px 12px rgba(20, 92, 46, 0.1);
  }

  .gdl-info-detail {
    margin: 0 0 18px;
    color: var(--gdl-green);
    font-size: clamp(15px, 1.8vw, 19px);
    font-weight: 900;
    line-height: 1.22;
    text-shadow: 0 0 14px rgba(24, 216, 90, 0.14);
  }

  .gdl-info-meta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    max-width: 100%;
    color: rgba(15, 45, 29, 0.62);
    font-size: 12px;
    font-weight: 650;
    line-height: 1.35;
    letter-spacing: 0;
  }

  .gdl-ch7-mark {
    width: 19px;
    height: 19px;
    flex: 0 0 auto;
    display: inline-block;
    vertical-align: middle;
    filter: drop-shadow(0 0 8px rgba(230, 57, 70, 0.22));
  }

  .gdl-section a {
    text-decoration: none !important;
  }

  /* ===== FALLING CASH ANIMATION ===== */
  .gdl-cash-particle {
    position: absolute;
    top: -120px;
    left: 0;
    pointer-events: none;
    will-change: transform, opacity;
  }

  .gdl-cash-dollar {
    width: var(--size, 56px);
    height: calc(var(--size, 56px) * 0.58);
    opacity: var(--opacity, 0.46);
    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;
    transform-origin: center;
    animation: gdl-cash-fall var(--duration, 7s) linear infinite;
    animation-delay: var(--delay, 0s);
    z-index: 1;
    filter: drop-shadow(0 8px 12px rgba(20, 92, 46, 0.14));

y="360" r="16"/%3E%3C/g%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3C/svg%3E%0A');
  }

  .gdl-cash-coin {
    width: var(--size, 26px);
    height: var(--size, 26px);
    border-radius: 50%;
    opacity: var(--opacity, 0.62);
    background: radial-gradient(
      circle at 35% 35%,
      #fff6bd 0%,
      #ffd95a 36%,
      #d9a51b 72%,
      #805a00 100%
    );
    box-shadow:
      inset 0 2px 3px rgba(255, 255, 255, 0.5),
      inset 0 -2px 3px rgba(0, 0, 0, 0.2),
      0 5px 12px rgba(20, 92, 46, 0.14),
      0 0 16px rgba(255, 218, 85, 0.18);
    animation: gdl-cash-fall-spin var(--duration, 5s) ease-in infinite;
    animation-delay: var(--delay, 0s);
    z-index: 2;
  }

  .gdl-cash-coin::before {
    content: "$";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(78, 54, 0, 0.92);
    font-size: calc(var(--size, 26px) * 0.55);
    font-weight: 950;
  }

  .gdl-cash-confetti {
    width: var(--w, 10px);
    height: var(--h, 4px);
    border-radius: 999px;
    opacity: var(--opacity, 0.62);
    background: var(--color, #fff4bd);
    transform: rotate(var(--rot, 0deg));
    animation: gdl-confetti-fall var(--duration, 4.8s) ease-out infinite;
    animation-delay: var(--delay, 0s);
    box-shadow: 0 0 12px rgba(20, 186, 77, 0.12);
    z-index: 0;
  }

  @keyframes gdl-cash-fall {
    0% {
      transform: translate3d(0, -120px, 0) rotate(0deg);
    }
    100% {
      transform: translate3d(var(--drift, 30px), 108vh, 0)
        rotate(var(--spin, 360deg));
    }
  }

  @keyframes gdl-cash-fall-spin {
    0% {
      transform: translate3d(0, -120px, 0) rotateY(0deg) rotate(0deg);
    }
    100% {
      transform: translate3d(var(--drift, 12px), 108vh, 0) rotateY(720deg)

<script>
  (function () {
    var layers = document.querySelectorAll(".gdl-cash-rain-layer");
    if (!layers.length) return;

    var dollarNum = 24;
    var coinNum = 12;
    var confettiNum = 32;
    var confettiColors = [
      "#f7c34a",
      "#d59a17",
      "#0cb84a",
      "#18d85a",
      "#ffffff",
    ];

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function makeParticle(type) {
      var el = document.createElement("div");
      el.className = "gdl-cash-particle " + type;

      el.style.left = rand(0, 100) + "%";
      el.style.setProperty("--delay", "-" + rand(0, 7).toFixed(2) + "s");
      el.style.setProperty("--drift", rand(-70, 70).toFixed(0) + "px");
      el.style.setProperty("--spin", rand(180, 760).toFixed(0) + "deg");
      el.style.setProperty("--opacity", rand(0.2, 0.58).toFixed(2));

      if (type === "gdl-cash-dollar") {
        el.style.setProperty("--size", rand(38, 72).toFixed(0) + "px");
        el.style.setProperty("--duration", rand(6.2, 10).toFixed(2) + "s");
      }

      if (type === "gdl-cash-coin") {
        el.style.setProperty("--size", rand(16, 32).toFixed(0) + "px");
        el.style.setProperty("--duration", rand(4.2, 7).toFixed(2) + "s");
      }

      if (type === "gdl-cash-confetti") {
        el.style.setProperty("--w", rand(6, 14).toFixed(0) + "px");
        el.style.setProperty("--h", rand(3, 6).toFixed(0) + "px");
        el.style.setProperty("--rot", rand(0, 360).toFixed(0) + "deg");
        el.style.setProperty("--duration", rand(4.4, 7).toFixed(2) + "s");
        el.style.setProperty(
          "--color",
          confettiColors[Math.floor(Math.random() * confettiColors.length)],
        );
      }

      return el;
    }

    layers.forEach(function (layer) {
      for (var i = 0; i < dollarNum; i++) {
        layer.appendChild(makeParticle("gdl-cash-dollar"));
      }

      for (var j = 0; j < coinNum; j++) {
        layer.appendChild(makeParticle("gdl-cash-coin"));
      }

      for (var k = 0; k < confettiNum; k++) {
        layer.appendChild(makeParticle("gdl-cash-confetti"));
      }
    });
  })();
</script>
