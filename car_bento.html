<style>
  @import url("https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap");

  /* ===== Section Base ===== */
  .bento-section {
    font-family:
      "Inter",
      system-ui,
      -apple-system,
      sans-serif;
    padding: 0px 0px;
    box-sizing: border-box;
  }

  .bento-section *,
  .bento-section *::before,
  .bento-section *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  /* ===== Grid (MOBILE FIRST) ===== */
  .bento-grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 2 cols on mobile */
    grid-template-rows: repeat(3, auto); /* 3 rows */
    gap: 12px;
  }

  /* Reset spans on mobile */
  .bento-card {
    grid-column: auto;
    grid-row: auto;
    min-height: 30vh;
  }

  /* ===== Card Base ===== */
  .bento-card {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    box-shadow:
      0 4px 20px rgba(0, 0, 0, 0.12),
      0 1px 4px rgba(0, 0, 0, 0.08);
    transition:
      transform 0.3s ease,
      box-shadow 0.3s ease;
  }

  /* Gradient overlay */
  .bento-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(0, 0, 0, 0.78) 0%,
      rgba(0, 0, 0, 0.3) 40%,
      transparent 70%
    );
    border-radius: 10px;
    pointer-events: none;
    z-index: 1;
  }

  /* ===== Card Content ===== */
  .bento-card-content {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 18px;
    z-index: 2;
  }

  .bento-card-title {
    font-size: clamp(16px, 2.5vw, 22px);
    font-weight: 800;
    color: #fff;
    line-height: 1.25;
    margin-bottom: 4px;
  }

  .bento-card-subtitle {
    font-size: clamp(12px, 1.8vw, 15px);
    font-weight: 500;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.4;
  }

  /* ===== Desktop Layout ===== */
  @media (min-width: 900px) {
    .bento-section {
      padding: 0px 0px;
    }

    .bento-grid {
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: auto auto auto;
      gap: 18px;
    }

    .bento-card:hover {
      transform: scale(1.02);
      box-shadow:
        0 12px 36px rgba(0, 0, 0, 0.2),
        0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .bento-card-one {
      grid-column: 1 / 4;
      grid-row: 1 / 3;
      min-height: 60vh;
    }

    .bento-card-two {
      grid-column: 4 / 8;
      grid-row: 1 / 2;
    }

    .bento-card-three {
      grid-column: 4 / 6;
      grid-row: 2 / 3;
    }

    .bento-card-four {
      grid-column: 6 / 8;
      grid-row: 2 / 3;
    }

    .bento-card-five {
      grid-column: 1 / 4;
      grid-row: 3 / 4;
      min-height: 30vh;
    }

    .bento-card-six {
      grid-column: 4 / 8;
      grid-row: 3 / 4;
    }
  }

  /* ===== Large Screens ===== */
  @media (min-width: 1200px) {
    .bento-section {
      padding: 0px 0px;
    }

    .bento-grid {
      gap: 20px;
    }
  }

  /* ===== Background Images ===== */
  .bento-card-one {
    background-image: url("https://images.clickfunnels.com/de/3c522475114c1a933b17b426e79487/Tire.jpg");
  }

  .bento-card-two {
    background-image: url("https://images.clickfunnels.com/27/76e2d5ef1f47c6b5d84415aa6452cb/Petrol-Engin.jpg");
  }

  .bento-card-three {
    background-image: url("https://images.clickfunnels.com/db/c913e4e28947c299a4625fd013765b/TwinDiff.jpg");
  }

  .bento-card-four {
    background-image: url("https://images.clickfunnels.com/30/77256958a5443cad95ae99ba5aff54/TOW.jpg");
  }

  .bento-card-five {
    background-image: url("https://images.clickfunnels.com/60/b42095498d48d2b009c1539912ab60/FOX.jpg");
  }

  .bento-card-six {
    background-image: url("https://images.clickfunnels.com/23/d2b4bde4a842ee80fedb6dca0cd93c/Shutter.jpg");
  }
</style>

<section class="bento-section" aria-label="RAM TRX features">
  <div class="bento-grid">
    <!-- 1 — Left tall card -->
    <div class="bento-card bento-card-one">
      <div class="bento-card-content">
        <h3 class="bento-card-title">Black Rhino Wheels</h3>
        <p class="bento-card-subtitle">37” Maxxis Razr Tyres</p>
      </div>
    </div>

    <!-- 2 — Top span right -->
    <div class="bento-card bento-card-two">
      <div class="bento-card-content">
        <h3 class="bento-card-title">6.2L V8 Petrol Engine</h3>
        <p class="bento-card-subtitle">313kW Power & 624Nm Torque</p>
      </div>
    </div>

    <!-- 3 — Center middle -->
    <div class="bento-card bento-card-three">
      <div class="bento-card-content">
        <h3 class="bento-card-title">Twin Diff Locked</h3>
        <p class="bento-card-subtitle">For those hard-to-get places</p>
      </div>
    </div>

    <!-- 4 — Center right -->
    <div class="bento-card bento-card-four">
      <div class="bento-card-content">
        <h3 class="bento-card-title">4.2T Tow Capacity</h3>
        <p class="bento-card-subtitle">Tow anything you want</p>
      </div>
    </div>

    <!-- 5 — Bottom left -->
    <div class="bento-card bento-card-five">
      <div class="bento-card-content">
        <h3 class="bento-card-title">6-Inch BDS Suspension w/</h3>
        <p class="bento-card-subtitle">Fox 2.5 Elite Shocks</p>
      </div>
    </div>

    <!-- 6 — Bottom span right -->
    <div class="bento-card bento-card-six">
      <div class="bento-card-content">
        <h3 class="bento-card-title">Vikor Roller Shutter &</h3>
        <p class="bento-card-subtitle">Vikor Electric Steps</p>
      </div>
    </div>
  </div>
</section>
