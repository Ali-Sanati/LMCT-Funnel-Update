<!-- Klaviyo Tag -->
<script
  async
  type="text/javascript"
  src="//static.klaviyo.com/onsite/js/S9SGLM/klaviyo.js"
></script>
<script>
  (function () {
    function trackPageView() {
      // Wait until Klaviyo and funnel ID are both ready
      if (!window.klaviyo || !klaviyo.track || !window.fid) {
        return setTimeout(trackPageView, 300);
      }
      var props = {
        url: window.location.href,
        path: window.location.pathname,
        title: document.title || null,
        host: window.location.host,
        funnel_id: window.fid,
      };
      klaviyo.track("Viewed Funnel", props);
      console.log("[Klaviyo] Viewed Funnel");
    }
    if (
      document.readyState === "complete" ||
      document.readyState === "interactive"
    ) {
      trackPageView();
    } else {
      document.addEventListener("DOMContentLoaded", trackPageView);
    }
  })();
</script>
<!-- End Klaviyo -->
