<!-- ============================================
     LMCT+ Petrol - Tier -> Product Sync
     Keeps the checkout product radios aligned
     with the selected susTier tab.
     ============================================ -->
<script>
  (function () {
    var lmctTierProducts = {
      fuel: "5073572",
      full: "5073573",
    };
    var lmctTierSectionId = "susTier";
    var lmctRetryTimer = null;

    function lmctNormalizeTier(tier) {
      return tier === "full" ? "full" : "fuel";
    }

    function lmctGetCurrentTier() {
      var section = document.getElementById(lmctTierSectionId);
      if (!section) return "fuel";
      return lmctNormalizeTier(section.getAttribute("data-tier"));
    }

    function lmctGetProductRadios() {
      return $(
        '.o2step_step2 input[name="purchase[product_id]"], [data-de-type="orpo"] input[name="purchase[product_id]"]',
      ).not("#cfAR input");
    }

    function lmctScheduleRetry(tier) {
      clearTimeout(lmctRetryTimer);
      lmctRetryTimer = setTimeout(function () {
        lmctSelectTierProduct(tier);
      }, 200);
    }

    function lmctSelectTierProduct(tier) {
      var normalizedTier = lmctNormalizeTier(tier);
      var productId = lmctTierProducts[normalizedTier];
      var $allRadios = lmctGetProductRadios();

      if (!productId) return;

      if (!$allRadios.length) {
        lmctScheduleRetry(normalizedTier);
        return;
      }

      clearTimeout(lmctRetryTimer);

      $allRadios.each(function () {
        var $radio = $(this);
        var isMatch = $radio.val() === productId;
        var $row = $radio.closest(".elOrderProductOptinProducts");

        if ($row.length) {
          $row.toggle(isMatch);
          $row.removeClass("checked-item");
        }

        if (!isMatch) {
          $radio.prop("checked", false);
        }
      });

      var $targetRadio = $allRadios
        .filter('[value="' + productId + '"]')
        .first();
      if (!$targetRadio.length) return;

      $targetRadio.prop("checked", true).trigger("change").trigger("click");
      $targetRadio
        .closest(".elOrderProductOptinProducts")
        .addClass("checked-item");

      $('#cfAR input[name="purchase[product_ids][]"]').each(function () {
        $(this).prop("checked", $(this).val() === productId);
      });

      document.body.setAttribute("data-lmct-tier", normalizedTier);

      if (typeof rebuildOrderSummary === "function") {
        rebuildOrderSummary();
      }

      $(document).trigger("cfpt:cart-updated");
    }

    function lmctSyncFromTier(tier) {
      lmctSelectTierProduct(tier || lmctGetCurrentTier());
    }

    function lmctBindTierSection() {
      var section = document.getElementById(lmctTierSectionId);
      if (!section) return;

      section.addEventListener("tierchange", function (event) {
        lmctSyncFromTier(event.detail && event.detail.tier);
      });

      section.addEventListener("click", function (event) {
        var button = event.target.closest(".sus-toggle-btn");
        if (!button) return;

        setTimeout(function () {
          lmctSyncFromTier(button.getAttribute("data-tier-target"));
        }, 0);
      });

      if (window.MutationObserver) {
        var observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            if (mutation.attributeName === "data-tier") {
              lmctSyncFromTier(section.getAttribute("data-tier"));
            }
          });
        });

        observer.observe(section, {
          attributes: true,
          attributeFilter: ["data-tier"],
        });
      }
    }

    $(function () {
      lmctBindTierSection();

      setTimeout(function () {
        lmctSyncFromTier();
      }, 400);
    });

    $(document).on(
      "click",
      '.o2step_step1 a, .o2step_step1 button, .o2step_step1 input[type="submit"]',
      function () {
        setTimeout(function () {
          lmctSyncFromTier();
        }, 350);
      },
    );
  })();
</script>

<script>
  /**************************
   * Move Apple Pay / Android Pay element into Step 2 of the 2-step order form,
   * positioned BELOW the credit card form as an express checkout option.
   **************************/
  $(function () {
    var applePaySelector = "#tmp_oapap-74616";
    var step2CardFormSelector =
      "#tmp_order2step-95906 .o2step_step2 .elCreditCardForm";

    function moveApplePay() {
      var $applePay = $(applePaySelector);
      var $target = $(step2CardFormSelector);

      if (
        $applePay.length &&
        $target.length &&
        !$target.next(".express-checkout-wrap").length
      ) {
        var $wrap = $('<div class="express-checkout-wrap"></div>');
        var $label = $(
          '<div class="express-checkout-label"><span>OR EXPRESS CHECKOUT</span></div>',
        );
        $wrap.append($label);
        $target.after($wrap);
        $applePay.appendTo($wrap);
      }
    }

    // Initial move
    moveApplePay();

    // Re-check when user clicks the step 1 continue button (step 2 becomes visible)
    $(document).on(
      "click",
      '.o2step_step1 a, .o2step_step1 button, .o2step_step1 input[type="submit"]',
      function () {
        setTimeout(moveApplePay, 300);
        setTimeout(moveApplePay, 800);
      },
    );

  var $summTemplate = null;

  $(function () {
    //set default value to kill bug in L&E JS
    window.cfpe = window.cfpe || {};
    window.cfpe.orderTotal = window.cfpe.orderTotal || 0;

    window.cfptOrderTotal = null;

    setSummaryTemplate();

    $("#bump-offer").off();

    rebuildOrderSummary();
    $(document).on(
      "change",
      '.qty_select, .o2step_step2 [name="purchase[product_id]"], [data-de-type="orpo"] [name="purchase[product_id]"], #bump-offer',
      function (ev) {
        $('#bump-offer, [id*="bump_offer_"]').each(function () {
          var bumpId = $(this).val();

          if ($(this).is(":checked")) {
            $(
              '#cfAR [name="purchase[product_ids][]"][value="' + bumpId + '"]',
            ).attr("checked", true);
          } else {
            $(
              '#cfAR [name="purchase[product_ids][]"][value="' + bumpId + '"]',
            ).attr("checked", false);
          }
        });
        rebuildOrderSummary();
      },
    );
    $(document).on("cfpt:cart-updated", function () {
      rebuildOrderSummary();
    });
  });

  function setSummaryTemplate() {
    $('[data-de-type="ors"], .elOrderProductOptions:not(:has(input,select))')
      .first()
      .attr("data-title", "cf-order-summary");

    $summTemplate = $(
      '[data-title="cf-order-summary"] .elOrderProductOptinProducts',
    )
      .first()
      .clone();
  }

  function rebuildOrderSummary() {
    var cfpt = window.CFPT || {};
    var prodPrices = cfpt.prodPrices || {};
    var freePriceDisplay = cfpt.freePriceDisplay || null;
    var orderTotalLabel = cfpt.orderTotalLabel || null;
    var prodSelParent = '[data-de-type="orpo"]';
    var appendTo = '[data-title="cf-order-summary"] .elOrderProductOptions';

    var cartMode = $(".qty_select").length ? true : false;

    if ($(".o2step_wrapper").length > 0) {
      prodSelParent = ".o2step_step2";
      appendTo = '[data-title="cf-order-summary"]';
    }

    if (!$summTemplate) {
      setSummaryTemplate();
    }

    $('[data-title="cf-order-summary"]').hide();
    if (
      $('[data-title="cf-order-summary"] .qty-head').length == 0 &&
      $(".qty_select").length > 0
    ) {
      if ($("table.elOrderProductOptions").length > 0) {
        //this is the new way
        $('[data-title="cf-order-summary"] .elOrderProductOptinItem').prepend(
          '<span class="pull-left qty-head">Qty</span>',
        );
        appendTo = '[data-title="cf-order-summary"] tbody';
      } else {
        $(
          '[data-title="cf-order-summary"] .elOrderProductOptinLabel .elOrderProductOptinItem',
        ).before('<div class="pull-left qty-head">Qty</div>');
      }
    }

    var orderTotal = 0.0;
    var orderCurrency = "AUD"; //default

    $('[data-title="cf-order-summary"] .elOrderProductOptinProducts').remove();

    window.cfptCartProds = {};
    $('#cfAR [name="purchase[product_ids][]"]:checked').each(function () {
      var prodId = $(this).val();

      if (window.cfptCartProds.hasOwnProperty(prodId)) {
        window.cfptCartProds[prodId].qty++;
      } else {
        window.cfptCartProds[prodId] = { qty: 1 };
      }
    });

    //$('#cfAR [name="purchase[product_ids][]"]:checked').each(function () {
    $.each(window.cfptCartProds, function (index, value) {
      var qty = value.qty;
      var prodId = index;

      var $prodItem = $(prodSelParent + ' [name="' + prodId + '_qty"]');
      if (!$prodItem.length) {
        $prodItem = $(
          prodSelParent +
            ' [name="purchase[product_id]"][value="' +
            prodId +
            '"]',
        );
      }

      var prodParent = $prodItem.parents("[data-cf-product-template]").first();
      var prodDesc = prodParent.find("[data-cf-product-name]").html();
      var prodPriceStr = prodParent.find("[data-cf-product-price]").html();
      if (prodPrices.hasOwnProperty(prodId)) {
        var prodPriceNum = prodPrices[prodId].toFixed(2);
      } else {
        var prodPriceNum = parseFloat(
          prodPriceStr.replace(/[^0-9\.]+/g, ""),
        ).toFixed(2);
      }
      var subTotal = qty * prodPriceNum;
      var currency = prodParent
        .find("[data-cf-product-price]")
        .attr("taxamo-currency");
      orderCurrency = currency;

      $currTemplate = $summTemplate.clone();
      $currTemplate.attr("data-product_id", prodId);
      $currTemplate.attr("data-quantity", qty);

      var prodName = prodDesc;
      if ($(".qty_select").length > 0) {
        prodName = '<span class="prodQty">' + qty + "</span>" + prodDesc;
      }
      $currTemplate.find(".product-name").html(prodName);
      if (freePriceDisplay && subTotal == 0) {
        $currTemplate
          .find(".product-price")
          .attr("taxamo-currency", currency)
          .html(freePriceDisplay);
        $currTemplate.attr("data-subtotal", freePriceDisplay);
      } else {
        var priceDisplay = subTotal.toLocaleString(undefined, {
          style: "currency",
          currency: currency,
        });
        $currTemplate
          .find(".product-price")
          .attr("taxamo-currency", currency)
          .html(priceDisplay);
        $currTemplate.attr("data-subtotal", priceDisplay);
      }

      $currTemplate.appendTo($(appendTo));

      orderTotal += subTotal;
    });

    if (orderTotal) {
      $ttlTemplate = $summTemplate.clone();

      $ttlTemplate
        .addClass("cf-order-total-row")
        .css({ "border-top": "1px solid #DDD", "margin-top": ".5em" });
      $ttlTemplate.find(".product-name").html(orderTotalLabel);
      $ttlTemplate
        .find(".product-price")
        .attr("taxamo-currency", orderCurrency)
        .html(
          orderTotal.toLocaleString(undefined, {
            style: "currency",
            currency: orderCurrency,
          }),
        );
      $ttlTemplate.appendTo($(appendTo));

      $('[data-title="cf-order-summary"]').show();
      window.cfptOrderTotal = orderTotal;
    } else {
      $('[data-title="cf-order-summary"]').hide();
      window.cfptOrderTotal = null;
    }
  }
</script>

      //$(phoneField).removeClass("error");
      $(errorMsg).text();
      $(errorMsg).addClass("hide").removeClass("errorMsg");

          $(phoneField).css({
            "border-color": "#b91517",
