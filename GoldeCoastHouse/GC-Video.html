<style>
  .gcHouseVideo,
  .gcHouseVideo * {
    box-sizing: border-box;
  }

  .gcHouseVideo {
    --gc-video-ink: #182321;
    --gc-video-muted: #64706d;
    --gc-video-sea: #0e7180;
    --gc-video-sun: #d9a441;
    width: 100%;
    /* padding: clamp(12px, 2.5vw, 30px); */
    /* background: linear-gradient(135deg, #eaf7f7 0%, #f3f7f4 48%, #f8f3e8 100%); */
    color: var(--gc-video-ink);
    font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  }

  .gcHouseVideoShell {
    max-width: 1220px;
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid rgba(24, 35, 33, 0.08);
    border-radius: 8px;
    background: #ffffff;
    box-shadow: 0 22px 60px rgba(31, 67, 65, 0.14);
  }

  .gcHouseVideoHeader {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 32px;
    padding: clamp(24px, 4vw, 44px);
  }

  .gcHouseVideoIntro {
    max-width: 720px;
  }

  .gcHouseVideoEyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 11px;
    color: #095360;
    font-size: 11px;
    font-weight: 800;
    line-height: 1.4;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .gcHouseVideoEyebrow::before {
    content: "";
    width: 28px;
    height: 2px;
    flex: 0 0 auto;
    background: var(--gc-video-sun);
  }

  .gcHouseVideoTitle {
    margin: 0;
    color: var(--gc-video-ink);
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: 0;
  }

  .gcHouseVideoCopy {
    margin: 12px 0 0;
    color: var(--gc-video-muted);
    font-size: 14px;
    font-weight: 500;
    line-height: 1.55;
  }

  .gcHouseVideoFacts {
    display: flex;
    flex: 0 0 auto;
    align-items: center;
    gap: 16px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .gcHouseVideoFact {
    min-width: 68px;
    padding-left: 14px;
    border-left: 1px solid #dce5e2;
  }

  .gcHouseVideoFact strong,
  .gcHouseVideoFact span {
    display: block;
  }

  .gcHouseVideoFact strong {
    color: var(--gc-video-ink);
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
  }

  .gcHouseVideoFact span {
    margin-top: 5px;
    color: var(--gc-video-muted);
    font-size: 9px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .gcHouseVideoFrame {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #071111;
  }

  .gcHouseVideoFrame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    border: 0;
  }

  .gcHouseVideoFooter {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 18px clamp(22px, 3.5vw, 40px);
    border-top: 1px solid rgba(24, 35, 33, 0.08);
    color: var(--gc-video-muted);
    font-size: 11px;
    font-weight: 700;
    line-height: 1.4;
  }

  .gcHouseVideoLocation {
    color: var(--gc-video-sea);
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  @media (max-width: 760px) {
    .gcHouseVideo {
      padding: 10px;
    }

    .gcHouseVideoHeader {
      display: block;
      padding: 28px 20px 24px;
    }

    .gcHouseVideoFacts {
      margin-top: 22px;
    }

    .gcHouseVideoFooter {
      align-items: flex-start;
      flex-direction: column;
      padding: 16px 20px;
    }
  }

  @media (max-width: 430px) {
    .gcHouseVideoFacts {
      gap: 10px;
    }

    .gcHouseVideoFact {
      min-width: 0;
      flex: 1 1 0;
      padding-left: 10px;
    }

    .gcHouseVideoFact strong {
      font-size: 18px;
    }
  }
</style>
