<!-- ============================================
     LMCT+ Petrol — Tier → Product Sync
     Wires the susTier toggle to the order form's
     product radios. Hides the non-matching product
     so only the selected tier's product is visible.
     ============================================ -->
<script>
  (function () {
    /* Product map — tier slug to ClickFunnels product ID */
    var lmctTierProducts = {
      fuel: "5073572", // Save On Fuel — $99/year
      full: "5073573", // Save + Win — $199/year
    };

    /* Show only the product matching the current tier,
     hide all others, and select the matching radio. */
    function lmctSelectTierProduct(tier) {
      var pid = lmctTierProducts[tier];
      if (!pid) return;

      /* Find all product rows in step 2 (excluding the hidden #cfAR form) */
      var $allRadios = $(
        '.o2step_step2 input[name="purchase[product_id]"]',
      ).not("#cfAR input");

      if (!$allRadios.length) {
        /* Step 2 not in DOM yet — retry */
        setTimeout(function () {
          lmctSelectTierProduct(tier);
        }, 200);
        return;
      }

      /* Show / hide product rows */
      $allRadios.each(function () {
        var $row = $(this).closest(".elOrderProductOptinProducts");
        if ($(this).val() === pid) {
          $row.show();
        } else {
          $row.hide();
          $(this).prop("checked", false);
        }
      });

      /* Check the matching radio */
      var $radio = $allRadios.filter('[value="' + pid + '"]').first();
      if (!$radio.is(":checked")) {
        $radio.prop("checked", true).trigger("change").trigger("click");
      }

      /* Update visual "checked-item" outline */
      $(".elOrderProductOptinProducts").removeClass("checked-item");
      $radio.closest(".elOrderProductOptinProducts").addClass("checked-item");

      /* Sync hidden #cfAR replica form so the right product
       is submitted regardless of which form CF reads from */
      $('#cfAR input[name="purchase[product_ids][]"]').each(function () {
        $(this).prop("checked", $(this).val() === pid);
      });

      /* Tag the body so CSS rules (e.g. price label override)
       can react to the active tier */
      document.body.setAttribute("data-lmct-tier", tier);

      /* Trigger order summary rebuild */
      if (typeof rebuildOrderSummary === "function") {
        rebuildOrderSummary();
      }
      $(document).trigger("cfpt:cart-updated");
    }

    /* Read current tier from the susTier section */
    function lmctGetCurrentTier() {
      var section = document.getElementById("susTier");
      if (!section) return "fuel";
      return section.getAttribute("data-tier") || "fuel";
    }

    /* Listen for tierchange event dispatched by Block A toggle */
    var section = document.getElementById("susTier");
    if (section) {
      section.addEventListener("tierchange", function (e) {
        var tier = (e.detail && e.detail.tier) || lmctGetCurrentTier();
        lmctSelectTierProduct(tier);
      });
    }

    /* Initial sync on load */
    $(function () {
      setTimeout(function () {
        lmctSelectTierProduct(lmctGetCurrentTier());
      }, 400);
    });

    /* Re-sync when user advances from step 1 to step 2 */
    $(document).on(
      "click",
      '.o2step_step1 a, .o2step_step1 button, .o2step_step1 input[type="submit"]',
      function () {
        setTimeout(function () {
          lmctSelectTierProduct(lmctGetCurrentTier());
        }, 350);
      },
    );
  })();
</script>
