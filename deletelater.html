<style>
  /* ============================================
   GIVEAWAY DETAILS - LMCT+ LUXE CASH STAGE
   Namespace: gd-
   ============================================ */
  .gd-section,
  .gd-section *,
  .gd-section *::before,
  .gd-section *::after {
    box-sizing: border-box;
    font-family:
      "Montserrat",
      "Inter",
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }

  .gd-section {
    --gd-cream: #fff8d7;
    --gd-gold: #ffd95a;
    --gd-gold-deep: #b88616;
    --gd-green: #85ff61;
    --gd-green-hot: #43ff77;
    --gd-ink: #05130b;
    --gd-panel: rgba(7, 24, 14, 0.72);
    --gd-panel-soft: rgba(255, 255, 255, 0.08);
    --gd-border: rgba(255, 228, 130, 0.34);

    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: clamp(40px, 5vw, 70px) clamp(16px, 4vw, 48px)
      clamp(32px, 4vw, 58px);
    position: relative;
    isolation: isolate;
    overflow: hidden;
    color: #ffffff;
    background: radial-gradient(
        circle at 50% 8%,
        rgba(67, 255, 119, 0.22),
        transparent 28%
      ),
      radial-gradient(
        circle at 16% 24%,
        rgba(255, 218, 85, 0.16),
        transparent 28%
      ),
      radial-gradient(
        circle at 84% 18%,
        rgba(43, 255, 135, 0.14),
        transparent 30%
      ),
      linear-gradient(180deg, #082514 0%, #04170d 46%, #020a06 100%)
      !important;
    border: 1px solid rgba(192, 255, 163, 0.22);
    border-radius: 24px;
    box-shadow:
      0 24px 80px rgba(0, 0, 0, 0.48),
      0 0 0 1px rgba(255, 222, 112, 0.08),
      0 0 42px rgba(67, 255, 119, 0.22),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .gd-section::before {
    content: "";
    position: absolute;
    inset: -28% -18% auto;
    height: 78%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(
        circle at 50% 18%,
        rgba(255, 245, 175, 0.24),
        transparent 18%
      ),
      radial-gradient(
        circle at 28% 48%,
        rgba(72, 255, 130, 0.16),
        transparent 26%
      ),
      radial-gradient(
        circle at 74% 42%,
        rgba(255, 214, 86, 0.12),
        transparent 27%
      );
    filter: blur(18px);
    opacity: 0.95;
    animation: gd-aura-drift 12s ease-in-out infinite alternate;
  }

  .gd-section::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(
        115deg,
        transparent 0%,
        rgba(255, 255, 255, 0.045) 39%,
        rgba(255, 246, 180, 0.1) 48%,
        transparent 58%
      ),
      radial-gradient(
        circle at 50% 112%,
        rgba(0, 0, 0, 0.58),
        transparent 48%
      );
    mix-blend-mode: screen;
    opacity: 0.86;
  }

  .gd-stage {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .gd-stage-line {
    position: absolute;
    left: 50%;
    top: 5%;
    width: min(92%, 880px);
    height: 1px;
    transform: translateX(-50%);
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 224, 112, 0.8),
      rgba(95, 255, 108, 0.64),
      transparent
    );
    box-shadow:
      0 0 22px rgba(255, 214, 86, 0.28),
      0 0 42px rgba(67, 255, 119, 0.18);
  }

  .gd-stage-halo {
    position: absolute;
    left: 50%;
    top: 19%;
    width: min(70vw, 700px);
    height: min(70vw, 700px);
    border-radius: 999px;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(circle, rgba(255, 235, 122, 0.13), transparent 36%),
      conic-gradient(
        from 20deg,
        transparent 0deg,
        rgba(255, 220, 90, 0.28) 52deg,
        transparent 98deg,
        rgba(67, 255, 119, 0.24) 164deg,
        transparent 212deg,
        rgba(255, 220, 90, 0.18) 278deg,
        transparent 360deg
      );
    filter: blur(1px);
    opacity: 0.42;
    animation: gd-halo-turn 18s linear infinite;
  }

  .gd-stage-beam {
    position: absolute;
    top: -24%;
    width: 24vw;
    min-width: 180px;
    max-width: 340px;
    height: 130%;
    opacity: 0.26;
    filter: blur(5px);
    transform-origin: top center;
    background: linear-gradient(
      180deg,
      transparent 0%,
      rgba(255, 238, 160, 0.12) 18%,
      rgba(93, 255, 127, 0.16) 44%,
      rgba(255, 219, 92, 0.08) 74%,
      transparent 100%
    );
    clip-path: polygon(44% 0, 58% 0, 100% 100%, 0 100%);
    mix-blend-mode: screen;
    animation: gd-beam-breathe 9s ease-in-out infinite;
  }

  .gd-stage-beam-1 {
    left: 3%;
    --gd-beam-rotate: -20deg;
    animation-delay: -1.8s;
  }

  .gd-stage-beam-2 {
    right: 4%;
    --gd-beam-rotate: 18deg;
    animation-delay: -5.2s;
  }

  .gd-stage-floor {
    position: absolute;
    left: 50%;
    bottom: -98px;
    width: min(78%, 760px);
    height: 190px;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 1px solid rgba(255, 220, 90, 0.34);
    background:
      radial-gradient(
        ellipse at 50% 34%,
        rgba(133, 255, 97, 0.22),
        transparent 42%
      ),
      radial-gradient(
        ellipse at 50% 50%,
        rgba(255, 220, 90, 0.18),
        transparent 58%
      ),
      linear-gradient(180deg, rgba(6, 29, 14, 0.82), rgba(0, 0, 0, 0));
    box-shadow:
      0 0 34px rgba(133, 255, 97, 0.14),
      inset 0 0 22px rgba(255, 220, 90, 0.1);
  }

  .gd-stage-floor::before,
  .gd-stage-floor::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 22%;
    width: 82%;
    height: 44%;
    transform: translateX(-50%);
    border-radius: 50%;
    border: 1px solid rgba(255, 232, 136, 0.2);
  }

  .gd-stage-floor::after {
    top: 33%;
    width: 58%;
    height: 30%;
    border-color: rgba(133, 255, 97, 0.18);
  }

  .gd-cash-rain-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .gd-wrap {
    position: relative;
    z-index: 2;
  }

  .gd-title {
    position: relative;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto clamp(28px, 4vw, 42px);
    color: var(--gd-cream);
    font-size: clamp(36px, 5.6vw, 68px);
    font-weight: 950;
    line-height: 0.92;
    letter-spacing: 0;
    text-align: center;
    text-transform: uppercase;
    text-wrap: balance;
    background: linear-gradient(
      180deg,
      #fffce8 0%,
      #ffe98c 32%,
      #ffca45 48%,
      #fff5bc 66%,
      #caffaa 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow:
      0 2px 0 rgba(72, 48, 0, 0.58),
      0 0 22px rgba(255, 221, 90, 0.28),
      0 0 42px rgba(67, 255, 119, 0.16);
  }

  .gd-title::before,
  .gd-title::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .gd-title::before {
    bottom: -18px;
    width: min(74%, 440px);
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 221, 90, 0.92),
      rgba(133, 255, 97, 0.8),
      transparent
    );
    box-shadow: 0 0 18px rgba(255, 221, 90, 0.32);
  }

  .gd-title::after {
    bottom: -21px;
    width: 84px;
    height: 7px;
    border-radius: 999px;
    background: linear-gradient(90deg, #fff3b0, var(--gd-green));
    box-shadow:
      0 0 18px rgba(255, 221, 90, 0.42),
      0 0 24px rgba(67, 255, 119, 0.26);
  }

  .gd-winners {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(16px, 2.6vw, 26px);
    margin-bottom: clamp(16px, 2.6vw, 26px);
  }

  .gd-prize-card,
  .gd-info-card {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--gd-border);
    border-radius: 8px;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.12), transparent 18%),
      radial-gradient(
        circle at 50% 0%,
        rgba(255, 221, 90, 0.16),
        transparent 44%
      ),
      linear-gradient(180deg, rgba(9, 32, 19, 0.88), rgba(2, 10, 6, 0.9));
    box-shadow:
      0 18px 42px rgba(0, 0, 0, 0.34),
      0 0 28px rgba(67, 255, 119, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(14px);
  }

  .gd-prize-card::before,
  .gd-info-card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background:
      linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.18),
        transparent 24%,
        transparent 70%,
        rgba(133, 255, 97, 0.08)
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.04) 0 1px,
        transparent 1px 58px
      );
    opacity: 0.5;
    pointer-events: none;
  }

  .gd-prize-card::after,
  .gd-info-card::after {
    content: "";
    position: absolute;
    inset: -40% auto -40% -65%;
    z-index: 0;
    width: 46%;
    transform: skewX(-18deg);
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.18),
      transparent
    );
    opacity: 0;
    animation: gd-card-sheen 7s ease-in-out infinite;
    pointer-events: none;
  }

  .gd-prize-card:nth-child(2)::after {
    animation-delay: -3.4s;
  }

  .gd-prize-card {
    min-height: 300px;
    padding: clamp(28px, 4vw, 42px) clamp(20px, 3vw, 34px)
      clamp(26px, 3.5vw, 36px);
    text-align: center;
  }

  .gd-prize-card > *,
  .gd-info-card > * {
    position: relative;
    z-index: 1;
  }

  .gd-prize-badge,
  .gd-info-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
    margin-bottom: 18px;
    padding: 7px 16px;
    border: 1px solid rgba(255, 226, 120, 0.44);
    border-radius: 999px;
    background:
      linear-gradient(180deg, rgba(255, 230, 132, 0.16), transparent),
      rgba(1, 9, 5, 0.58);
    color: #fff4bd;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1.8px;
    line-height: 1;
    text-transform: uppercase;
    box-shadow:
      0 0 18px rgba(255, 218, 85, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }

  .gd-prize-headline {
    margin: 0 0 8px;
    color: var(--gd-green);
    font-size: clamp(44px, 6vw, 72px);
    font-weight: 950;
    line-height: 0.92;
    letter-spacing: 0;
    white-space: nowrap;
    text-shadow:
      0 0 14px rgba(133, 255, 97, 0.34),
      0 0 34px rgba(67, 255, 119, 0.22),
      0 4px 12px rgba(0, 0, 0, 0.48);
  }

  .gd-prize-sub {
    margin: 0 0 28px;
    color: rgba(255, 255, 255, 0.82);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.9px;
    line-height: 1.25;
    text-transform: uppercase;
  }

  .gd-prize-divider {
    position: relative;
    height: 1px;
    margin: 0 0 27px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 218, 85, 0.52),
      rgba(133, 255, 97, 0.36),
      transparent
    );
  }

  .gd-prize-divider span {
    position: absolute;
    top: 50%;
    left: 50%;
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(255, 228, 130, 0.45);
    border-radius: 999px;
    background:
      radial-gradient(circle at 35% 25%, rgba(255, 255, 255, 0.2), transparent),
      linear-gradient(180deg, #15381f, #061108);
    color: #fff0b0;
    font-size: 12px;
    font-weight: 950;
    letter-spacing: 1.6px;
    box-shadow:
      0 0 18px rgba(255, 218, 85, 0.14),
      0 8px 16px rgba(0, 0, 0, 0.24);
  }

  .gd-prize-alt {
    color: #fff8d7;
    font-size: clamp(16px, 1.9vw, 20px);
    font-weight: 850;
    line-height: 1.3;
    letter-spacing: 0;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.28);
  }

  .gd-info-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(14px, 2.3vw, 22px);
  }

  .gd-info-card {
    min-height: 184px;
    padding: clamp(24px, 3.5vw, 34px) clamp(18px, 3vw, 30px);
    text-align: center;
  }

  .gd-info-pill {
    min-height: 30px;
    margin-bottom: 17px;
    color: #101307;
    background:
      linear-gradient(180deg, #fff5bd, #ffd95a 56%, #ca941a),
      #ffd95a;
    border-color: rgba(255, 246, 190, 0.8);
    box-shadow:
      0 8px 20px rgba(0, 0, 0, 0.22),
      0 0 20px rgba(255, 218, 85, 0.18);
  }

  .gd-info-headline {
    margin: 0 0 6px;
    color: #ffffff;
    font-size: clamp(30px, 4vw, 44px);
    font-weight: 950;
    line-height: 1;
    letter-spacing: 0;
    text-shadow:
      0 0 18px rgba(255, 218, 85, 0.16),
      0 3px 12px rgba(0, 0, 0, 0.36);
  }

  .gd-info-detail {
    margin: 0 0 18px;
    color: var(--gd-green);
    font-size: clamp(15px, 1.8vw, 19px);
    font-weight: 900;
    line-height: 1.22;
    text-shadow: 0 0 14px rgba(133, 255, 97, 0.2);
  }

  .gd-info-meta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    max-width: 100%;
    color: rgba(255, 255, 255, 0.72);
    font-size: 12px;
    font-weight: 650;
    line-height: 1.35;
    letter-spacing: 0;
  }

  .gd-ch7-mark {
    width: 19px;
    height: 19px;
    flex: 0 0 auto;
    display: inline-block;
    vertical-align: middle;
    filter: drop-shadow(0 0 8px rgba(230, 57, 70, 0.35));
  }

  .gd-section a {
    text-decoration: none !important;
  }

  /* ===== FALLING CASH ANIMATION ===== */
  .gd-cash-particle {
    position: absolute;
    top: -120px;
    left: 0;
    pointer-events: none;
    will-change: transform, opacity;
  }

  .gd-cash-dollar {
    width: var(--size, 56px);
    height: calc(var(--size, 56px) * 0.58);
    opacity: var(--opacity, 0.54);
    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;
    transform-origin: center;
    animation: gd-cash-fall var(--duration, 7s) linear infinite;
    animation-delay: var(--delay, 0s);

y="360" r="16"/%3E%3C/g%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3Cg%3E%3C/g%3E%3C/svg%3E%0A');
  }

  .gd-cash-coin {
    width: var(--size, 26px);
    height: var(--size, 26px);
    border-radius: 50%;
    opacity: var(--opacity, 0.72);
    background: radial-gradient(
      circle at 35% 35%,
      #fff6bd 0%,
      #ffd95a 36%,
      #d9a51b 72%,
      #805a00 100%
    );
    box-shadow:
      inset 0 2px 3px rgba(255, 255, 255, 0.5),
      inset 0 -2px 3px rgba(0, 0, 0, 0.2),
      0 5px 12px rgba(0, 0, 0, 0.24),
      0 0 16px rgba(255, 218, 85, 0.16);
    animation: gd-cash-fall-spin var(--duration, 5s) ease-in infinite;
    animation-delay: var(--delay, 0s);
    z-index: 2;
  }

  .gd-cash-coin::before {
    content: "$";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: rgba(78, 54, 0, 0.92);
    font-size: calc(var(--size, 26px) * 0.55);
    font-weight: 950;
  }

  .gd-cash-confetti {
    width: var(--w, 10px);
    height: var(--h, 4px);
    border-radius: 999px;
    opacity: var(--opacity, 0.78);
    background: var(--color, #fff4bd);
    transform: rotate(var(--rot, 0deg));
    animation: gd-confetti-fall var(--duration, 4.8s) ease-out infinite;
    animation-delay: var(--delay, 0s);
    box-shadow: 0 0 12px rgba(255, 218, 85, 0.16);
    z-index: 0;
  }

  @keyframes gd-cash-fall {
    0% {
      transform: translate3d(0, -120px, 0) rotate(0deg);
    }
    100% {
      transform: translate3d(var(--drift, 30px), 108vh, 0)
        rotate(var(--spin, 360deg));
    }
  }

  @keyframes gd-cash-fall-spin {
    0% {
      transform: translate3d(0, -120px, 0) rotateY(0deg) rotate(0deg);
    }
    100% {
      transform: translate3d(var(--drift, 12px), 108vh, 0) rotateY(720deg)
        rotate(var(--spin, 300deg));
    }
  }

  @keyframes gd-confetti-fall {
    0% {
      transform: translate3d(0, -100px, 0) rotate(var(--rot, 0deg));
    }
    100% {
      transform: translate3d(var(--drift, 45px), 108vh, 0)

<script>
  (function () {
    var layers = document.querySelectorAll(".gd-cash-rain-layer");
    if (!layers.length) return;

    var dollarNum = 24;
    var coinNum = 12;
    var confettiNum = 32;
    var confettiColors = [
      "#fff4bd",
      "#ffd95a",
      "#85ff61",
      "#43ff77",
      "#ffffff",
    ];

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function makeParticle(type) {
      var el = document.createElement("div");
      el.className = "gd-cash-particle " + type;

      el.style.left = rand(0, 100) + "%";
      el.style.setProperty("--delay", "-" + rand(0, 7).toFixed(2) + "s");
      el.style.setProperty("--drift", rand(-70, 70).toFixed(0) + "px");
      el.style.setProperty("--spin", rand(180, 760).toFixed(0) + "deg");
      el.style.setProperty("--opacity", rand(0.28, 0.78).toFixed(2));

      if (type === "gd-cash-dollar") {
        el.style.setProperty("--size", rand(38, 72).toFixed(0) + "px");
        el.style.setProperty("--duration", rand(6.2, 10).toFixed(2) + "s");
      }

      if (type === "gd-cash-coin") {
        el.style.setProperty("--size", rand(16, 32).toFixed(0) + "px");
        el.style.setProperty("--duration", rand(4.2, 7).toFixed(2) + "s");
      }

      if (type === "gd-cash-confetti") {
        el.style.setProperty("--w", rand(6, 14).toFixed(0) + "px");
        el.style.setProperty("--h", rand(3, 6).toFixed(0) + "px");
        el.style.setProperty("--rot", rand(0, 360).toFixed(0) + "deg");
        el.style.setProperty("--duration", rand(4.4, 7).toFixed(2) + "s");
        el.style.setProperty(
          "--color",
          confettiColors[Math.floor(Math.random() * confettiColors.length)],
        );
      }

      return el;
    }

    layers.forEach(function (layer) {
      for (var i = 0; i < dollarNum; i++) {
        layer.appendChild(makeParticle("gd-cash-dollar"));
      }

      for (var j = 0; j < coinNum; j++) {
        layer.appendChild(makeParticle("gd-cash-coin"));
      }

      for (var k = 0; k < confettiNum; k++) {
        layer.appendChild(makeParticle("gd-cash-confetti"));
      }
    });
  })();
</script>
