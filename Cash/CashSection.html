<style>

  }
  .cdCashLmctNotifIcon {

    background: #ffffff;
    border-radius: 18px;

  .cdCashLmctNotifIcon img {
    width: 100%;
    height: 100%;

    object-fit: contain;
  }
  .cdCashLmctNotifBody {
    flex: 1;
    min-width: 0;
  }
  .cdCashLmctNotifHead {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 6px;
  }
  .cdCashLmctNotifTitle {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    font-size: clamp(22px, 3vw, 32px);
    line-height: 1;
    font-weight: 800;
    color: #000;
    letter-spacing: -0.01em;
  }
  .cdCashLmctNotifLogo {
    display: block;
    width: auto;
    height: clamp(24px, 3.2vw, 36px);
    max-width: 190px;
    object-fit: contain;
  }
  .cdCashLmctNotifTime {
    flex-shrink: 0;
    padding-top: 2px;
    font-size: clamp(15px, 2vw, 21px);
    color: #111111;
    font-weight: 400;
  }
  .cdCashLmctNotifText {
    font-size: clamp(19px, 2.6vw, 28px);
    color: #000000;
    line-height: 1.25;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .cdCashLmctNotifAmt {
    display: inline-block;
    padding: 0 5px;
    color: #ffffff;
    background: #169fe6;
    font-weight: 600;
  }
  /* ===== Falling Cash Effect ===== */
  .cdCashLmctRainLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .cdCashLmctParticle {
    position: absolute;
    top: -120px;
    left: 0;
    pointer-events: none;
    will-change: transform, opacity;
  }

    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;

    animation-delay: var(--delay, 0s);
    background-image: url('data:image/svg+xml,%3Csvg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"%3E%3Cg%3E%3Cpath style="fill:%2374D24F;" d="M496,112H16c-8.82,0-16,7.18-16,16v256c0,8.82,7.18,16,16,16h480c8.82,0,16-7.18,16-16V128C512,119.18,504.82,112,496,112z"/%3E%3Cpath style="fill:%23FFEFBC;" d="M472,192c-22.055,0-40-17.945-40-40c0-4.422-3.578-8-8-8H88c-4.422,0-8,3.578-8,8c0,22.055-17.945,40-40,40c-4.422,0-8,3.578-8,8v112c0,4.422,3.578,8,8,8c22.055,0,40,17.945,40,40c0,4.422,3.578,8,8,8h336c4.422,0,8-3.578,8-8c0-22.055,17.945-40,40-40c4.422,0,8-3.578,8-8V200C480,195.578,476.422,192,472,192z"/%3E%3Cpath style="fill:%23869B55;" d="M128,256c0,48.221,26.691,90.175,66.081,112h123.839C357.309,346.175,384,304.221,384,256s-26.691-90.175-66.081-112H194.08C154.691,165.825,128,207.779,128,256z"/%3E%3Cpath style="fill:%23FFEFBC;" d="M256,244c-16.023,0-28-8.445-28-16c0-7.555,11.977-16,28-16s28,8.445,28,16c0,6.625,5.375,12,12,12s12-5.375,12-12c0-19.236-16.824-34.862-40-38.932V184c0-6.625-5.375-12-12-12s-12,5.375-12,12v5.068c-23.176,4.07-40,19.695-40,38.932c0,22.43,22.844,40,52,40c16.023,0,28,8.445,28,16c0,7.555-11.977,16-28,16s-28-8.445-28-16c0-6.625-5.375-12-12-12s-12,5.375-12,12c0,19.236,16.824,34.862,40,38.932V328c0,6.625,5.375,12,12,12s12-5.375,12-12v-5.068c23.176-4.07,40-19.695,40-38.932C308,261.57,285.156,244,256,244z"/%3E%3Ccircle style="fill:%2374D24F;" cx="80" cy="256" r="24"/%3E%3Ccircle style="fill:%2374D24F;" cx="432" cy="256" r="24"/%3E%3Ccircle style="fill:%23869B55;" cx="40" cy="152" r="16"/%3E%3Ccircle style="fill:%23869B55;" cx="472" cy="152" r="16"/%3E%3Ccircle style="fill:%23869B55;" cx="40" cy="360" r="16"/%3E%3Ccircle style="fill:%23869B55;" cx="472" cy="360" r="16"/%3E%3C/g%3E%3C/svg%3E');
  }
  .cdCashLmctCoin {
    width: var(--size, 24px);
    height: var(--size, 24px);
    border-radius: 999px;
    opacity: var(--opacity, 0.75);
    background: radial-gradient(
      circle at 35% 35%,
      #fff3a6 0%,
      #ffd700 38%,
      #d4a514 72%,
      #9b7400 100%
    );
    box-shadow:
      inset 0 2px 3px rgba(255, 255, 255, 0.45),
      inset 0 -2px 3px rgba(0, 0, 0, 0.18),
      0 4px 10px rgba(0, 0, 0, 0.18);
    animation: cdCashLmctFallSpin var(--duration, 5s) ease-in infinite;
    animation-delay: var(--delay, 0s);
  }
  .cdCashLmctCoin::before {
    content: "$";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: calc(var(--size, 24px) * 0.55);
    font-weight: 900;
    color: rgba(80, 55, 0, 0.9);
  }
  @keyframes cdCashLmctFall {
    0% {
      transform: translate3d(0, -120px, 0) rotate(0deg);
    }
    100% {
      transform: translate3d(var(--drift, 30px), 115vh, 0)
        rotate(var(--spin, 360deg));
    }
  }
  @keyframes cdCashLmctFallSpin {
    0% {
      transform: translate3d(0, -120px, 0) rotateY(0deg) rotate(0deg);
    }
    100% {
      transform: translate3d(var(--drift, 12px), 115vh, 0)
        rotateY(720deg)
        rotate(var(--spin, 300deg));
    }
  }
  @media (max-width: 767px) {
    .cdCashLmctWrap {
      padding: 38px 16px;
      border-radius: 18px;
    }
    .cdCashLmctDollar {
      opacity: 0.42;
    }
    .cdCashLmctCoin {
      opacity: 0.5;
    }
    .cdCashLmctNotif {
      margin-top: 22px;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 20px;
    }
    .cdCashLmctNotifIcon {
      width: 58px;
      height: 58px;
      padding: 7px;
      border-radius: 12px;
    }
    .cdCashLmctNotifHead {
      gap: 8px;
      margin-bottom: 4px;
    }
    .cdCashLmctNotifTitle {
      gap: 5px;
      font-size: clamp(16px, 5vw, 22px);
    }
    .cdCashLmctNotifLogo {
      height: clamp(18px, 5.6vw, 25px);
      max-width: 118px;
    }
    .cdCashLmctNotifTime {
      font-size: 12px;
    }
    .cdCashLmctNotifText {
      font-size: clamp(13px, 4vw, 17px);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .cdCashLmctDollar,
    .cdCashLmctCoin {
      animation: none !important;
    }
  }
</style>
<div class="cdCashLmctWrap" id="cdCashLmctRoot">
  <div class="cdCashLmctInner">
    <span class="cdCashLmctKicker">Or You Can Take</span>
    <div class="cdCashLmctAmount" aria-label="$70,000">
      $<span class="cdCashLmctSlot" data-final="7">0</span><span class="cdCashLmctSlot" data-final="0">0</span>,<span class="cdCashLmctSlot" data-final="0">0</span><span class="cdCashLmctSlot" data-final="0">0</span><span class="cdCashLmctSlot" data-final="0">0</span>
    </div>
    <div class="cdCashLmctNotif" id="cdCashLmctNotif">
      <div class="cdCashLmctNotifIcon">
        <img src="https://images.clickfunnels.com/90/3b47f9f777411cb4e04db2a1cf9327/lmct_icon.png" alt="" />
      </div>
      <div class="cdCashLmctNotifBody">
        <div class="cdCashLmctNotifHead">
          <span class="cdCashLmctNotifTitle">
            Bank of
            <img class="cdCashLmctNotifLogo" src="https://images.clickfunnels.com/12/27020b5aa843dcae99b04c65edbc00/lmct-black-logo.png" alt="LMCT+" />
          </span>
          <span class="cdCashLmctNotifTime">1m ago</span>
        </div>
        <div class="cdCashLmctNotifText">
          You've been paid <span class="cdCashLmctNotifAmt">$200,000</span>
          into your account ending in 0823
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  window.addEventListener("load", function () {
    var cdCashLmctRoot = document.getElementById("cdCashLmctRoot");
    if (!cdCashLmctRoot) return;
    var cdCashLmctSlots = cdCashLmctRoot.querySelectorAll(".cdCashLmctSlot");
    var cdCashLmctNotif = document.getElementById("cdCashLmctNotif");
    var cdCashLmctStarted = false;
    function cdCashLmctCreateRain(root) {
      if (!root || root.querySelector(".cdCashLmctRainLayer")) return;
      var layer = document.createElement("div");
      layer.className = "cdCashLmctRainLayer";
      layer.setAttribute("aria-hidden", "true");
      root.insertBefore(layer, root.firstChild);
      var isMobile = window.matchMedia("(max-width: 767px)").matches;
      var dollarCount = isMobile ? 12 : 24;
      var coinCount = isMobile ? 8 : 16;
      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }
      function createParticle(type) {
        var el = document.createElement("div");
        el.className = "cdCashLmctParticle " + type;
        el.style.left = rand(0, 100).toFixed(2) + "%";
        el.style.setProperty("--delay", rand(0, 5.5).toFixed(2) + "s");
        el.style.setProperty("--drift", rand(-75, 75).toFixed(0) + "px");
        el.style.setProperty("--spin", rand(180, 780).toFixed(0) + "deg");
        el.style.setProperty("--opacity", rand(0.42, 0.92).toFixed(2));
        if (type === "cdCashLmctDollar") {
          el.style.setProperty(
            "--size",
            rand(isMobile ? 32 : 42, isMobile ? 54 : 78).toFixed(0) + "px"
          );
          el.style.setProperty(
            "--duration",
            rand(5.5, 9.5).toFixed(2) + "s"
          );
        }
        if (type === "cdCashLmctCoin") {
          el.style.setProperty(
            "--size",
            rand(isMobile ? 16 : 18, isMobile ? 26 : 34).toFixed(0) + "px"
          );
          el.style.setProperty(
            "--duration",
            rand(3.6, 6.4).toFixed(2) + "s"
          );
        }
        return el;
      }
      for (var i = 0; i < dollarCount; i++) {
        layer.appendChild(createParticle("cdCashLmctDollar"));
      }
      for (var j = 0; j < coinCount; j++) {
        layer.appendChild(createParticle("cdCashLmctCoin"));
      }
    }
    function cdCashLmctSpin(slot, idx) {
      var final = slot.getAttribute("data-final");
      var duration = 700 + idx * 200;
      var start = Date.now();
      var timer = setInterval(function () {
        var elapsed = Date.now() - start;
        if (elapsed >= duration) {
          slot.textContent = final;
          clearInterval(timer);
        } else {
          slot.textContent = Math.floor(Math.random() * 10);
        }
      }, 40);
    }
    function cdCashLmctRun() {
      if (cdCashLmctStarted) return;
      cdCashLmctStarted = true;
      cdCashLmctCreateRain(cdCashLmctRoot);
      cdCashLmctSlots.forEach(function (slot, i) {
        cdCashLmctSpin(slot, i);
      });
      setTimeout(function () {
        if (cdCashLmctNotif) {
          cdCashLmctNotif.classList.add("cdCashLmctNotifIn");
        }
      }, 1700);
    }
    if (!("IntersectionObserver" in window)) {
      setTimeout(cdCashLmctRun, 200);
      return;
    }
    var cdCashLmctObs = new IntersectionObserver(
      function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            cdCashLmctRun();
            cdCashLmctObs.unobserve(e.target);
          }
        });
      },
      { threshold: 0.3 }
    );
    cdCashLmctObs.observe(cdCashLmctRoot);
  });
</script>
