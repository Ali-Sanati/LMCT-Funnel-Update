<script>
(function () {
  const COMPANY_ID = 'S9SGLM';
  const LIST_ID = 'S4vMmy';

  function read(key) {
    return (localStorage.getItem(key) || '').trim();
  }

  function normalizePhone(value) {
    let phone = value.replace(/[^\d+]/g, '');

    // Australian mobile: 0423 232 323 → +61423232323
    if (/^04\d{8}$/.test(phone)) {
      phone = '+61' + phone.slice(1);
    } else if (/^614\d{8}$/.test(phone)) {
      phone = '+' + phone;
    }

    return phone;
  }

  async function sendToKlaviyo() {
    try {
      const email = read('garlic:lmctgiveaway.com*>input.email');
      const name = read('garlic:lmctgiveaway.com*>input.name');
      const rawPhone = read('garlic:lmctgiveaway.com*>input.phone');
      const hashId = read('lmct_unique_hash');

      if (!email) {
        console.warn('Klaviyo: no stored email found.');
        return;
      }

      const sentKey = 'lmct_klaviyo_sent_' + LIST_ID;
      const signature = JSON.stringify([email, name, rawPhone, hashId]);

      // Avoid sending the same details again in this browser session.
      if (sessionStorage.getItem(sentKey) === signature) return;

      const nameParts = name.split(/\s+/).filter(Boolean);

      const attributes = {
        email: email,
        first_name: nameParts[0] || '',
        last_name: nameParts.slice(1).join(' '),
        properties: {
          full_name: name,
          phone_raw: rawPhone,
          lmct_unique_hash: hashId
        },
        subscriptions: {
          email: {
            marketing: {
              consent: 'SUBSCRIBED'
            }
          }
        }
      };

      const phone = normalizePhone(rawPhone);

      if (/^\+[1-9]\d{7,14}$/.test(phone)) {
        attributes.phone_number = phone;
      }

      const response = await fetch(
        'https://a.klaviyo.com/client/subscriptions/?company_id=' + COMPANY_ID,
        {
          method: 'POST',
          keepalive: true,
          headers: {
            'Content-Type': 'application/json',
            'revision': '2025-07-15'
          },
          body: JSON.stringify({
            data: {
              type: 'subscription',
              attributes: {
                custom_source: 'LMCT+ ClickFunnels',
                profile: {
                  data: {
                    type: 'profile',
                    attributes: attributes
                  }
                }
              },
              relationships: {
                list: {
                  data: {
                    type: 'list',
                    id: LIST_ID
                  }
                }
              }
            }
          })
        }
      );

      if (!response.ok) {
        throw new Error(
          'HTTP ' + response.status + ': ' + await response.text()
        );
      }

      sessionStorage.setItem(sentKey, signature);
      console.log('Klaviyo: subscription request accepted.');
    } catch (error) {
      console.error('Klaviyo:', error);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', sendToKlaviyo, {
      once: true
    });
  } else {
    sendToKlaviyo();
  }
})();
</script>
