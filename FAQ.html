<style>
  :root {
    --faq-red1: #ff2d2d;
    --faq-red2: #c80010;
    --faq-bg: #1a1a1a;
    --faq-radius: 14px;
    --faq-font: "Montserrat", -apple-system, "SF Pro Display", sans-serif;
  }

  .faq {
    font-family: var(--faq-font);
  }

  .faq-toggle {
    width: 100%;
    padding: 22px;
    border: none;
    border-radius: var(--faq-radius);
    cursor: pointer;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(180deg, var(--faq-red1), var(--faq-red2));
    box-shadow:
      0 4px 20px rgba(200, 0, 16, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  .faq.open .faq-toggle {
    border-radius: 14px 14px 0 0;
  }

  .faq-toggle span {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .faq-arrow {
    transition: transform 0.3s;
  }

  .faq.open .faq-arrow {
    transform: rotate(180deg);
  }

  .faq-drawer {
    overflow: hidden;
    max-height: 0;
    background: var(--faq-bg);
    border-radius: 0 0 var(--faq-radius) var(--faq-radius);
    transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .faq-grid {
    display: grid;
    grid-template-columns: 1fr;
  }

  @media (min-width: 768px) {
    .faq-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  .faq-item {
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  @media (min-width: 768px) {
    .faq-item {
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .faq-item:nth-child(even) {
      border-right: none;
    }
  }

  .faq-question {
    width: 100%;
    background: none;
    border: none;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 18px 22px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-align: left;
  }

  .faq-question:hover {
    background: rgba(255, 255, 255, 0.05);
  }

  .faq-icon {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: 0.3s;
  }

  .faq-item.active .faq-icon {
    transform: rotate(45deg);
    background: rgba(255, 45, 45, 0.3);
    color: #ff4d4d;
  }

  .faq-answer {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition:
      max-height 0.35s ease,
      opacity 0.3s ease;
  }

  .faq-item.active .faq-answer {
    opacity: 1;
  }

  .faq-answer p {
    margin: 0;
    padding: 0 22px 18px;
    font-size: 13px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.7);
  }
</style>

<div class="faq">
  <button class="faq-toggle">
    <span>
      FAQ
      <span class="faq-arrow">▼</span>
    </span>
  </button>

  <div class="faq-drawer">
    <div class="faq-grid" id="faqContainer"></div>
  </div>
</div>

<script>
  const faqData = [
    {
      q: "Is this promotion valid Australia wide?",
      a: "Yep! My Reno Rules is open to eligible residents across Australia. As always, entries must comply with the official Terms and Conditions and any applicable state regulations. Please refer to the T&C for any questions or queries.",
    },
    {
      q: "Is this an ongoing payment?",
      a: "Nope. Entries for this promotion are one-off purchases unless you specifically choose a membership product that renews. If something is recurring, we’ll always make that crystal clear before checkout.",
    },
    {
      q: "Are members in the draw?",
      a: "Absolutely. LMCT+ members are always part of the fun. Depending on your membership tier and length a member will be the amount of entries into this absolutely life changing draw.",
    },
    {
      q: "When do my entries get added to the draw?",
      a: "Pretty quickly! Once your purchase or eligible action is completed and processed, your entries are automatically added to the draw. In most cases they’ll appear in your account shortly after checkout. And if you’re a member, your member allocated entries should be in there already.",
    },
    {
      q: "How is the winner selected?",
      a: "The winner is chosen through a random electronic draw conducted in accordance with the official Terms and Conditions. Our random draw is independently scrutinised and also checked and signed off by NSF Global.",
    },
    {
      q: "When will the winners be announced?",
      a: "The winner will be announced during the live My Reno Rules Final Episode on the 2nd of June commencing at 7pm AEST. Remember that the winner has 3 minutes to answer the call otherwise we’ll be redrawing the winner during the Live TV Show episode until we get a winner! How exciting.",
    },
    {
      q: "How will the winner be contacted?",
      a: "If you’re the lucky legend, we’ll reach out using the contact details you provided when entering — usually phone and/or email (if not initially contactable or the mobile doesn't work).",
    },
    {
      q: "What happens if the winner doesn't respond?",
      a: "This giveaway is special, you guys always ask for a redraw so in this giveaway once the winner is drawn and we make initial contact, they have 3 minutes to answer and call back. If 3 minutes have passed, we will redraw Live during the show and onto the next. This will repeat until someone answers! So keep that phone close and make sure you are watching My Reno Rules Live.",
    },
    {
      q: "Is the draw live and how do we watch it?",
      a: "All LMCT+ Major draws are broadcast live (on Facebook), so the community can watch the excitement unfold. For this giveaway it will be streamed live during the My Reno Rules show on Channel 7 starting at 7pm AEST.",
    },
    {
      q: "Can I choose cash instead of the advertised prize?",
      a: "Often you can! With this promotion you have the choice of the Prize House or $2,000,000 Tax Free Cash.",
    },
    {
      q: "How long does it take to receive the prize or cash?",
      a: "Once the winner is verified and paperwork is sorted, we’ll organise delivery of the prize or transfer of the cash as soon as reasonably possible. We know you won’t want to wait too long!",
    },
    {
      q: "Are there any costs involved in claiming the prize?",
      a: "In most cases, LMCT+ covers the major prize costs. However, depending on the prize, some costs like travel, insurance, or registration transfers may apply, unless stated otherwise. Have a look at the T&C and if there are any further questions you can reach out - support@lmctplus.com",
    },
    {
      q: "Is this giveaway legally registered and compliant?",
      a: "Yes. All LMCT+ promotions operate in accordance with relevant Australian trade promotion regulations, including permits or notifications where required.",
    },
    {
      q: "Are purchases refundable or transferable?",
      a: "Generally no. Once entries or promotional purchases are processed, they are non-refundable and non-transferable, unless required under Australian Consumer Law.",
    },
  ];

  /* Render FAQ items */

  const container = document.getElementById("faqContainer");

  faqData.forEach((item) => {
    const el = document.createElement("div");
    el.className = "faq-item";

    el.innerHTML = `
  <button class="faq-question">
    <span>${item.q}</span>
    <span class="faq-icon">+</span>
  </button>

  <div class="faq-answer">
    <p>${item.a}</p>
  </div>
  `;
    container.appendChild(el);
  });

  /* FAQ logic */

  document.querySelectorAll(".faq").forEach((faq) => {
    const toggle = faq.querySelector(".faq-toggle");
    const drawer = faq.querySelector(".faq-drawer");

    toggle.addEventListener("click", () => {
      faq.classList.toggle("open");

      if (faq.classList.contains("open")) {
        drawer.style.maxHeight = drawer.scrollHeight + "px";
      } else {
        drawer.style.maxHeight = null;

        faq.querySelectorAll(".faq-item.active").forEach((item) => {
          item.classList.remove("active");
          item.querySelector(".faq-answer").style.maxHeight = null;
        });
      }
    });

    faq.querySelectorAll(".faq-question").forEach((btn) => {
      btn.addEventListener("click", () => {
        const item = btn.parentElement;
        const answer = item.querySelector(".faq-answer");

        faq.querySelectorAll(".faq-item.active").forEach((open) => {
          if (open !== item) {
            open.classList.remove("active");
            open.querySelector(".faq-answer").style.maxHeight = null;
          }
        });

        item.classList.toggle("active");

        if (item.classList.contains("active")) {
          answer.style.maxHeight = answer.scrollHeight + "px";
        } else {
          answer.style.maxHeight = null;
        }

        /* FIX: wait for animation then resize drawer */
        setTimeout(() => {
          drawer.style.maxHeight = drawer.scrollHeight + "px";
        }, 350);
      });
    });
  });
</script>
